        subheadline: Integra en minutos. Protéjase contra amenazas al instante.
        primary_cta: Obtener clave API
        secondary_cta: Explora todas las API
      view_case: Ver caso
    places:
      meta_title: Lugares API | Requiems API
      hero:
        headline: Cree aplicaciones globales sin fricciones de ubicación.
        subheadline: API de zona horaria, días festivos y geolocalización para productos listos para el mundo que funcionan en todas partes.
        primary_cta: Obtener clave API
        secondary_cta: Empieza gratis
      strategy_call:
        label: Reserve una llamada de estrategia
      tagline: Estas historias tratan sobre relojes, calendarios y direcciones que se estropean cuando te globalizas. Destacan las API que tienen matices regionales para que su producto no tenga que tenerlos.
      filters:
      - key: todo
        label: Todos los casos
      - key: zona horaria
        label: Zona horaria
      - key: hora_mundial
        label: hora mundial
      - key: días_laborables
        label: calculadora de días laborables
      - key: vacaciones
        label: Vacaciones
      - key: geocodificar
        label: Geocodificar
      - key: postal
        label: Código Postal
      - key: ciudades
        label: Ciudades
      featured_cases: []
      use_cases:
      - filter_key: zona horaria
        endpoint: GET /v1/places/timezone
        title: Registro local y recordatorios que coinciden con la hora de la propiedad
        description: Alinee los horarios con las zonas horarias locales. Reduzca la confusión para los viajeros y los equipos distribuidos.
        tag_problem: Gestión del tiempo
        tag_industry: Viajar
        case_anchor: zona horaria del caso
        example: Un alquiler vacacional almacena cada propiedad en una zona horaria de la IANA. Los correos electrónicos y SMS de confirmación utilizan conversión del lado del servidor, por lo que “check-in a las 4:00 p. m.” siempre significa reloj de pared local.
      - filter_key: geocodificar
        endpoint: GET /v1/places/geocode
        title: Convierta las direcciones en pines a los que el envío puede enrutarse
        description: Convierta direcciones en coordenadas al instante. Acelere mapas, entrega y búsqueda.
        tag_problem: Geocodificación
        tag_industry: Logística
        case_anchor: caso-geo
        example: El despacho recibe "123 Main St, Austin". Geocode devuelve latitud/lng y dirección normalizada; la aplicación del conductor dirige al pin en lugar del ambiguo centro de la ciudad.
      - filter_key: postal
        endpoint: GET /v1/places/postal/{code}
        title: Bloquee códigos postales incorrectos antes de que se impriman las etiquetas
        description: Validar códigos postales para envíos globales. Detecte direcciones incorrectas antes de que salgan del almacén.
        tag_problem: Validación de dirección
        tag_industry: Comercio electrónico
        case_anchor: caso-geo
        example: El proceso de pago valida el formato postal con el país seleccionado antes de la compra de la etiqueta. Las discrepancias del PLZ alemán de 5 dígitos bloquean el pedido con un error a nivel de campo en lugar de una etiqueta de devolución.
      - filter_key: vacaciones
        endpoint: GET /v1/places/holidays
        title: Envío y soporte cuando cada mercado esté realmente abierto
        description: Evite los días festivos en todos los mercados con reglas de fechas. Realice envíos con confianza a través de regiones.
        tag_problem: Localización
        tag_industry: SaaS global
        case_anchor: vacaciones-caso
        example: La automatización de versiones comprueba los días festivos para DE, BR y JP. Las implementaciones que aterrizarían en un día festivo se posponen al siguiente día hábil con un resumen de Slack para los PM.
      - filter_key: días_laborables
        endpoint: GET /v1/places/working-days
        title: Fechas de SLA que respetan los fines de semana y feriados regionales
        description: Calcular los días laborables en todos los países. Recursos humanos y operaciones detienen la gimnasia con hojas de cálculo.
        tag_problem: programación de trabajo
        tag_industry: HORA
        case_anchor: zona horaria del caso
        example: HRIS calcula las fechas de vencimiento de los SLA de los casos, excluyendo fines de semana y días festivos específicos del país para el sitio de cada empleado. Los representantes obtienen el mismo número en la interfaz de usuario y en el registro de auditoría exportado.
      - filter_key: hora_mundial
        endpoint: GET /v1/places/time/{timezone}
        title: Relojes de mercado que sobreviven al horario de verano sin revisiones
        description: Muestra relojes precisos para cada ciudad. Genere confianza en las IU comerciales, de soporte y de programación.
        tag_problem: hora mundial
        tag_industry: tecnología financiera
        case_anchor: zona horaria del caso
        example: Un pie de página del panel de operaciones indica la hora mundial para los códigos de sede de Nueva York, Londres y Tokio. El horario de verano cambia de pista automáticamente; Los ingenieros no envían revisiones de emergencia dos veces al año.
      scale_metrics:
