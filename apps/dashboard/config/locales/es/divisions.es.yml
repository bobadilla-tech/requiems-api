    validation:
      meta_title: API de validación | Requiems API
      hero:
        headline: Valide los datos antes de que dañen su aplicación.
        subheadline: Detenga los correos electrónicos incorrectos, los teléfonos no válidos y el contenido tóxico con API que detectan los problemas en el origen.
        primary_cta: Obtener clave API
        secondary_cta: Empieza gratis
      strategy_call:
        label: Reserve una llamada de estrategia
      tagline: 'Estas historias tratan sobre datos incorrectos antes de que se agraven: registros falsos, números incorrectos y textos riesgosos. Están escritos para equipos que necesitan un camino rápido y creíble hacia aportes más limpios.'
      filters:
      - key: todo
        label: Todos los casos
      - key: validador de correo electrónico
        label: Validador de correo electrónico
      - key: validación_del_teléfono
        label: Validación telefónica
      - key: filtro_blasfemias
        label: Filtro de malas palabras
      featured_cases: []
      use_cases:
      - filter_key: validador de correo electrónico
        endpoint: POST /v1/validation/email
        title: Detecte direcciones incorrectas antes de las campañas y la sincronización de CRM
        description: Evite que correos electrónicos no válidos ingresen a su base de datos. Las listas más limpias significan una mejor capacidad de entrega y menos gastos desperdiciados.
        tag_problem: Validación de correo electrónico
        tag_industry: Marketing
        case_anchor: rebotes-de-correo-electrónico-de-casos
        example: Un flujo de registro de SaaS solicita la validación del correo electrónico después del desenfoque. Los dominios desechables y los errores tipográficos se rechazan antes de enviar el correo electrónico de bienvenida; el soporte técnico deja de corregir direcciones con "una letra incorrecta".
      - filter_key: validación_del_teléfono
        endpoint: GET /v1/validation/phone
        title: Llegue a cifras reales en flujos de SMS y OTP
        description: Validar números de teléfono para campañas de SMS. Llegue a usuarios reales y elimine los envíos fallidos.
        tag_problem: Validación telefónica
        tag_industry: Comercio electrónico
        case_anchor: entrega-de-caso-sms
        example: Una marca de comercio electrónico valida E.164 y el tipo de línea en el paso OTP. Los números de teléfono fijo o no válidos nunca llegan a la puerta de enlace de SMS, lo que reduce el costo de OTP y los tickets de entrega fallida.
      - filter_key: filtro_blasfemias
        endpoint: POST /v1/validation/profanity
        title: Mantenga los feeds públicos y los foros civiles a escala
        description: Filtre malas palabras en el contenido generado por el usuario. Mantenga las comunidades seguras sin revisión manual de cada publicación.
        tag_problem: Moderación de contenido
        tag_industry: redes sociales
        case_anchor: comentarios-case-toxic
        example: Una aplicación comunitaria ejecuta el texto de los comentarios a través de un filtro de malas palabras en el lado del servidor. Se bloquea el abuso obvio; Las publicaciones dudosas se ponen en cola para revisión del moderador en lugar de publicarse.
      - filter_key: validador de correo electrónico
        endpoint: POST /v1/validation/email
        title: Registro corporativo más rápido con menos reintentos de TI
        description: Optimice la incorporación con comprobaciones de correo electrónico en el borde. Menos reintentos, menos tickets de soporte.
        tag_problem: Experiencia de usuario
        tag_industry: SaaS
        case_anchor: rebotes-de-correo-electrónico-de-casos
        example: El autoservicio empresarial comprueba el dominio y MX antes de enviar invitaciones de SSO. Los hosts muertos y los errores tipográficos fallan rápidamente, por lo que TI no está esperando rebotes que nunca aparecen en la interfaz de usuario.
      - filter_key: validación_del_teléfono
        endpoint: GET /v1/validation/phone
        title: Validar los datos del suscriptor antes de la portabilidad y los boletos.
        description: Detecte los errores del teléfono antes de que causen problemas posteriores. El soporte dedica tiempo a problemas reales.
        tag_problem: Calidad de datos
        tag_industry: telecomunicaciones
        case_anchor: entrega-de-caso-sms
        example: Un portal de operador valida los números de suscriptores cuando un cliente presenta una solicitud de portabilidad. Las malas entradas regresan el mismo día en lugar de después de una semana de abandono de "número no encontrado".
      - filter_key: filtro_blasfemias
        endpoint: POST /v1/validation/profanity
        title: Moderación del chat en el juego sin enormes listas de bloqueo de clientes
        description: Modere el texto automáticamente para plataformas más seguras. Aumente la confianza y la seguridad con su producto.
        tag_problem: Seguridad del contenido
        tag_industry: Juego de azar
        case_anchor: comentarios-case-toxic
        example: El chat del juego se comprueba al enviar. Las cadenas de alto riesgo se omiten o se enmascaran; los remitentes repetidos obtienen un tiempo de reutilización sin enviar una enorme lista de bloqueo en el paquete del cliente.
      scale_metrics:
      - value: 99,99%
        label: Objetivo de tiempo de actividad de la plataforma
      - value: ~500ms
        label: Tiempo promedio de respuesta de API
      - value: 10,000+
        label: Validaciones máximas por minuto (según el nivel)
      how_it_works:
        step1_title: Elige un patrón que te suene familiar
        step1_body: Elija una tarjeta que refleje dónde pierde tiempo hoy (rebotes, fallas de SMS o UGC ruidoso). Cada resultado se asigna a puntos finales que puede probar con un pequeño cambio en su formulario o canalización.
        step2_title: Conéctelo a su pila
        step2_body: Utilice los ejemplos de referencia, agregue su clave API y llame a los puntos finales HTTPS desde su backend o borde. La mayoría de los equipos envían la primera versión la misma semana en que leen los documentos.
        step3_title: Demuéstralo con tus propias métricas
        step3_body: 'Compare el antes y el después en paneles en los que ya confía: menos fallas, colas más cortas, soporte más tranquilo o páginas más rápidas una vez que las malas entradas dejan de propagarse.'
