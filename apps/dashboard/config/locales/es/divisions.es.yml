      - name: Verigeo
        role: verigeo.pe
        quote: Los registros falsos fueron un verdadero problema para nosotros. Las API de validación de Requiems detuvieron los datos incorrectos en la puerta sin agregar fricción a los usuarios reales.
      - name: Fuerza de compilación
        role: compilastrength.com
        quote: Confiamos en la validación de Requiems para mantener limpia nuestra base de datos de usuarios y sus servicios de reconocimiento para brindar una experiencia personalizada a cada atleta.
      final_cta:
