      use_cases:
      - filter_key: papelera
        endpoint: GET /v1/finance/bin/{bin}
        title: Menos rechazos falsos al finalizar la compra
        description: Enriquezca los metadatos de la tarjeta para riesgo y enrutamiento. Reduzca la fricción con el buen cliente sin dejar de cumplir con las normas.
        tag_problem: Pagos
        tag_industry: tecnología financiera
        case_anchor: contenedor de cajas
        example: La autorización envía los primeros 8 dígitos PAN (o el equivalente del token) a la búsqueda de BIN; El país emisor y el tipo de producto alimentan su motor de reglas para que el débito nacional deje de calificarse como el crédito transfronterizo.
      - filter_key: iban
        endpoint: GET /v1/finance/iban/{iban}
        title: Pagos más limpios con validación de IBAN
        description: Valide las cuentas bancarias antes de que se mueva el dinero. Detenga los costosos ciclos de reparación a posteriori.
        tag_problem: Pagos
        tag_industry: Mercados
        case_anchor: caso-iban
        example: La incorporación del vendedor valida la suma de verificación y la longitud del IBAN para el país seleccionado antes de crear un perfil de pago. Las cuentas no válidas devuelven errores de campo en lugar de archivos por lotes fallidos del banco.
      - filter_key: rápido
        endpoint: GET /v1/finance/swift/{code}
        title: Enrutamiento bancario más rápido con búsquedas SWIFT
        description: Confirme los metadatos de la institución para transferencias y cumplimiento. Reducir la investigación manual para los equipos financieros.
        tag_problem: Datos bancarios
        tag_industry: Operaciones financieras
        case_anchor: caso-rápido
        example: El analista pega BIC en las herramientas de operaciones; La búsqueda devuelve metadatos del nombre de la institución, la ciudad y la sucursal para el PDF de confirmación de la transferencia. Las exportaciones CSV incluyen los mismos campos para los auditores.
      - filter_key: cripto
        endpoint: GET /v1/finance/crypto/{symbol}
        title: Precios en tiempo real para activos digitales
        description: Muestre precios criptográficos confiables en la aplicación. Mantenga las cotizaciones alineadas con lo que esperan los usuarios.
        tag_problem: Precios
        tag_industry: Aplicaciones criptográficas
        case_anchor: caso-fx
        example: Las encuestas domésticas de Wallet indican precios spot para BTC y ETH cada 30 segundos con claves de caché compartidas. La revisión comercial muestra la misma identificación instantánea que el mosaico de la cartera para que los usuarios no vean dos números diferentes.
      - filter_key: fx
        endpoint: GET /v1/finance/exchange-rate
        title: Totales de pago más justos en todo el mundo
        description: Convierta con tarifas transparentes. Reduzca las disputas y los carritos abandonados en pedidos internacionales.
        tag_problem: Multidivisa
        tag_industry: Comercio electrónico
        case_anchor: caso-fx
        example: El subtotal del carrito se almacena en EUR del comerciante; La actualización del botón de pago obtiene la tasa media del mercado en USD más su regla de redondeo. El recibo por correo electrónico incluye la marca de tiempo de la tarifa para que CS coincida con el monto cobrado.
      - filter_key: inflación
        endpoint: GET /v1/finance/inflation
        title: Mejores datos de planificación para los equipos financieros
        description: Inflación y datos de referencia para modelos y divulgaciones. Envíe conocimientos sin crear canales de datos.
        tag_problem: Analítica
        tag_industry: Finanzas
        case_anchor: caso-fx
        example: 'La hoja de FP&A se publica el lunes en el cron: extraiga el IPC interanual para EE. UU. y la UE, escriba las celdas utilizadas por las macros de pronóstico. Los mazos citan la misma identificación de serie que la wiki interna sin copiar y pegar de sitios de noticias aleatorios.'
