      view_case: Ver caso
    networking:
      meta_title: API de redes e Internet | Requiems API
      hero:
        headline: Proteja su red con inteligencia en tiempo real.
        subheadline: Geolocalización de IP, búsquedas de dominios y detección de amenazas para equipos de infraestructura y seguridad.
        primary_cta: Obtener clave API
        secondary_cta: Empieza gratis
      strategy_call:
        label: Reserve una llamada de estrategia
      tagline: 'Estas historias tratan sobre lo que sucede en el borde de su red: sesiones riesgosas, geografía poco clara y trabajo de dominio frágil. Destacan las API que puede integrar más rápido de lo que puede dotar de personal a un equipo de señales completo.'
      filters:
      - key: todo
        label: Todos los casos
      - key: ip_geo
        label: Geolocalización de IP
      - key: asn
        label: búsqueda de ASN
      - key: VPN
        label: Detección de VPN y proxy
      - key: quién es
        label: búsqueda de WHOIS
      - key: dominio
        label: información de dominio
      - key: mx
        label: búsqueda MX
      - key: desechable
        label: Comprobador de dominio desechable
      featured_cases: []
      use_cases:
      - filter_key: VPN
        endpoint: GET /v1/networking/ip/vpn/{ip}
        title: Marcar sesiones de inicio de sesión riesgosas detrás de VPN y servidores proxy
        description: Detecta VPN y servidores proxy para inicios de sesión seguros. Detenga los ataques programados antes de que lleguen a su aplicación.
        tag_problem: Detección de amenazas
        tag_industry: Ciberseguridad
        case_anchor: caso-fraude
        example: En cada inicio de sesión, la API califica la IP del cliente para las señales de VPN, Tor y del centro de datos. Las sesiones de alto riesgo obtienen MFA intensificada; el tráfico residencial limpio se mantiene sin fricciones.
      - filter_key: ip_geo
        endpoint: GET /v1/networking/ip/{ip}
        title: Personaliza por país sin pedir GPS
        description: Diríjase a los usuarios por ubicación para obtener servicios personalizados. Menos ofertas no coincidentes y análisis más claros.
        tag_problem: inteligencia de propiedad intelectual
        tag_industry: Comercio electrónico
        case_anchor: caso-geo
        example: Un escaparate resuelve el país y la región desde la IP del navegador para mostrar estimaciones de envío y copia de impuestos sin solicitar GPS. Las pruebas A/B utilizan la misma señal para la conversión geográfica.
      - filter_key: dominio
        endpoint: GET /v1/networking/domain/{domain}
        title: Automatizar las comprobaciones de dominio en los flujos de registro
        description: Verifique dominios al instante para plataformas de registro. Muévase más rápido que las búsquedas manuales.
        tag_problem: búsqueda de dominio
        tag_industry: SaaS
        case_anchor: dominio de caso
        example: Un flujo de trabajo de registrador solicita información del dominio antes de cargar la tarjeta. Los patrones estacionados, suspendidos o con errores tipográficos fallan temprano en lugar de hacerlo después de que se ejecuta la cola de cumplimiento.
      - filter_key: asn
        endpoint: GET /v1/networking/ip/asn/{ip}
        title: Enriquezca los boletos de NOC con ASN y contexto ascendente
        description: Optimice el rendimiento de la red con datos de enrutamiento. Depure problemas de emparejamiento y ruta con confianza.
        tag_problem: Análisis de red
        tag_industry: telecomunicaciones
        case_anchor: caso-fraude
        example: Cuando traceroute parece incorrecto, operaciones pega el ASN de la IP sospechosa en una herramienta interna. El nombre de la organización y los flujos ascendentes aparecen en el ticket para que los pares respondan con contexto, no con capturas de pantalla.
      - filter_key: quién es
        endpoint: GET /v1/networking/whois/{domain}
        title: Historial de WHOIS exportable para auditorías legales y de marca
        description: Automatice las auditorías de dominio para los requisitos reglamentarios. Mantenga registros consistentes y con capacidad de búsqueda.
        tag_problem: Gestión de dominios
        tag_industry: Legal
        case_anchor: dominio de caso
        example: 'La protección de marca realiza un trabajo semanal en los dominios de AbuseDB: los campos de WHOIS se normalizan y almacenan para que el departamento legal pueda exportar un CSV fechado como evidencia de eliminación.'
      - filter_key: mx
        endpoint: GET /v1/networking/mx/{domain}
        title: Valide los servidores de correo antes de grandes envíos
        description: Garantice la capacidad de entrega del correo electrónico con comprobaciones del servidor. Capture el correo mal configurado antes de enviarlo.
        tag_problem: Infraestructura de correo electrónico
        tag_industry: Marketing
        case_anchor: dominio de caso
        example: Antes de una campaña de envío de 50 000, el marketing valida que cada dominio de destinatario tenga hosts MX activos. Las filas a las que les falta intercambio de correo se ponen en cuarentena para que la reputación de ESP no se deteriore.
      scale_metrics:
      - value: 99,99%
        label: Objetivo de tiempo de actividad de la plataforma
      - value: ~500ms
        label: Tiempo promedio de respuesta de API
      - value: 200+
        label: Países y territorios en el directorio
      how_it_works:
        step1_title: Elige un patrón que te suene familiar
        step1_body: Elija una tarjeta que refleje cómo el tráfico llega a su ventaja (señales de fraude, contexto del país o comprobaciones de dominio). Cada resultado se asigna a puntos finales que son más fáciles de ejecutar aquí que de poseer a largo plazo.
        step2_title: Conéctelo a su pila
        step2_body: Utilice los ejemplos de referencia, agregue su clave API y llame a los puntos finales HTTPS desde su backend o borde. La mayoría de los equipos envían la primera versión la misma semana en que leen los documentos.
        step3_title: Demuéstralo con tus propias métricas
        step3_body: 'Compare el antes y el después en paneles en los que ya confía: menos fallas, colas más cortas, soporte más tranquilo o páginas más rápidas una vez que las malas entradas dejan de propagarse.'
      industries:
      - Ciberseguridad
      - Comercio electrónico
      - Plataformas SaaS
      - Marketing y correo electrónico
      - telecomunicaciones
      - Legal y cumplimiento
      testimonials: []
      final_cta:
