      billing:
        a1: Cada llamada a la API cuesta 1 solicitud. Tu plan incluye una asignación
          mensual de solicitudes que se restablece al inicio de cada período de facturación.
          Algunos endpoints pueden contar como más de 1 solicitud; esto siempre se
          indica explícitamente en la documentación de ese endpoint.
        a2: Cuando alcances el 75% de tu cuota, te enviaremos una alerta. Al 90%,
          recibirás otra advertencia. Si alcanzas el 100%, las solicitudes a la API
          devolverán un error 429 hasta que actualices tu plan o esperes tu próximo
          ciclo de facturación.
        a3: "¡Sí! Puedes cambiar tu plan en cualquier momento desde tu panel de facturación.
          Las actualizaciones surten efecto de inmediato. Las reducciones surten efecto
          al inicio de tu próximo período de facturación."
        a4: No, las solicitudes no utilizadas no se acumulan para el mes siguiente.
          Tu asignación de solicitudes se restablece al inicio de cada período de
          facturación. Recomendamos elegir un plan que se ajuste a tu uso mensual
          típico.
