          text: El uso de tu API está sujeto a límites de tasa basados en tu plan
            de suscripción. Superar estos límites puede resultar en la suspensión
            temporal del acceso a la API o cargos adicionales.
      billing:
        heading: 3. Facturación y pagos
        overages:
          heading: 3.3 Excedentes
          text: Si superas la cuota mensual de solicitudes de tu plan, las solicitudes
            a la API serán bloqueadas con un error 429. Actualiza tu plan para restaurar
            el acceso.
        plans:
          heading: 3.1 Planes de suscripción
          text: Los planes de pago se facturan mensual o anualmente por adelantado.
            Todos los honorarios no son reembolsables, excepto cuando lo exija la
            ley o se indique explícitamente en estos términos.
        trials:
          heading: 3.2 Pruebas gratuitas
          text: Los planes de pago mensuales incluyen una prueba gratuita de 7 días.
            No se te cobrará hasta que finalice el período de prueba. Puedes cancelar
            en cualquier momento durante el período de prueba.
      changes:
        heading: 9. Cambios en los términos
        text: Nos reservamos el derecho de modificar estos términos en cualquier momento.
          Te notificaremos de cambios importantes por correo electrónico. El uso continuado
          de la API después de los cambios constituye la aceptación de los nuevos
          términos.
