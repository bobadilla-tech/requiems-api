        subheadline: "Autenticación, validación, detección de fraude, inteligencia de pagos y datos globales, entregados a través de una API unificada."
        primary_cta: "Obtener clave API"
        secondary_cta: "Ver divisiones"
      grid_heading: "Sistemas de nivel producción"
      grid_subheading: "Cada sistema combina señales propietarias en una decisión estructurada única, entregada en una sola llamada a la API."
      explore_cta: "Explorar sistema"
      utilities_kicker: "Extras"
      utilities_cta: "Ver utilidades"
      apis_catalog_title: "Explorar el directorio completo de APIs"
      apis_catalog_subtitle: "Cada endpoint activo y en beta en un catálogo buscable. La misma clave API, documentación coherente y ejemplos listos para copiar."
      apis_catalog_cta: "Ver APIs"
      cards:
        identity_risk:
          title: "Sistema de identidad y riesgo"
