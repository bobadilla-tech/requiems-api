      faq:
        heading: "Preguntas frecuentes"
        support_prompt: "¿Aún tienes preguntas?"
        support_link: "Contacta con soporte"
        q1: "¿Qué es un BIN?"
        a1: "El BIN (Número de Identificación Bancaria), también llamado IIN (Número de Identificación del Emisor), son los primeros 6 a 8 dígitos de una tarjeta de pago. Identifica la red de la tarjeta (Visa, Mastercard, etc.), el banco emisor, el tipo de tarjeta (crédito/débito) y el país de emisión."
        q2: "¿La API admite BIN de 8 dígitos?"
        a2: "Sí. El punto final acepta prefijos de 6 a 8 dígitos. Para entradas de 8 dígitos, primero intenta una coincidencia exacta y, si no encuentra ningún registro de 8 dígitos, recurre al prefijo de 6 dígitos."
        q3: "¿Qué significa el índice de confianza?"
        a3: "El indicador de confianza (0,00–1,00) refleja la calidad de los datos. Los registros confirmados a través de múltiples fuentes de datos independientes obtienen una puntuación más alta. Una puntuación superior a 0,85 indica datos de alta confianza, con información bancaria y de país verificada a partir de más de una fuente."
        q4: "¿Por qué a veces el campo issuer_name está vacío?"
        a4: "No todos los BIN del conjunto de datos público tienen información asociada del nombre del banco. El índice de confianza será menor para estos registros. Los campos de cadena vacía indican que los datos no están disponibles para ese BIN."
        q5: "¿Es de uso gratuito?"
        a5: "La demostración anterior funciona sin necesidad de una cuenta. Existen planes de pago para escalado a producción con límites de uso más altos y acceso completo a la API."
