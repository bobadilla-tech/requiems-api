    vpn_detection:
      seo:
        title: "API gratuita de detección de VPN y proxy — Puntuación de amenaza y fraude por IP | Requiems API"
        description: "Detecta si una dirección IP pertenece a una VPN, proxy, nodo de salida Tor o proveedor de hosting. Obtén puntuaciones de amenaza e indicadores de fraude para prevención de fraude y evaluación de riesgo — gratis, sin necesidad de cuenta."
      logo_marquee:
        trusted_by: "Con la confianza de los equipos en"
      hero:
        title: "Descubre si esa IP está ocultando algo."
        subtitle: "Detecta VPNs, proxies, nodos de salida Tor y proveedores de hosting a partir de cualquier dirección IP, además de una puntuación de amenaza y de fraude, en una sola llamada a la API."
        cta_primary: "Obtén tu API key gratis"
        cta_docs: "Ver documentación"
        placeholder: "Ingresa una dirección IP (ej: 8.8.8.8)"
        submit: "Verificar IP"
        no_account: "No se requiere cuenta para la demo."
        label_input: "Dirección IP"
      what_it_does:
        coverage_badge: "Cobertura"
        coverage_heading: "Detección de VPN, proxy, Tor y hosting en una sola consulta."
        coverage_body: "VPN & Proxy Detection usa la base de datos IP2Proxy para identificar proveedores de VPN, proxies públicos y web, nodos de salida Tor e IPs de centros de datos o hosting. Los datos de organización ASN provienen de una base de datos MaxMind independiente. Se admiten tanto IPv4 como IPv6."
        simplicity_badge: "Sencillez"
        simplicity_heading: "Una solicitud GET. Sin cuerpo, sin análisis."
        simplicity_body: "Incluye la dirección IP en la ruta de la URL. Tu clave API en el encabezado. La respuesta es JSON plano con indicadores booleanos, una puntuación de amenaza y una puntuación de fraude que puedes usar directamente."
      use_cases:
        heading: "Diseñado para flujos de fraude y riesgo."
        subheading: "VPN & Proxy Detection encaja en cualquier lugar donde importe la confianza basada en IP: registro, autenticación, bots y compliance."
        signup_title: "Evalúa el riesgo al registrarse"
        signup_desc: "Marca o bloquea registros provenientes de IPs de VPN, proxy o Tor: una señal fuerte de granjas de fraude y creación de cuentas falsas."
        signup_tags: "Prevención de fraude, Fintech"
        auth_title: "Suma señales de riesgo a la autenticación"
        auth_desc: "Activa autenticación reforzada (MFA) cuando un intento de inicio de sesión provenga de un proxy o nodo Tor marcado."
        auth_tags: "Evaluación de riesgo, Autenticación"
        bot_title: "Detecta bots y rastreadores"
        bot_desc: "Las IPs de hosting y centros de datos se correlacionan fuertemente con bots y scrapers. Marca o limita automáticamente el tráfico de estos rangos."
        bot_tags: "Detección de bots, Prevención de abuso"
        compliance_title: "Cumple con requisitos normativos y de compliance"
        compliance_desc: "Los servicios regulados pueden requerir confirmar que las solicitudes no provienen de infraestructura de anonimización antes de otorgar acceso."
        compliance_tags: "Compliance, Regulatorio"
        geoblock_title: "Evita la elusión de restricciones geográficas"
        geoblock_desc: "Detecta usuarios que ocultan su ubicación real con una VPN o proxy para acceder a contenido o precios restringidos por región."
        geoblock_tags: "Acceso a contenido, Geo-bloqueo"
        score_title: "Enriquece modelos de fraude con una sola puntuación"
        score_desc: "Combina la puntuación de fraude y el nivel de amenaza con otras señales (dispositivo, tarjeta, email) en un modelo de fraude compuesto por solicitud."
        score_tags: "Evaluación de riesgo, Prevención de fraude"
      api_combinations:
        heading: "Combínala con otras APIs."
        subheading: "VPN & Proxy Detection funciona aún mejor combinada con otras APIs de Requiems."
        bin_pair: "Detección de VPN + Búsqueda de BIN"
        bin_benefit: "Cruza las señales de amenaza de la IP con el país emisor de la tarjeta para detectar intentos de pago inconsistentes y de alto riesgo."
        identity_pair: "Detección de VPN + Identity Risk"
        identity_benefit: "Combina la puntuación de amenaza basada en IP con señales de riesgo de identidad más amplias para una defensa más sólida contra el robo de cuentas."
        email_pair: "Detección de VPN + Validador de correo"
        email_benefit: "Combina la detección de IPs anonimizadas con la verificación de correos desechables para detectar cuentas falsas al registrarse."
      faq:
        heading: "Preguntas frecuentes"
        support_prompt: "¿Aún tienes preguntas?"
        support_link: "Contactar soporte"
        q1: "¿Qué es VPN & Proxy Detection?"
        a1: "Una API que verifica si una dirección IP pertenece a un proveedor de VPN conocido, un proxy público o web, un nodo de salida Tor o un proveedor de hosting/centro de datos. Devuelve indicadores booleanos para cada categoría, además de una puntuación de amenaza y una puntuación de fraude."
        q2: "¿Qué significan las puntuaciones de amenaza?"
        a2: "La puntuación se calcula así: Tor (+3), VPN (+2), Proxy (+2), Hosting (+1). El nivel de amenaza se deriva de este valor: 0=Ninguno, 1=Bajo, 2-3=Medio, 4-5=Alto, 6+=Crítico."
        q3: "¿Por qué fraud_score es 0 para algunas IPs?"
        a3: "El fraud_score solo está disponible al usar el nivel PX5 o superior de la base de datos IP2Proxy. Los niveles inferiores devuelven 0, lo que indica que el valor no está disponible para la base de datos actual."
        q4: "¿Es compatible con IPv6?"
        a4: "Sí, tanto las direcciones IPv4 como IPv6 son totalmente compatibles."
        q5: "¿Es gratis de usar?"
        a5: "La demo de arriba funciona sin necesidad de cuenta. Hay planes pagos disponibles para escala de producción con límites de solicitudes más altos y acceso completo a la API."
      cta:
        heading: "Automatiza esto con Requiems."
        body: "Una API key. Detección de VPN y proxy, más de 50 APIs adicionales en validación, finanzas, redes y más."
