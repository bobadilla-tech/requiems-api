        label_change_canonicalised_domain: alias resuelto
        label_change_lowercased: minúsculas
        label_change_removed_dots: puntos eliminados
        label_change_removed_plus_tag: etiqueta eliminada
        label_change_trimmed_whitespace: espacios en blanco recortados
        label_changes: Cambios
        label_domain: Dominio
        label_local: Parte local
        label_normalized: Normalizado
        no_changes: ninguno
        submit: Normalizar
      faq:
        a1: Elimina las etiquetas (por ejemplo, +label), convierte la dirección a minúsculas y elimina las peculiaridades de formato específicas del proveedor para que las variantes de la misma dirección se correspondan con una forma canónica.
        a2: Sí. Ambos están normalizados. La parte local se convierte a minúsculas y se eliminan los sufijos específicos del proveedor. El dominio se convierte a minúsculas y se resuelve mediante alias cuando es posible.
        a3: La capitalización se corrige mediante la conversión a minúsculas. Los espacios no son válidos en las direcciones de correo electrónico según la RFC 5321 y se eliminan si están presentes.
        a4: Sí. Se admiten direcciones de correo electrónico Unicode en dominios internacionalizados. La normalización del dominio aplica la conversión a minúsculas y la resolución de alias; la codificación de los nombres de dominio internacionalizados depende del proveedor de correo subyacente.
        a5: La demostración interactiva no requiere cuenta. Tras registrarse, puede acceder a un plan gratuito con un límite de solicitudes mensuales. Consulte la página de precios para conocer los límites.
        heading: Preguntas frecuentes
        q1: "¿Qué hace exactamente Email Normalizer?"
        q2: "¿Normaliza el dominio y la parte local?"
        q3: "¿Puede corregir el uso de mayúsculas y espacios?"
        q4: "¿Funciona con correos electrónicos internacionales?"
        q5: "¿Es gratuita la versión de demostración?"
      hero:
        subtitle: Normaliza, convierte a minúsculas, recorta y canonicaliza las direcciones de correo electrónico en una sola llamada a la API.
        title: Limpia automáticamente las direcciones de correo electrónico, siempre.
      show:
        free_email_normalizer_lowercase_trim: "Normalizador de correo electrónico gratuito: convierte a minúsculas, recorta y canonicaliza direcciones de correo electrónico | API de Requiems"
      use_cases:
        analytics_context: Analítica
        analytics_desc: Estandarice los datos en el punto de captura. Mantenga la coherencia en los análisis y la segmentación, independientemente de cómo los usuarios escriban su dirección.
        analytics_title: Normalizar los correos electrónicos de registro para análisis
        crm_dedup_context: CRM / Datos
        crm_dedup_desc: Utilice el formato normalizado como clave de deduplicación. Identifique las cuentas que pertenecen a la misma persona en diferentes formatos de correo electrónico.
        crm_dedup_title: Combinar cuentas duplicadas con correos electrónicos normalizados
        crm_dup_context: CRM / Datos
        crm_dup_desc: Deja de tratar las variantes de correo electrónico como contactos separados. La normalización reduce el número excesivo de contactos y mejora la higiene de las listas.
        crm_dup_title: Reduzca los duplicados falsos en CRM.
        heading: Problemas reales, usuarios reales.
        import_context: Importación de datos
        import_desc: Normaliza los correos electrónicos antes de importarlos masivamente a tu base de datos. Evita que las variaciones de formato creen registros duplicados.
        import_title: Estandarizar los datos de correo electrónico antes de la importación.
        integrations_context: Integraciones
        integrations_desc: Normalice antes de realizar búsquedas entre sistemas. Asegúrese de que User.Name@Gmail.com y username@gmail.com coincidan como la misma identidad.
        integrations_title: Mejorar la coincidencia de correos electrónicos en todos los sistemas.
        outreach_context: Marketing por correo electrónico
        outreach_desc: Procesa tu lista con el normalizador antes de enviarla. Detecta los rebotes causados por variaciones antes de que afecten la reputación del remitente.
        outreach_title: Limpia tus registros de correo electrónico antes de contactar con otras personas.
        subheading: Email Normalizer es ideal para cualquier aplicación donde la calidad de los datos de contacto sea importante.
      what_it_does:
        clean_data_badge: Datos limpios
        clean_data_body: La API elimina los espacios en blanco, convierte la dirección a minúsculas, corrige los alias de proveedor comunes y devuelve un correo electrónico canónico, de modo que todas las direcciones almacenadas en su sistema sean coherentes.
        clean_data_heading: Normaliza la entrada de correo electrónico con una sola llamada.
        integration_badge: Integración
        integration_body: Envía una solicitud POST a /v1/validation/email-normalize con el correo electrónico en el cuerpo y tu clave API en el encabezado. No se requiere SDK.
        integration_heading: "Una petición: normalización instantánea."
        post_v1_validation_email_normalize_200: POST /v1/validation/email-normalize → 200 OK
