        subheading: "Un único punto de acceso. Todo lo que necesitas saber sobre un dominio: disponibilidad, propiedad e historial de registro."
        accuracy_heading: "Exactitud"
        accuracy_body: "Cada respuesta incluye datos WHOIS analizados (registros de propiedad y registro del dominio), estado del DNS (si existen registros de enrutamiento de tráfico), validez del certificado SSL (certificado HTTPS activo), registros MX (configuración del servidor de correo) y una puntuación de reputación, todo ello normalizado en una estructura JSON coherente."
        simplicity_heading: "Sencillez"
        simplicity_body: "Basta con una única solicitud POST con tu clave API. Sin SDK, sin configuración, sin ajustes: solo una llamada HTTP y una respuesta JSON."
      use_cases:
        heading: "Diseñado para cada flujo de trabajo de dominio"
        subheading: "Desde la prevención del fraude hasta la incorporación de nuevos usuarios, si tiene que ver con un nombre de dominio, esta API lo cubre todo."
        auth_context: "Autenticación / Registro"
        auth_title: "Evita los dominios riesgosos antes de registrarte."
        auth_body: "Verifique el estado del dominio antes de aceptarlo como dominio comercial proporcionado por el usuario. Rechace los dominios caducados, aparcados o marcados como sospechosos."
        fraud_context: "Prevención del fraude"
        fraud_title: "Bloquear dominios maliciosos o caducados"
        fraud_body: "Detecta dominios marcados como spam o phishing, o aquellos con registros caducados. Evita que personas malintencionadas abusen de tu plataforma."
        integrations_context: "Integraciones"
        integrations_title: "Verificar los dominios de los socios en los flujos de trabajo."
        integrations_body: "Antes de integrarlos en flujos de trabajo automatizados, verifique que los dominios de los socios o proveedores estén activos y configurados correctamente."
        email_marketing_context: "Marketing por correo electrónico"
        email_marketing_title: "Inspeccione el estado del dominio antes de realizar campañas de correo electrónico."
        email_marketing_body: "Verifique los registros MX y la reputación del dominio antes de enviar una lista de direcciones. Reduzca el riesgo de rebotes en dominios de envío completos."
        devops_context: "DevOps / Monitorización"
        devops_title: "Detectar problemas de DNS o SSL faltantes"
        devops_body: "Detecte los registros DNS faltantes o los certificados SSL caducados antes de que provoquen interrupciones del servicio o errores para el usuario."
        onboarding_context: "Incorporación"
        onboarding_title: "Incorporación segura con dominios de confianza"
        onboarding_body: "Durante el proceso de incorporación de clientes, solo se permiten dominios con DNS verificado, MX activo y buena reputación. Se bloquean los dominios temporales o recién registrados."
      api_combinations:
        heading: "Combínalo con otras API"
        subheading: "Domain Checker es más potente en combinación con otras API de Requiems. Combínalo con otras API de Requiems para integrar la validación multipunto en un único flujo de trabajo."
