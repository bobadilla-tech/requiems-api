      faq:
        a1: Elimina las etiquetas (por ejemplo, +label), convierte la dirección a
          minúsculas y elimina las peculiaridades de formato específicas del proveedor
          para que las variantes de la misma dirección se correspondan con una forma
          canónica.
        a2: Sí. Ambos están normalizados. La parte local se convierte a minúsculas
          y se eliminan los sufijos específicos del proveedor. El dominio se convierte
          a minúsculas y se resuelve mediante alias cuando es posible.
        a3: La capitalización se corrige mediante la conversión a minúsculas. Los
          espacios no son válidos en las direcciones de correo electrónico según la
          RFC 5321 y se eliminan si están presentes.
        a4: Sí. Se admiten direcciones de correo electrónico Unicode en dominios internacionalizados.
          La normalización del dominio aplica la conversión a minúsculas y la resolución
          de alias; la codificación de los nombres de dominio internacionalizados
          depende del proveedor de correo subyacente.
        a5: La demostración interactiva no requiere cuenta. Tras registrarse, puede
          acceder a un plan gratuito con un límite de solicitudes mensuales. Consulte
          la página de precios para conocer los límites.
        heading: Preguntas frecuentes
        q1: "¿Qué hace exactamente Email Normalizer?"
        q2: "¿Normaliza el dominio y la parte local?"
        q3: "¿Puede corregir el uso de mayúsculas y espacios?"
        q4: "¿Funciona con correos electrónicos internacionales?"
        q5: "¿Es gratuita la versión de demostración?"
