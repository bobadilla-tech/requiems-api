        email_validator_name: "Verificador de dominios + Validador de correo electrónico"
        email_validator_benefit: "Valida tanto el dominio como la dirección de correo electrónico específica."
        email_validator_outcome: "Garantía total de entregabilidad del correo electrónico: comprobaciones del estado del dominio y del buzón de correo."
        vpn_detection_name: "Verificador de dominio + Detección de VPN"
        vpn_detection_benefit: "Verifique el estado del dominio al tiempo que identifica el tráfico VPN o proxy de la misma solicitud."
        vpn_detection_outcome: "Señal de fraude de doble capa: un dominio marcado como sospechoso combinado con tráfico anonimizado constituye un fuerte desencadenante de bloqueo."
        phone_validator_name: "Verificador de dominio + Validador de teléfono"
        phone_validator_benefit: "Verifique el estado del dominio y el número de teléfono en el mismo paso del proceso de incorporación."
        phone_validator_outcome: "Validación de contacto multipunto —presencia digital confirmada y teléfono localizable— antes de conceder el acceso."
      faq:
        heading: "Preguntas frecuentes"
        support_prompt: "¿Aún tienes preguntas?"
        support_link: "Contacta con soporte"
        q1: "¿Qué comprueba exactamente Domain Checker?"
        a1: "Comprueba la existencia de registros DNS, la presencia de registros MX, la validez del certificado SSL y la reputación del dominio comparándolas con listas de amenazas conocidas."
        q2: "¿Verifica si el dominio tiene un servidor de correo?"
        a2: "Sí. El campo mx_valid indica si el dominio tiene registros MX válidos configurados, un requisito previo para recibir correo electrónico."
        q3: "¿Verifica los certificados SSL?"
        a3: "Sí. ssl_valid devuelve verdadero si el dominio tiene un certificado SSL válido y no caducado. No comprueba la profundidad de la cadena ni el estado de validación extendida."
        q4: "¿Puede validar varios dominios a la vez?"
        a4: "El punto final acepta un dominio por solicitud. Para la validación masiva, realice llamadas en paralelo o utilice el punto final de procesamiento por lotes si está disponible en su plan."
        q5: "¿Es gratuita la versión de demostración?"
        a5: "La demostración interactiva no requiere cuenta. Tras registrarse, puede acceder a un plan gratuito con un límite de solicitudes mensuales. Consulte la página de precios para conocer los límites."
      cta:
