        a5: "Cada país del lote cuenta como 1 crédito. Una solicitud con 10 países cuesta 10 créditos, lo mismo que 10 solicitudes individuales. El procesamiento por lotes reduce la sobrecarga HTTP, pero no el consumo de créditos."
