        q2: "¿Qué pasa si no se encuentra una palabra?"
        a2: "La API devuelve una respuesta 404 Not Found si la palabra no está en el dataset del tesauro."
        q3: "¿Cuántas palabras tiene el dataset?"
        a3: "El dataset contiene más de 50 palabras curadas en inglés con sus sinónimos y antónimos, cubriendo el vocabulario más frecuente."
        q4: "¿Puedo obtener sinónimos y antónimos por separado?"
        a4: "El endpoint devuelve sinónimos y antónimos en una sola respuesta para mayor eficiencia. Ambos campos siempre están presentes."
        q5: "¿Puedo buscar varias palabras a la vez?"
        a5: "Sí. El endpoint batch (POST /v1/text/thesaurus/batch) acepta hasta 50 palabras por solicitud. Los resultados se devuelven en el mismo orden que la entrada, y las palabras no encontradas devuelven un error individual sin fallar todo el batch."
