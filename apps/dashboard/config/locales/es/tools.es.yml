      api_combinations:
        domain_benefit: Normalizar el correo electrónico y verificar la salud de su dominio simultáneamente.
        domain_outcome: "Correo electrónico canónico combinado con una puntuación de confianza del dominio: mayor confianza antes de contactar con el usuario."
        domain_pair: Normalizador de correo electrónico + Verificador de dominio
        heading: Utilizar junto con las API complementarias.
        phone_benefit: Normaliza el correo electrónico y valida el número de teléfono en el mismo paso.
        phone_outcome: Datos de contacto consistentes y verificados en ambos canales a partir de una única llamada de incorporación.
        phone_pair: Normalizador de correo electrónico + Validador de teléfono
        subheading: Las API de Requiems están diseñadas para integrarse. Combina Email Normalizer con otros puntos finales para crear un sistema completo de validación de contactos con una sola clave API.
        validator_benefit: Normalice y luego valide para garantizar una higiene completa del correo electrónico.
        validator_outcome: "Correo electrónico limpio y canónico, cuya entrega está confirmada: ideal para procesos de registro e importación."
        validator_pair: Normalizador de correo electrónico + Validador de correo electrónico
      cta:
        body: Una clave API. Normalización de correo electrónico y más en Requiems.
