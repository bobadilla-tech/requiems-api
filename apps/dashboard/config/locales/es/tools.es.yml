      faq:
        heading: "Preguntas frecuentes"
        support_prompt: "¿Aún tienes preguntas?"
        support_link: "Contacta con soporte"
        q1: "¿Qué información devuelve Phone Validator?"
        a1: "Devuelve si el número es válido y accesible, el país y el código de país, el nombre del operador, el tipo de línea (móvil, fija, VoIP, gratuita o de tarificación especial) y el número formateado según el estándar E.164 y los estándares locales."
        q2: "¿Funciona con números de teléfono internacionales?"
        a2: "Sí. Admite números de teléfono de más de 200 países y territorios. Introduce el número en formato E.164 con el código de país, o deja que la API detecte el país a partir del patrón del número."
        q3: "¿Puede detectar VoIP y números virtuales?"
        a3: "Sí. El campo line_type distingue entre números móviles, fijos, VoIP, gratuitos y de tarificación especial. Úselo para marcar los números virtuales o desechables para la detección de fraude."
        q4: "¿Qué tan precisa es la detección de portadores?"
        a4: "La detección de operadores se obtiene de bases de datos globales y es precisa para la mayoría de los principales operadores de Norteamérica, Europa y Asia. La precisión puede variar para los operadores móviles virtuales (OMV) y los operadores regionales más pequeños."
        q5: "¿Es gratis probarlo?"
        a5: "La demostración interactiva no requiere cuenta. Tras registrarse, puede acceder a un plan gratuito con un límite de solicitudes mensuales. Consulte la página de precios para conocer los límites."
