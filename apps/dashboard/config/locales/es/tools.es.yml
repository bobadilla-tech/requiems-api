      faq:
        heading: Preguntas frecuentes
        q1: "¿Cuáles son los posibles valores de sentimiento?"
        a1: El campo de sentimiento devuelve uno de tres valores (positivo, negativo o neutro) según la clase con la puntuación de confianza más alta.
        q2: "¿Qué representa el desglose?"
        a2: Los tres valores del desglose (positivo, negativo, neutro) siempre suman 1.0. Muestran la confianza proporcional en todas las clases, no solo en la dominante. Una puntuación de 0.97 positiva significa que el modelo está muy seguro; 0.51 significa que se inclina hacia lo positivo, pero el texto es ambiguo.
        q3: "¿Cuánto puede medir el texto de entrada?"
        a3: No hay un límite estricto de caracteres a nivel de API, pero las entradas muy largas pueden truncarse según el modelo subyacente. Se recomienda mantener las entradas por debajo de 512 tokens (aproximadamente 400 palabras) para obtener la mejor precisión.
        q4: "¿Puedo analizar varios textos a la vez?"
        a4: Sí. El endpoint por lotes (POST /v1/text/sentiment/batch) acepta hasta 50 textos por solicitud. Los resultados se devuelven en el mismo orden que la entrada y cada texto cuenta como una unidad de uso.
        q5: "¿Es gratuito?"
        a5: La demo de arriba funciona sin necesidad de cuenta. Los planes de pago ofrecen límites de velocidad más altos y acceso completo a la API para uso en producción.
