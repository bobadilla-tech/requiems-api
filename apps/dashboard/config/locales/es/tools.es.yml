        q2: "¿Qué representa la tasa?"
        a2: "La tasa representa la variación porcentual anual del Índice de Precios al Consumidor (IPC), según el indicador FP.CPI.TOTL.ZG del Banco Mundial. Una tasa de 8,0 indica que los precios aumentaron un 8 % de media durante ese año. Los valores se almacenan con cuatro decimales de precisión."
        q3: "¿Por qué mi país devuelve un error 404?"
        a3: "Es posible que algunos territorios o estados recientemente reconocidos no tengan datos del IPC en el conjunto de datos del Banco Mundial. La API solo incluye países con datos disponibles de la fuente del Banco Mundial."
        q4: "¿Las tasas están expresadas en porcentaje o en forma decimal?"
