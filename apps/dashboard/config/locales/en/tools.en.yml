      faq:
        heading: "Frequently Asked Questions"
        support_prompt: "Still have questions?"
        support_link: "Contact support"
        q1: "How often is the data updated?"
        a1: "Data is sourced from the World Bank and updated annually when new figures are published — typically mid-year for the prior calendar year. The API always returns the latest available data."
        q2: "What does the rate represent?"
        a2: "The rate is the annual percentage change in the Consumer Price Index (CPI) — the World Bank indicator FP.CPI.TOTL.ZG. A rate of 8.0 means prices rose 8% on average over that year. Values are stored with 4 decimal places of precision."
        q3: "Why does my country return 404?"
        a3: "Some territories or newly recognised states may not have CPI data in the World Bank dataset. The API only includes countries with available data from the World Bank source."
        q4: "Are the rates in percent or decimal form?"
        a4: "Percent. A rate of 2.9495 means 2.9495%, not 0.029495. Multiply by 100 is never needed — the value is already the percentage."
        q5: "How does the batch endpoint billing work?"
        a5: "Each country in the batch counts as 1 credit. A request with 10 countries costs 10 credits, the same as 10 individual requests. The batch endpoint saves on HTTP overhead but not on credit usage."
