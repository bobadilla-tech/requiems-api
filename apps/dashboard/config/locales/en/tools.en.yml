        sentiment_benefit: Catch offensive content missed by each detector alone. Profanity
          Filter targets explicit words; Sentiment Analysis catches hostile tone in
          technically clean text.
        email_pair: Profanity Filter + Email Validator
        email_benefit: Block offensive usernames and verify the email is real before
          account creation. Two checks, one onboarding step.
        domain_pair: Profanity Filter + Domain Checker
