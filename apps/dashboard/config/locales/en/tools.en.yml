        q1: "What formula does the API use?"
        a1: "Standard fixed-rate amortization: M = P × (r(1+r)^n) / ((1+r)^n − 1), where P is the principal, r is the monthly rate (annual rate / 12 / 100), and n is the total number of payments (years × 12)."
