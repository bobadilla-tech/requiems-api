      faq:
        a1: It strips tags (e.g. +label), lowercases the address, and removes provider-specific
          formatting quirks so variants of the same address map to one canonical form.
        a2: Yes. Both are normalized. The local part is lowercased and cleaned of
          provider-specific suffixes. The domain is lowercased and alias-resolved
          where possible.
        a3: Capitalization is corrected by lowercasing. Spaces are not valid in email
          addresses per RFC 5321 and are stripped if present.
        a4: Yes. Unicode email addresses in internationalized domains are supported.
          Domain normalization applies lowercasing and alias resolution; encoding
          of internationalized domain names depends on the underlying mail provider.
        a5: The interactive demo requires no account. A free tier is available after
          signup with a monthly request quota. See the pricing page for limits.
