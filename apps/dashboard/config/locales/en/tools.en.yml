      use_cases:
        heading: "Real problems, real users."
        subheading: "Email Normalizer fits wherever contact data quality matters."
        import_context: "Data Import"
        import_title: "Standardize email data before import"
        import_desc: "Normalize emails before bulk import into your database. Prevent format variations from creating duplicate records."
        crm_dedup_context: "CRM / Data"
        crm_dedup_title: "Merge duplicate accounts with normalized emails"
        crm_dedup_desc: "Use the normalized form as a deduplication key. Identify accounts that belong to the same person across different email formats."
        integrations_context: "Integrations"
        integrations_title: "Improve email matching across systems"
        integrations_desc: "Normalize before cross-system lookups. Ensure User.Name@Gmail.com and username@gmail.com match as the same identity."
        analytics_context: "Analytics"
        analytics_title: "Normalize signup emails for analytics"
        analytics_desc: "Standardize at point of capture. Keep analytics and segmentation consistent regardless of how users type their address."
        crm_dup_context: "CRM / Data"
        crm_dup_title: "Reduce false duplicates in CRM"
        crm_dup_desc: "Stop treating email variants as separate contacts. Normalization reduces bloated contact counts and improves list hygiene."
        outreach_context: "Email Marketing"
        outreach_title: "Clean email records before outreach"
        outreach_desc: "Run your list through the normalizer before a send. Catch variation-caused bounces before they affect sender reputation."
      api_combinations:
        heading: "Use together with complementary APIs."
        subheading: "Requiems APIs are designed to compose. Combine Email Normalizer with other endpoints to build a complete contact validation pipeline with a single API key."
        validator_pair: "Email Normalizer + Email Validator"
        validator_benefit: "Normalize then validate for complete email hygiene."
        validator_outcome: "Clean, canonical email that is also confirmed deliverable — ideal for signup and import flows."
        phone_pair: "Email Normalizer + Phone Validator"
        phone_benefit: "Normalize email and validate phone at the same step."
        phone_outcome: "Consistent, verified contact data across both channels from a single onboarding call."
        domain_pair: "Email Normalizer + Domain Checker"
        domain_benefit: "Normalize email and verify its domain health together."
        domain_outcome: "Canonical email paired with domain trust score — higher confidence before outreach."
      faq:
        heading: "Frequently asked questions"
        q1: "What does Email Normalizer actually do?"
        a1: "It strips tags (e.g. +label), lowercases the address, and removes provider-specific formatting quirks so variants of the same address map to one canonical form."
        q2: "Does it normalize the domain and local part?"
        a2: "Yes. Both are normalized. The local part is lowercased and cleaned of provider-specific suffixes. The domain is lowercased and alias-resolved where possible."
        q3: "Can it correct capitalization and spacing?"
        a3: "Capitalization is corrected by lowercasing. Spaces are not valid in email addresses per RFC 5321 and are stripped if present."
        q4: "Does it work with international emails?"
        a4: "Yes. Unicode email addresses in internationalized domains are supported. Domain normalization applies lowercasing and alias resolution; encoding of internationalized domain names depends on the underlying mail provider."
        q5: "Is it free to use the demo?"
        a5: "The interactive demo requires no account. A free tier is available after signup with a monthly request quota. See the pricing page for limits."
      cta:
