      faq:
        heading: Frequently Asked Questions
        support_prompt: Still have questions?
        support_link: Contact support
        q1: What does the API return?
        a1: Each response includes three fields — has_profanity (boolean), censored
          (the original text with offensive words replaced by asterisks), and flagged_words
          (an array of the specific words that were detected).
        q2: Does it support languages other than English?
        a2: The filter is optimized for English. Detection accuracy in other languages
          varies and is not guaranteed. Support for additional languages is on the roadmap.
        q3: How are words censored?
        a3: Offensive words are replaced with asterisks in the censored field. The
          replacement preserves the original word length so surrounding text stays
          readable.
        q4: Can I use it to check usernames or short strings?
        a4: Yes. The API accepts any non-empty string. There is no minimum length requirement,
          so single words and short phrases work fine.
        q5: Is there a batch endpoint?
        a5: Yes — POST /v1/validation/profanity/batch accepts up to 50 texts in a
          single request. See the API docs for the request format and response schema.
