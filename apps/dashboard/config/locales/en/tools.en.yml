    email_normalizer:
      hero:
        title: "Clean email addresses automatically, every time."
        subtitle: "Normalize, lowercase, trim, and canonicalize email addresses in one API call."
      what_it_does:
        clean_data_badge: "Clean data"
        clean_data_heading: "Normalize email input with one call."
        clean_data_body: "The API trims whitespace, lowercases the address, fixes common provider aliases, and returns a canonical email — so every address stored in your system is consistent."
