      faq:
        heading: "Frequently Asked Questions"
        support_prompt: "Still have questions?"
        support_link: "Contact support"
        q1: "What is an MX record?"
        a1: "An MX (Mail Exchange) record is a DNS record that specifies which mail server is responsible for receiving email for a domain. Every domain that accepts email must have at least one MX record."
        q2: "What does priority mean?"
        a2: "MX priority is a numeric value where a lower number means higher delivery preference. Mail servers try the lowest-priority-number host first — for example, priority 5 is tried before priority 10. This allows mail server failover to be configured at the DNS level."
        q3: "What happens if a domain has no MX records?"
        a3: "The API returns a 404 response. A domain with no MX records cannot receive email via standard SMTP delivery."
        q4: "Why does the hostname end with a dot?"
        a4: "The trailing dot is standard DNS notation for a fully-qualified domain name (FQDN). It indicates an absolute domain name and is safe to strip when displaying hostnames to end users."
        q5: "Are the results always sorted by priority?"
        a5: "Yes. Records are always returned sorted by priority ascending — the lowest numeric value (highest mail delivery priority) comes first, regardless of the order returned by the DNS resolver."
      cta:
        heading: "Automate this with Requiems."
        body: "One API key. MX Lookup, plus 50+ other APIs across DNS, email validation, networking, and more."
