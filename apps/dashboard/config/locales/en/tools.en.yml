        a2: "Yes — all monetary values (monthly_payment, total_payment, total_interest, and each schedule entry) are rounded to 2 decimal places."
        q3: "Why does the final balance show a small rounding difference?"
        a3: "Due to floating-point rounding on each monthly payment, the final balance may show $0.00–$0.99 rather than exactly $0. This is expected behaviour for fixed-payment amortization schedules."
        q4: "What currency does the API use?"
        a4: "The API is currency-agnostic. Pass your principal in any unit and interpret the results in that same unit. There is no currency conversion."
        q5: "Does the API support variable or adjustable-rate mortgages?"
