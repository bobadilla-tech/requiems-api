      faq:
        heading: "Frequently Asked Questions"
        support_prompt: "Still have questions?"
        support_link: "Contact support"
        q1: "What is a BIN?"
        a1: "A BIN (Bank Identification Number), also called an IIN (Issuer Identification Number), is the first 6–8 digits of a payment card. It identifies the card network (Visa, Mastercard, etc.), the issuing bank, the card type (credit/debit), and the country of issue."
        q2: "Does the API support 8-digit BINs?"
        a2: "Yes. The endpoint accepts 6–8 digit prefixes. For 8-digit inputs it tries an exact match first, then falls back to the 6-digit prefix if no 8-digit record is found."
        q3: "What does the confidence score mean?"
        a3: "The confidence field (0.00–1.00) reflects data quality. Records confirmed across multiple independent data sources receive a higher score. A score above 0.85 indicates high-confidence data with bank and country information verified from more than one source."
        q4: "Why is issuer_name sometimes empty?"
        a4: "Not all BINs in the public dataset have associated bank name data. The confidence score will be lower for these records. Empty string fields indicate the data is not available for that BIN."
        q5: "Is it free to use?"
        a5: "The demo above works without an account. Paid plans are available for production scale with higher rate limits and full API access."
      cta:
        heading: "Automate this with Requiems."
        body: "One API key. BIN Lookup, plus 50+ other APIs across validation, finance, networking, and more."

