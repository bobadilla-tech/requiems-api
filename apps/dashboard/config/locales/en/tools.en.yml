        coverage_body: "BIN Lookup covers Visa, Mastercard, Amex, Discover, UnionPay, and more. Every record includes card network, type, level, issuing bank name and URL, issuing country, prepaid flag, and a confidence score. Both 6-digit and 8-digit BINs are supported per ISO 7812-1:2017."
        simplicity_badge: "Simplicity"
        simplicity_heading: "One GET request. No body, no parsing."
        simplicity_body: "Pass the BIN in the URL path. Your API key in the header. No SDK, no setup, no request body. The response is flat JSON — read it directly without unwrapping nested structures."
      use_cases:
        heading: "Built for payment flows."
        subheading: "BIN Lookup fits anywhere card metadata matters — checkout, fraud, and ops alike."
        ux_title: "Show the card logo as the user types"
        ux_desc: "Detect the card network from the first 6 digits and render the correct brand logo in real time — before the user finishes entering the card number."
        ux_tags: "Checkout UX, Payments"
        risk_title: "Block high-risk card origins"
        risk_desc: "Reject or flag cards issued in restricted countries at the payment step, before any charge is attempted."
        risk_tags: "Fraud prevention, Compliance"
        type_title: "Validate card type at checkout"
        type_desc: "Some products only accept debit or only accept credit. Check card_type at entry and show a clear message before the user hits submit."
        type_tags: "Payments, Checkout flows"
        prepaid_title: "Flag prepaid cards for subscription flows"
        prepaid_desc: "Prepaid cards often fail on recurring charges. Detect them upfront and prompt the user to use a different card."
        prepaid_tags: "Subscriptions, Billing"
        enrich_title: "Enrich payment records with issuer data"
        enrich_desc: "Attach bank name and country to every transaction record for reporting, reconciliation, and dispute workflows."
        enrich_tags: "Operations, Finance"
        score_title: "Score transaction risk by BIN"
        score_desc: "Combine BIN metadata with other signals — IP location, device fingerprint — to build a composite fraud score per transaction."
        score_tags: "Risk scoring, Fraud prevention"
      api_combinations:
        heading: "Use together with complementary APIs."
        subheading: "BIN Lookup works even better when paired with other Requiems APIs."
        ip_pair: "BIN Lookup + IP Reputation"
        ip_benefit: "Cross-reference the card's issuing country with the user's IP location to flag mismatches and reduce chargebacks."
        iban_pair: "BIN Lookup + IBAN Validator"
        iban_benefit: "Validate both card and bank account details in the same onboarding flow for full payment instrument coverage."
        email_pair: "BIN Lookup + Email Validator"
        email_benefit: "Combine payment card verification with email validation to build a stronger fraud signal at signup or checkout."
      faq:
        heading: "Frequently Asked Questions"
        support_prompt: "Still have questions?"
        support_link: "Contact support"
        q1: "What is a BIN?"
        a1: "A BIN (Bank Identification Number), also called an IIN (Issuer Identification Number), is the first 6–8 digits of a payment card. It identifies the card network (Visa, Mastercard, etc.), the issuing bank, the card type (credit/debit), and the country of issue."
        q2: "Does the API support 8-digit BINs?"
        a2: "Yes. The endpoint accepts 6–8 digit prefixes. For 8-digit inputs it tries an exact match first, then falls back to the 6-digit prefix if no 8-digit record is found."
        q3: "What does the confidence score mean?"
        a3: "The confidence field (0.00–1.00) reflects data quality. Records confirmed across multiple independent data sources receive a higher score. A score above 0.85 indicates high-confidence data with bank and country information verified from more than one source."
        q4: "Why is issuer_name sometimes empty?"
        a4: "Not all BINs in the public dataset have associated bank name data. The confidence score will be lower for these records. Empty string fields indicate the data is not available for that BIN."
        q5: "Is it free to use?"
        a5: "The demo above works without an account. Paid plans are available for production scale with higher rate limits and full API access."
      cta:
        heading: "Automate this with Requiems."
        body: "One API key. BIN Lookup, plus 50+ other APIs across validation, finance, networking, and more."
