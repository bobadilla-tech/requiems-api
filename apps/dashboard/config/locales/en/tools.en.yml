        heading: "What the Domain Checker API Does"
        subheading: "One endpoint. Everything you need to know about a domain — availability, ownership, and registration history."
        accuracy_heading: "Accuracy"
        accuracy_body: "Every response includes parsed WHOIS data (domain ownership and registration records), DNS status (whether traffic-routing records exist), SSL validity (active HTTPS certificate), MX records (mail server configuration), and a reputation score — all normalized into a consistent JSON structure."
        simplicity_heading: "Simplicity"
        simplicity_body: "A single POST request with your API key is all it takes. No SDK, no configuration, no setup — just an HTTP call and a JSON response."
      use_cases:
        heading: "Built for Every Domain Workflow"
        subheading: "From fraud prevention to onboarding — if it touches a domain name, this API has you covered."
        auth_context: "Auth / Signup"
        auth_title: "Avoid risky domains before signup"
        auth_body: "Check domain health before accepting it as a user-provided business domain. Reject expired, parked, or flagged domains."
        fraud_context: "Fraud Prevention"
        fraud_title: "Block malicious or expired domains"
        fraud_body: "Detect domains flagged for spam or phishing, or those with lapsed registrations. Prevent bad actors from abusing your platform."
        integrations_context: "Integrations"
        integrations_title: "Verify partner domains in workflows"
        integrations_body: "Validate that partner or vendor domains are live and properly configured before integrating them into automated workflows."
        email_marketing_context: "Email Marketing"
        email_marketing_title: "Inspect domain health before email campaigns"
        email_marketing_body: "Check MX records and domain reputation before targeting an address list. Reduce bounce risk from entire sending domains."
        devops_context: "DevOps / Monitoring"
        devops_title: "Detect missing DNS or SSL issues"
        devops_body: "Surface missing DNS records or expired SSL certificates before they cause downtime or user-facing errors."
        onboarding_context: "Onboarding"
        onboarding_title: "Secure onboarding with trusted domains"
        onboarding_body: "Allow only domains with verified DNS, active MX, and clean reputation during business onboarding. Block throwaway or newly registered domains."
      api_combinations:
        heading: "Pair It With Other APIs"
        subheading: "Domain Checker is more powerful combined. Stack it with other Requiems APIs to build multi-point validation into a single workflow."
        label_benefit: "Benefit:"
        label_outcome: "Outcome:"
        email_validator_name: "Domain Checker + Email Validator"
        email_validator_benefit: "Validate both the domain and specific email address."
        email_validator_outcome: "Full email deliverability confidence: domain health plus mailbox-level checks."
        vpn_detection_name: "Domain Checker + VPN Detection"
        vpn_detection_benefit: "Check domain health while identifying VPN or proxy traffic from the same request."
        vpn_detection_outcome: "Double-layered fraud signal: a flagged domain combined with anonymized traffic is a strong block trigger."
        phone_validator_name: "Domain Checker + Phone Validator"
        phone_validator_benefit: "Verify domain health and phone number at the same onboarding step."
        phone_validator_outcome: "Multi-point contact validation — confirmed digital presence and reachable phone — before granting access."
      faq:
        heading: "Frequently Asked Questions"
        support_prompt: "Still have questions?"
        support_link: "Contact support"
        q1: "What does Domain Checker check exactly?"
        a1: "It checks DNS record existence, MX record presence, SSL certificate validity, and domain reputation against known threat lists."
        q2: "Does it verify if the domain has a mail server?"
        a2: "Yes. The mx_valid field indicates whether the domain has valid MX records configured — a prerequisite for receiving email."
        q3: "Does it check SSL certificates?"
        a3: "Yes. ssl_valid returns true if the domain has a valid, non-expired SSL certificate. It does not check chain depth or extended validation status."
        q4: "Can it validate multiple domains at once?"
        a4: "The endpoint accepts one domain per request. For bulk validation, call in parallel or use the batch endpoint if available on your plan."
        q5: "Is it free to use the demo?"
        a5: "The interactive demo requires no account. A free tier is available after signup with a monthly request quota. See the pricing page for limits."
      cta:
