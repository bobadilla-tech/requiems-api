        q1: "How often is the data updated?"
        a1: "Data is sourced from the World Bank and updated annually when new figures are published — typically mid-year for the prior calendar year. The API always returns the latest available data."
        q2: "What does the rate represent?"
        a2: "The rate is the annual percentage change in the Consumer Price Index (CPI) — the World Bank indicator FP.CPI.TOTL.ZG. A rate of 8.0 means prices rose 8% on average over that year. Values are stored with 4 decimal places of precision."
