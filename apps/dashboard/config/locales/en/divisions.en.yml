      use_cases:
      - filter_key: bin
        endpoint: GET /v1/finance/bin/{bin}
        title: Fewer false declines at checkout
        description: Enrich card metadata for risk and routing. Reduce good-customer
          friction while staying compliant.
        tag_problem: Payments
        tag_industry: Fintech
        case_anchor: case-bin
        example: Authorization sends the first 8 PAN digits (or token equivalent)
          to BIN lookup; issuer country and product type feed your rules engine so
          domestic debit stops scoring like cross-border credit.
      - filter_key: iban
        endpoint: GET /v1/finance/iban/{iban}
        title: Cleaner payouts with IBAN validation
        description: Validate bank accounts before money moves. Stop expensive repair
          loops after the fact.
        tag_problem: Payouts
        tag_industry: Marketplaces
        case_anchor: case-iban
        example: Seller onboarding validates IBAN checksum and length for the selected
          country before creating a payout profile. Invalid accounts return field
          errors instead of failed batch files from the bank.
      - filter_key: swift
        endpoint: GET /v1/finance/swift/{code}
        title: Faster bank routing with SWIFT lookups
        description: Confirm institution metadata for wires and compliance. Reduce
          manual research for finance teams.
        tag_problem: Banking data
        tag_industry: Finance ops
        case_anchor: case-swift
        example: Analyst pastes BIC into ops tooling; lookup returns institution name,
          city, and branch metadata for the wire confirmation PDF. CSV exports include
          the same fields for auditors.
      - filter_key: crypto
        endpoint: GET /v1/finance/crypto/{symbol}
        title: Real-time pricing for digital assets
        description: Show trustworthy crypto prices in-app. Keep quotes aligned with
          what users expect.
        tag_problem: Pricing
        tag_industry: Crypto apps
        case_anchor: case-fx
        example: Wallet home polls spot prices for BTC and ETH every 30s with shared
          cache keys. Trade review shows the same snapshot id as the portfolio tile
          so users do not see two different numbers.
      - filter_key: fx
        endpoint: GET /v1/finance/exchange-rate
        title: Fairer checkout totals worldwide
        description: Convert with transparent rates. Reduce disputes and abandoned
          carts on international orders.
        tag_problem: Multi-currency
        tag_industry: E-commerce
        case_anchor: case-fx
        example: Cart subtotal is stored in merchant EUR; pay button refresh pulls
          USD mid-market rate plus your rounding rule. Email receipt lists rate timestamp
          so CS matches the charged amount.
      - filter_key: inflation
        endpoint: GET /v1/finance/inflation
        title: Better planning data for finance teams
        description: Inflation and reference data for models and disclosures. Ship
