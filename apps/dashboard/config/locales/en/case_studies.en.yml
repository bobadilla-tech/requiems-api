        paragraphs:
        - Lifters expect movements, equipment tags, and progression cues that reflect
          real coaching, not placeholder JSON.
        - The Fitness Exercises API supplies curated exercise metadata so CompileStrength
          can emphasise programming intelligence, UX, and retention loops unique to
          their brand.
      - heading: Ship programming features faster
