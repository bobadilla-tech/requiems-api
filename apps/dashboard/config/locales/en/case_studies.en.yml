    verigeo:
      meta_title: Verigeo case study | Requiems API
      meta_description: How Verigeo (verigeo.pe) uses Requiems Places, validation,
        and finance APIs for geomarketing, georeferencing workflows, and trustworthy
        widgets.
      hero_subheadline: Verigeo delivers GIS, georeferencing, and geomarketing solutions
        across Peru. Requiems backs reference data and guardrails so their team can
        focus on customer workflows, not reinventing global postal, timezone, and
        validation infrastructure.
      quote_text: We use Requiems for financial data in our widgets and to block fake
        signups at registration. The recognition layer helped us personalize marketing
        without building anything from scratch.
      quote_name: Verigeo
      quote_role: verigeo.pe · Geomarketing & GIS
      api_rows:
      - id: geocode
        benefit: Turn addresses into coordinates for maps, routing, and GIS ingestion.
      - id: postal-code
        benefit: Validate and enrich postal inputs before printing labels or locking
          CRM records.
      - id: cities
        benefit: City metadata (population, timezone, coordinates) for analytics and
          regional reporting.
      - id: timezone
        benefit: Resolve timezone context for properties, branches, and dispersed
          teams.
      - id: world-time
        benefit: DST-safe clocks keyed by IANA zones for ops dashboards.
      - id: working-days
        benefit: SLA math that skips weekends and optionally honors country holidays.
      - id: holidays
        benefit: Know when markets pause so launches and field work stay realistic.
      - id: email-validate
        benefit: Catch malformed addresses before campaigns and CRM sync.
      - id: disposable-email
        benefit: Stop throwaway inboxes from polluting trials and nurture flows.
      - id: exchange-rate
        benefit: Authoritative FX snapshots for widgets that quote multi-currency
          context.
      - id: crypto
        benefit: Spot crypto context alongside traditional FX when dashboards demand
          both.
      hero_headline: Verigeo scales geomarketing
      sections:
      - heading: Location intelligence at national scale
        paragraphs:
        - Geomarketing depends on turning real-world addresses and administrative
          divisions into coordinates and structured attributes customers can trust.
        - Geocoding, postal lookup, and city metadata from Requiems help normalize
          inputs before they reach Verigeo's GIS pipelines, reducing manual cleanup
          when provinces and collaborators submit updates from the field.
      - heading: Calendars that respect how Peru works
        paragraphs:
        - Scheduling studies, support windows, and delivery promises breaks when weekends
          and holidays differ by region.
        - Timezone, world time, working-days, and holidays endpoints carry the regional
          nuance product teams need without maintaining calendar spreadsheets.
      - heading: Trust at registration
        paragraphs:
        - High-value geomarketing workflows attract automated signups and disposable
          inboxes.
        - Email validation and disposable-domain checks align with Verigeo's goal
          of blocking fake signups while keeping legitimate Peruvian businesses moving.
      - heading: Reference data in customer-facing widgets
        paragraphs:
        - Dashboards and widgets often need credible FX or crypto reference points,
          not scraped quotes.
        - Exchange-rate and crypto endpoints support lightweight financial context
          alongside Verigeo's proprietary geomarketing insights (per partner feedback;
          confirm scope with our team if you need integration specifics).
