      hero_headline: Verigeo fait évoluer le geomarketing avec des APIs prêtes pour
        la localisation
      hero_subheadline: Verigeo fournit GIS, géoréférence et geomarketing au Pérou.
        Requiems apporte données de référence et garde-fous pour que l'équipe se concentre
        sur les flux clients, sans réinventer l'infrastructure postale, fuseaux horaires
        et validation.
      meta_description: Comment Verigeo (verigeo.pe) utilise les APIs Requiems Places,
        validation et finance pour le geomarketing, la géoréférence et des widgets
        fiables.
      meta_title: Étude de cas Verigeo | Requiems API
      quote_name: Verigeo
      quote_role: verigeo.pe · Geomarketing et SIG
      quote_text: Nous utilisons Requiems pour les données financières dans nos widgets
        et pour bloquer les fausses inscriptions. La couche de reconnaissance nous
        a aidés à personnaliser le marketing sans tout construire nous-mêmes.
      sections:
      - heading: Intelligence de localisation à l'échelle nationale
        paragraphs:
        - Le geomarketing repose sur la transformation d'adresses réelles et de divisions
          administratives en coordonnées et attributs fiables.
        - Géocodage, codes postaux et métadonnées de ville aident à normaliser les
          entrées avant les pipelines SIG de Verigeo, en réduisant le nettoyage manuel
          lors des mises à jour terrain.
      - heading: Des calendriers adaptés au Pérou
        paragraphs:
        - Planifier études, fenêtres de support et engagements de livraison échoue
          quand week-ends et jours fériés varient par région.
        - Fuseaux horaires, heure mondiale, jours ouvrés et jours fériés apportent
          la nuance régionale sans feuilles de calcul.
      - heading: Confiance à l'inscription
        paragraphs:
        - Les flux geomarketing à forte valeur attirent inscriptions automatisées
          et boîtes jetables.
        - 'Validation e-mail et détection de domaines jetables s''alignent sur l''objectif
          de Verigeo : bloquer les faux comptes tout en laissant passer les entreprises
          légitimes.'
      - heading: Données de référence dans les widgets clients
        paragraphs:
        - Tableaux de bord et widgets ont souvent besoin de références FX ou crypto
          crédibles, pas de cotations grattées.
        - Les points de terminaison taux de change et crypto soutiennent un contexte
          financier léger aux côtés des insights geomarketing propriétaires (selon
          retour partenaire ; confirmez le périmètre avec notre équipe si besoin).
