        q2: "Quels pays sont pris en charge pour les calculs de jours fériés ?"
        a2: "L'API prend en charge les calendriers de jours fériés pour la plupart des pays du monde via les codes pays ISO 3166-1 alpha-2. Si un pays n'est pas reconnu, l'API ne retourne que des calculs excluant les week-ends."
