      seo:
        title: "API de filtre à grossièretés gratuite — Détectez et censurez le langage offensant | Requiems API"
        description: "Détectez les grossièretés et le langage offensant dans n'importe quel texte. Renvoie les mots signalés et une version censurée. Essayez la démo gratuite en direct, sans compte requis."
      logo_marquee:
        trusted_by: "La confiance des équipes partout dans le monde"
      hero:
        title: "Détectez et supprimez les grossièretés"
        subtitle: "Identifiez le langage offensant et obtenez une version censurée de n'importe quel texte en un seul appel API. Sans dictionnaires à maintenir, sans faux positifs à ajuster."
        cta_primary: "Obtenez votre clé API gratuite"
        cta_docs: "Voir la documentation"
        label_input: "Texte à analyser"
        placeholder: "ex : C'est un sacré bon exemple"
        submit: "Analyser"
        no_account: "Aucun compte requis pour la démo"
      what_it_does:
        detection_badge: "Détection"
        detection_heading: "Trouve ce que vous manquez"
        detection_body: "Analyse le texte saisi pour détecter les grossièretés, les insultes et le langage offensant. Renvoie un indicateur booléen et la liste de chaque mot signalé, afin que vous sachiez exactement ce qui a été trouvé."
        censorship_badge: "Censure"
        censorship_heading: "Renvoie une version propre"
        censorship_body: "Chaque réponse inclut une copie censurée du texte original avec les mots offensants remplacés. Utilisez-la directement dans votre interface sans manipulation de chaîne côté client."
      use_cases:
        heading: "Conçu pour les flux de modération de contenu"
        subheading: "Du contenu généré par les utilisateurs à la modération en temps réel — si du texte entre dans votre produit, cette API le garde propre."
        ugc_title: "Modérer le contenu généré par les utilisateurs"
        ugc_desc: "Signalez ou rejetez automatiquement les commentaires, avis et publications contenant un langage offensant avant qu'ils n'atteignent d'autres utilisateurs."
        ugc_tags: "UGC, Commentaires, Avis"
        chat_title: "Nettoyer le chat en direct"
        chat_desc: "Filtrez les messages en temps réel pour les apps de chat, les plateformes de jeux et les outils communautaires. Bloquez ou remplacez les mots offensants avant la livraison."
        chat_tags: "Chat, Jeux, Temps réel"
        onboarding_title: "Assainir les saisies d'inscription"
        onboarding_desc: "Vérifiez les noms d'utilisateur, les noms affichés et les champs de biographie lors de l'inscription. Rejetez les choix offensants avant qu'ils n'entrent dans votre base de données."
        onboarding_tags: "Inscription, Utilisateurs, Onboarding"
        support_title: "Filtrer les tickets d'assistance"
        support_desc: "Identifiez le langage abusif dans les messages d'assistance entrants. Acheminez les tickets signalés vers des agents spécialisés ou appliquez des avertissements automatiques."
        support_tags: "Support, CX, Tickets"
        ai_title: "Assainir les sorties d'IA"
        ai_desc: "Faites passer le texte généré par le filtre avant de l'afficher aux utilisateurs. Détectez les hallucinations du modèle qui produisent un contenu offensant inattendu."
        ai_tags: "IA, LLM, Sécurité"
        compliance_title: "Respecter les exigences de conformité du contenu"
        compliance_desc: "Enregistrez le contenu signalé et les remplacements censurés pour les pistes d'audit. Démontrez la couverture de modération aux partenaires, aux stores d'applications et aux régulateurs."
        compliance_tags: "Conformité, Audit, Rapports"
      api_combinations:
        heading: "Associez-la à d'autres API"
        subheading: "Le filtre à grossièretés est plus efficace dans un pipeline de modération en couches. Combinez-le avec d'autres API Requiems pour détecter plus de vecteurs d'abus."
        sentiment_pair: "Filtre à grossièretés + Analyse de sentiment"
        sentiment_benefit: "Détectez le contenu offensant manqué par chaque détecteur seul. Le filtre cible les mots explicites ; l'analyse de sentiment détecte le ton hostile dans un texte techniquement propre."
        email_pair: "Filtre à grossièretés + Validateur d'e-mail"
        email_benefit: "Bloquez les noms d'utilisateur offensants et vérifiez que l'e-mail est réel avant la création du compte. Deux vérifications, une seule étape d'inscription."
        domain_pair: "Filtre à grossièretés + Vérificateur de domaine"
        domain_benefit: "Validez les noms de domaine soumis pour les grossièretés et l'état DNS. Utile pour accepter des domaines d'entreprise fournis par les utilisateurs."
      faq:
        heading: "Foire aux questions"
        support_prompt: "Vous avez encore des questions ?"
        support_link: "Contacter le support"
        q1: "Que renvoie l'API ?"
        a1: "Chaque réponse inclut trois champs : has_profanity (booléen), censored (le texte original avec les mots offensants remplacés par des astérisques) et flagged_words (un tableau des mots spécifiques détectés)."
        q2: "Prend-elle en charge d'autres langues que l'anglais ?"
        a2: "Le filtre est optimisé pour l'anglais. La précision de détection dans d'autres langues varie et n'est pas garantie. La prise en charge de langues supplémentaires est en cours de développement."
        q3: "Comment les mots sont-ils censurés ?"
        a3: "Les mots offensants sont remplacés par des astérisques dans le champ censored. Le remplacement préserve la longueur du mot d'origine afin que le texte environnant reste lisible."
        q4: "Puis-je l'utiliser pour vérifier des noms d'utilisateur ou des chaînes courtes ?"
        a4: "Oui. L'API accepte n'importe quelle chaîne non vide. Il n'y a pas d'exigence de longueur minimale, donc les mots individuels et les phrases courtes fonctionnent bien."
        q5: "Existe-t-il un endpoint de traitement par lot ?"
        a5: "Oui — POST /v1/validation/profanity/batch accepte jusqu'à 50 textes en une seule requête. Consultez la documentation de l'API pour le format de la requête et le schéma de réponse."
      cta:
