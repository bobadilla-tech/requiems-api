      faq:
        heading: "Questions fréquentes"
        support_prompt: "Encore des questions ?"
        support_link: "Contacter le support"
        q1: "Dans quel format le nom du fuseau horaire doit-il être ?"
        a1: "Utilisez un nom de fuseau horaire IANA standard, comme America/New_York, Europe/London ou Asia/Tokyo. Ce sont les mêmes noms que ceux utilisés par la base de données tz sur laquelle reposent la plupart des systèmes d'exploitation et langages de programmation."
        q2: "La réponse tient-elle compte de l'heure d'été ?"
        a2: "Oui. Le champ is_dst indique si l'heure d'été est actuellement active pour le fuseau horaire demandé, et le décalage reflète le décalage UTC ajusté pour l'heure d'été."
        q3: "Que se passe-t-il si je saisis un nom de fuseau horaire invalide ?"
        a3: "L'API retourne une erreur 404 Not Found. Les noms de fuseau horaire sont sensibles à la casse et doivent correspondre exactement à la base de données tz IANA, y compris le préfixe régional (par exemple, America/, pas seulement New_York)."
        q4: "Puis-je consulter un fuseau horaire par ville ou coordonnées ?"
        a4: "Cet endpoint nécessite un nom de fuseau horaire IANA. Pour résoudre d'abord le nom d'une ville ou une latitude/longitude en fuseau horaire, utilisez l'API Fuseau horaire séparée, puis transmettez le résultat ici."
        q5: "Est-ce gratuit à l'essai ?"
