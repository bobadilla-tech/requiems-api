        bot_desc: "Les IP d'hébergement et de centres de données sont fortement corrélées aux bots et aux scrapers. Signalez ou limitez automatiquement le trafic provenant de ces plages."
        bot_tags: "Détection de bots, Prévention des abus"
        compliance_title: "Respectez les exigences réglementaires et de conformité"
        compliance_desc: "Les services réglementés peuvent exiger de confirmer que les requêtes ne proviennent pas d'une infrastructure d'anonymisation avant d'accorder l'accès."
        compliance_tags: "Conformité, Réglementation"
        geoblock_title: "Empêchez le contournement des restrictions géographiques"
        geoblock_desc: "Détectez les utilisateurs qui masquent leur localisation réelle avec un VPN ou un proxy pour accéder à du contenu ou des tarifs restreints par région."
        geoblock_tags: "Accès au contenu, Geo-blocage"
        score_title: "Enrichissez vos modèles de fraude avec un score unique"
        score_desc: "Combinez le score de fraude et le niveau de menace avec d'autres signaux (appareil, carte, e-mail) dans un modèle de fraude composite par requête."
        score_tags: "Évaluation des risques, Prévention de la fraude"
      api_combinations:
        heading: "Combinez-la avec d'autres API."
        subheading: "VPN & Proxy Detection fonctionne encore mieux associée à d'autres API Requiems."
        bin_pair: "Détection VPN + Recherche de BIN"
        bin_benefit: "Croisez les signaux de menace de l'IP avec le pays émetteur de la carte pour détecter les tentatives de paiement incohérentes et à haut risque."
        identity_pair: "Détection VPN + Recherche ASN"
        identity_benefit: "Combinez le score de menace basé sur l'IP avec des données ASN, FAI et fournisseur d'hébergement pour repérer le trafic datacenter et proxy avec plus de confiance."
        email_pair: "Détection VPN + Validateur d'e-mail"
        email_benefit: "Combinez la détection d'IP anonymisées avec la vérification des e-mails jetables pour repérer la création de faux comptes à l'inscription."
      faq:
        heading: "Questions fréquentes"
        support_prompt: "Vous avez encore des questions ?"
        support_link: "Contacter le support"
        q1: "Qu'est-ce que VPN & Proxy Detection ?"
        a1: "Une API qui vérifie si une adresse IP appartient à un fournisseur de VPN connu, un proxy public ou web, un nœud de sortie Tor ou un fournisseur d'hébergement/centre de données. Elle renvoie des indicateurs booléens pour chaque catégorie, ainsi qu'un score de menace et un score de fraude."
        q2: "Que signifient les scores de menace ?"
        a2: "Le score est calculé ainsi : Tor (+3), VPN (+2), Proxy (+2), Hébergement (+1). Le niveau de menace en découle : 0=Aucun, 1=Faible, 2-3=Moyen, 4-5=Élevé, 6+=Critique."
        q3: "Pourquoi fraud_score est-il à 0 pour certaines IP ?"
        a3: "Le fraud_score n'est disponible qu'avec le niveau PX5 ou supérieur de la base de données IP2Proxy. Les niveaux inférieurs renvoient 0, ce qui indique que la valeur n'est pas disponible pour la base de données actuelle."
        q4: "L'IPv6 est-il pris en charge ?"
        a4: "Oui, les adresses IPv4 et IPv6 sont toutes deux entièrement prises en charge."
        q5: "Est-ce gratuit ?"
        a5: "La démo ci-dessus fonctionne sans compte. Des forfaits payants sont disponibles pour une échelle de production avec des limites de requêtes plus élevées et un accès complet à l'API."
