        q1: "Quelle formule l'API utilise-t-elle ?"
        a1: "Amortissement standard à taux fixe : M = P × (r(1+r)^n) / ((1+r)^n − 1), où P est le capital, r est le taux mensuel (taux annuel / 12 / 100) et n est le nombre total de paiements (années × 12)."
