        support_prompt: "Vous avez encore des questions ?"
        support_link: "Contactez l'assistance"
        q1: "Qu'est-ce qu'un BIN ?"
        a1: "Le BIN (Bank Identification Number), également appelé IIN (Issuer Identification Number), correspond aux 6 à 8 premiers chiffres d'une carte de paiement. Il identifie le réseau de la carte (Visa, Mastercard, etc.), la banque émettrice, le type de carte (crédit/débit) et le pays d'émission."
        q2: "L'API prend-elle en charge les BIN à 8 chiffres ?"
        a2: "Oui. Le point de terminaison accepte les préfixes de 6 à 8 chiffres. Pour les entrées à 8 chiffres, il tente d'abord une correspondance exacte, puis utilise le préfixe à 6 chiffres si aucun enregistrement à 8 chiffres n'est trouvé."
        q3: "Que signifie le score de confiance ?"
        a3: "Le champ « confiance » (0,00–1,00) reflète la qualité des données. Les enregistrements confirmés par plusieurs sources de données indépendantes obtiennent un score plus élevé. Un score supérieur à 0,85 indique des données très fiables, les informations relatives à la banque et au pays étant vérifiées auprès de plusieurs sources."
        q4: "Pourquoi le champ issuer_name est-il parfois vide ?"
        a4: "Tous les BIN de l'ensemble de données public ne sont pas associés à des données de nom de banque. Le score de confiance sera donc inférieur pour ces enregistrements. Les champs vides indiquent que les données ne sont pas disponibles pour le BIN concerné."
        q5: "Son utilisation est-elle gratuite ?"
        a5: "La démo ci-dessus fonctionne sans compte. Des abonnements payants sont disponibles pour une utilisation en production, avec des limites de requêtes plus élevées et un accès complet à l'API."
