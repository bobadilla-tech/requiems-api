        q3: "Pourquoi le solde final présente-t-il une légère différence d'arrondi ?"
        a3: "En raison de l'arrondi en virgule flottante sur chaque mensualité, le solde final peut afficher entre 0,00 $ et 0,99 $ au lieu de 0 $ exact. C'est le comportement attendu pour les tableaux d'amortissement à mensualité fixe."
        q4: "Quelle devise l'API utilise-t-elle ?"
