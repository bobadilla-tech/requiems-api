        q4: "Que se passe-t-il si la date de fin précède la date de début ?"
        a4: "L'API retourne une erreur 400 Bad Request. La date de fin doit être égale ou postérieure à la date de début."
        q5: "Les journées partielles sont-elles comptées ?"
