        simplicity_body: "Aucun corps de requête. Aucun parsing complexe. Passez le domaine dans le chemin, votre clé API dans l'en-tête, et obtenez un tableau JSON trié d'enregistrements MX prêt à utiliser dans votre pipeline."
      use_cases:
