      faq:
        a1: Il supprime les balises (par exemple +label), met l'adresse en minuscules
          et supprime les particularités de formatage propres au fournisseur afin
          que les variantes d'une même adresse correspondent à une forme canonique.
        a2: Oui. Les deux sont normalisés. La partie locale est en minuscules et débarrassée
          des suffixes spécifiques au fournisseur. Le domaine est en minuscules et
          résolu en alias lorsque cela est possible.
        a3: La casse est corrigée par la mise en minuscules. Les espaces ne sont pas
          valides dans les adresses électroniques (conformément à la RFC 5321) et
          sont supprimés le cas échéant.
        a4: Oui. Les adresses e-mail Unicode dans les domaines internationalisés sont
          prises en charge. La normalisation des domaines applique la mise en minuscules
          et la résolution des alias ; l’encodage des noms de domaine internationalisés
          dépend du fournisseur de messagerie sous-jacent.
        a5: La démo interactive ne nécessite pas de compte. Une version gratuite est
          disponible après inscription, avec un quota de requêtes mensuel. Consultez
          la page des tarifs pour connaître les limites.
        heading: Foire aux questions
