      faq:
        heading: Foire aux questions
        q1: Quelles sont les valeurs de sentiment possibles ?
        a1: Le champ de sentiment renvoie l'une des trois valeurs — positif, négatif ou neutre — selon la classe ayant le score de confiance le plus élevé.
        q2: Que représente la répartition ?
        a2: Les trois valeurs de répartition (positif, négatif, neutre) totalisent toujours 1,0. Elles montrent la confiance proportionnelle dans toutes les classes, pas seulement la dominante. Un score de 0,97 positif signifie que le modèle est très certain ; 0,51 signifie qu'il penche vers le positif mais que le texte est ambigu.
        q3: Quelle peut être la longueur du texte d'entrée ?
        a3: Il n'y a pas de limite stricte de caractères au niveau de l'API, mais les très longues entrées peuvent être tronquées par le modèle sous-jacent. Visez des entrées de moins de 512 tokens (environ 400 mots) pour une meilleure précision.
        q4: Puis-je analyser plusieurs textes à la fois ?
        a4: Oui. Le point de terminaison par lot (POST /v1/text/sentiment/batch) accepte jusqu'à 50 textes par requête. Les résultats sont renvoyés dans le même ordre que l'entrée et chaque texte compte comme une unité d'utilisation.
        q5: Est-ce gratuit ?
        a5: La démo ci-dessus fonctionne sans compte. Les plans payants offrent des limites de débit plus élevées et un accès complet à l'API pour une utilisation en production.
