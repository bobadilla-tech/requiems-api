      api_combinations:
        heading: "Utilisez-le avec des API complémentaires."
        subheading: "MX Lookup fonctionne encore mieux associé à d'autres API Requiems."
        email_pair: "MX Lookup + Email Validator"
        email_benefit: "Combinez la vérification des enregistrements MX avec la validation complète de la syntaxe, la détection des domaines jetables et la correction des fautes de frappe."
        domain_pair: "MX Lookup + Domain Info"
        domain_benefit: "Consultez les enregistrements MX avec les enregistrements A, NS et CNAME, ainsi que la disponibilité du domaine, dans un seul flux de travail."
        disposable_pair: "MX Lookup + Disposable Email Checker"
        disposable_benefit: "Détectez les domaines d'e-mail jetables à l'inscription tout en vérifiant que les enregistrements MX du domaine sont réels et actifs."
      faq:
        heading: "Questions Fréquentes"
        support_prompt: "Vous avez encore des questions ?"
        support_link: "Contacter le support"
        q1: "Qu'est-ce qu'un enregistrement MX ?"
        a1: "Un enregistrement MX (Mail Exchange) est un enregistrement DNS qui spécifie quel serveur de messagerie est responsable de la réception des e-mails d'un domaine. Tout domaine qui accepte des e-mails doit avoir au moins un enregistrement MX."
        q2: "Que signifie la priorité ?"
        a2: "La priorité MX est une valeur numérique où un nombre plus bas signifie une préférence de livraison plus élevée. Les serveurs de messagerie essaient d'abord l'hôte avec le numéro de priorité le plus bas — par exemple, la priorité 5 est essayée avant la priorité 10. Cela permet de configurer le basculement des serveurs de messagerie au niveau DNS."
        q3: "Que se passe-t-il si un domaine n'a pas d'enregistrements MX ?"
        a3: "L'API retourne une réponse 404. Un domaine sans enregistrements MX ne peut pas recevoir d'e-mails via la livraison SMTP standard."
        q4: "Pourquoi le nom d'hôte se termine-t-il par un point ?"
        a4: "Le point final est la notation DNS standard pour un nom de domaine pleinement qualifié (FQDN). Il indique un nom de domaine absolu et peut être supprimé sans risque lors de l'affichage des noms d'hôtes aux utilisateurs finaux."
        q5: "Les résultats sont-ils toujours triés par priorité ?"
        a5: "Oui. Les enregistrements sont toujours retournés triés par priorité croissante — la valeur numérique la plus basse (priorité de livraison de courrier la plus élevée) apparaît en premier, quel que soit l'ordre retourné par le résolveur DNS."
