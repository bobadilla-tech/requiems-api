        onboarding_context: Intégration
        onboarding_title: Intégration sécurisée avec des domaines de confiance
        subheading: De la prévention de la fraude à l'intégration des utilisateurs,
          si cela concerne un nom de domaine, cette API vous couvre.
      what_it_does:
        accuracy_body: Chaque réponse comprend des données WHOIS analysées (enregistrements
          de propriété et d'enregistrement du domaine), l'état DNS (existence ou non
          d'enregistrements de routage du trafic), la validité SSL (certificat HTTPS
          actif), les enregistrements MX (configuration du serveur de messagerie)
          et un score de réputation — le tout normalisé dans une structure JSON cohérente.
        accuracy_heading: Précision
        heading: Que fait l'API Domain Checker ?
        simplicity_body: 'Une simple requête POST avec votre clé API suffit. Aucun
          SDK, aucune configuration, aucune installation : juste un appel HTTP et
          une réponse JSON.'
        simplicity_heading: Simplicité
        subheading: 'Un seul point d''accès. Tout ce que vous devez savoir sur un
          domaine : disponibilité, propriétaire et historique d''enregistrement.'
