        label_input: "Nom de domaine"
        placeholder: "par exemple example.com"
        no_account: "Aucun compte requis"
      what_it_does:
        heading: "Que fait l'API Domain Checker ?"
        subheading: "Un seul point d'accès. Tout ce que vous devez savoir sur un domaine : disponibilité, propriétaire et historique d'enregistrement."
        accuracy_heading: "Précision"
        accuracy_body: "Chaque réponse comprend des données WHOIS analysées (enregistrements de propriété et d'enregistrement du domaine), l'état DNS (existence ou non d'enregistrements de routage du trafic), la validité SSL (certificat HTTPS actif), les enregistrements MX (configuration du serveur de messagerie) et un score de réputation — le tout normalisé dans une structure JSON cohérente."
        simplicity_heading: "Simplicité"
        simplicity_body: "Une simple requête POST avec votre clé API suffit. Aucun SDK, aucune configuration, aucune installation : juste un appel HTTP et une réponse JSON."
      use_cases:
        heading: "Conçu pour tous les flux de travail de domaine"
        subheading: "De la prévention de la fraude à l'intégration des utilisateurs, si cela concerne un nom de domaine, cette API vous couvre."
        auth_context: "Authentification / Inscription"
        auth_title: "Évitez les domaines risqués avant de vous inscrire."
        auth_body: "Vérifiez la validité du domaine avant de l'accepter comme domaine professionnel fourni par l'utilisateur. Refusez les domaines expirés, en attente ou signalés."
        fraud_context: "Prévention de la fraude"
        fraud_title: "Bloquer les domaines malveillants ou expirés"
        fraud_body: "Détectez les domaines signalés comme spam ou phishing, ou ceux dont l'enregistrement a expiré. Empêchez les personnes mal intentionnées d'abuser de votre plateforme."
        integrations_context: "Intégrations"
        integrations_title: "Vérifier les domaines partenaires dans les flux de travail"
        integrations_body: "Vérifiez que les domaines des partenaires ou des fournisseurs sont actifs et correctement configurés avant de les intégrer dans les flux de travail automatisés."
        email_marketing_context: "Marketing par e-mail"
        email_marketing_title: "Vérifiez l'état du domaine avant les campagnes par e-mail"
        email_marketing_body: "Vérifiez les enregistrements MX et la réputation du domaine avant de cibler une liste d'adresses. Réduisez le risque de rebond pour l'ensemble des domaines d'envoi."
        devops_context: "DevOps / Surveillance"
        devops_title: "Détecter les problèmes DNS ou SSL manquants"
        devops_body: "Détectez les enregistrements DNS manquants ou les certificats SSL expirés avant qu'ils n'entraînent des interruptions de service ou des erreurs pour les utilisateurs."
        onboarding_context: "Intégration"
        onboarding_title: "Intégration sécurisée avec des domaines de confiance"
        onboarding_body: "Lors de l'intégration d'une entreprise, seuls les domaines disposant d'un DNS vérifié, d'un enregistrement MX actif et d'une bonne réputation seront autorisés. Les domaines jetables ou nouvellement enregistrés seront bloqués."
      api_combinations:
        heading: "Associez-le à d'autres API"
        subheading: "L'outil Domain Checker est plus puissant lorsqu'il est combiné à d'autres Requiems API. Combinez-le pour intégrer une validation multipoint dans un flux de travail unique."
        label_benefit: "Avantage:"
        label_outcome: "Résultat:"
        email_validator_name: "Vérificateur de domaine + validateur d'email"
        email_validator_benefit: "Validez à la fois le domaine et l'adresse électronique spécifique."
        email_validator_outcome: "Confiance totale en matière de délivrabilité des e-mails : vérifications de l’état du domaine et au niveau de la boîte aux lettres."
        vpn_detection_name: "Vérificateur de domaine + Détection de VPN"
        vpn_detection_benefit: "Vérifiez l'état du domaine tout en identifiant le trafic VPN ou proxy provenant de la même requête."
        vpn_detection_outcome: "Signal de fraude à double niveau : un domaine signalé combiné à un trafic anonymisé constitue un puissant déclencheur de blocage."
        phone_validator_name: "Vérificateur de domaine + validateur de numéro de téléphone"
        phone_validator_benefit: "Vérifiez l'état du domaine et le numéro de téléphone lors de la même étape d'intégration."
        phone_validator_outcome: "Validation multipoint des contacts — présence numérique confirmée et numéro de téléphone joignable — avant d'accorder l'accès."
      faq:
        heading: "Foire aux questions"
        support_prompt: "Vous avez encore des questions ?"
        support_link: "Contactez l'assistance"
        q1: "Que vérifie exactement Domain Checker ?"
        a1: "Il vérifie l'existence des enregistrements DNS, la présence des enregistrements MX, la validité du certificat SSL et la réputation du domaine par rapport aux listes de menaces connues."
        q2: "Vérifie-t-il si le domaine possède un serveur de messagerie ?"
        a2: "Oui. Le champ mx_valid indique si le domaine possède des enregistrements MX valides configurés — une condition préalable à la réception de courriels."
        q3: "Vérifie-t-il les certificats SSL ?"
        a3: "Oui. La fonction `ssl_valid` renvoie `true` si le domaine possède un certificat SSL valide et non expiré. Elle ne vérifie ni la profondeur de la chaîne de certificats ni le statut de validation étendue."
        q4: "Peut-il valider plusieurs domaines simultanément ?"
        a4: "Ce point de terminaison accepte un domaine par requête. Pour une validation en masse, effectuez des appels en parallèle ou utilisez le point de terminaison de traitement par lots si votre forfait le permet."
        q5: "La version de démonstration est-elle gratuite ?"
        a5: "La démo interactive ne nécessite pas de compte. Une version gratuite est disponible après inscription, avec un quota de requêtes mensuel. Consultez la page des tarifs pour connaître les limites."
      cta:
        heading: "Automatisez cela avec Requiems."
        body: "Une seule clé API. Disponibilité des domaines, données WHOIS et plus de 50 autres API couvrant la validation, les réseaux, la finance et bien plus encore."
        cta_primary: "Obtenez votre clé API gratuite"
        cta_docs: "Lire la documentation →"
      show:
        free_domain_checker_availability_dns: "Vérificateur de domaine gratuit — Disponibilité, DNS et WHOIS | Requiems API"
    email_normalizer:
      hero:
        title: "Nettoyez automatiquement les adresses e-mail, à chaque fois."
        subtitle: "Normalisez, mettez en minuscules, tronquez et canonisez les adresses e-mail en un seul appel API."
      what_it_does:
        clean_data_badge: "Données propres"
        clean_data_heading: "Normalisez la saisie des courriels en un seul appel."
        clean_data_body: "L'API supprime les espaces, met l'adresse en minuscules, corrige les alias de fournisseurs courants et renvoie une adresse e-mail canonique — afin que chaque adresse stockée dans votre système soit cohérente."
        integration_badge: "Intégration"
        integration_heading: "Une seule demande, une normalisation instantanée."
        integration_body: "Envoyez une requête POST à /v1/validation/email-normalize avec l'adresse e-mail dans le corps du message et votre clé API dans l'en-tête. Aucun SDK requis."
        post_v1_validation_email_normalize_200: "POST /v1/validation/email-normalize → 200 OK"
      use_cases:
        heading: "De vrais problèmes, de vrais utilisateurs."
        subheading: "Email Normalizer s'intègre partout où la qualité des données de contact est importante."
        import_context: "Importation de données"
        import_title: "Normalisez les données de messagerie avant l'importation."
        import_desc: "Normalisez les adresses e-mail avant l'importation en masse dans votre base de données. Évitez ainsi que les variations de format ne créent des doublons."
        crm_dedup_context: "CRM / Données"
        crm_dedup_title: "Fusionner les comptes en double avec des adresses e-mail normalisées"
        crm_dedup_desc: "Utilisez le format normalisé comme clé de déduplication. Identifiez les comptes appartenant à une même personne, quel que soit le format de leur adresse électronique."
        integrations_context: "Intégrations"
        integrations_title: "Améliorer la correspondance des adresses électroniques entre les systèmes"
        integrations_desc: "Normalisez les données avant les recherches inter-systèmes. Assurez-vous que User.Name@Gmail.com et username@gmail.com correspondent à la même identité."
        analytics_context: "Analytique"
        analytics_title: "Normaliser les e-mails d'inscription à des fins d'analyse"
        analytics_desc: "Standardisez les données dès leur saisie. Assurez la cohérence des analyses et de la segmentation, quelle que soit la manière dont les utilisateurs saisissent leur adresse."
        crm_dup_context: "CRM / Données"
        crm_dup_title: "Réduisez les faux doublons dans votre CRM."
        crm_dup_desc: "Cessez de traiter les différentes adresses e-mail comme des contacts distincts. La normalisation permet de réduire le nombre excessif de contacts et d'améliorer la qualité de vos listes."
        outreach_context: "Marketing par e-mail"
        outreach_title: "Nettoyer les archives de courriels avant toute prise de contact"
        outreach_desc: "Normalisez votre liste avant l'envoi. Détectez les rebonds dus aux variations avant qu'ils n'affectent la réputation de l'expéditeur."
      api_combinations:
        heading: "À utiliser conjointement avec des API complémentaires."
        subheading: "Les Requiems API sont conçus pour être utilisés de manière combinée. Associez Email Normalizer à d'autres points de terminaison pour créer un pipeline complet de validation des contacts avec une seule clé API."
        validator_pair: "Normalisateur d'emails + Validateur d'emails"
        validator_benefit: "Normaliser puis valider pour une hygiène complète des courriels."
        validator_outcome: "Un e-mail propre et conforme aux normes, dont la délivrabilité est confirmée — idéal pour les flux d'inscription et d'importation."
        phone_pair: "Normalisateur d'emails + validateur de numéros de téléphone"
        phone_benefit: "Normaliser l'adresse e-mail et valider le numéro de téléphone en une seule étape."
        phone_outcome: "Des données de contact cohérentes et vérifiées sur les deux canaux à partir d'un seul appel d'intégration."
        domain_pair: "Normalisateur d'emails + Vérificateur de domaine"
        domain_benefit: "Normalisez les emails et vérifiez simultanément l'intégrité du domaine."
        domain_outcome: "Adresse e-mail canonique associée au score de confiance du domaine — plus de confiance avant la prise de contact."
      faq:
        heading: "Foire aux questions"
        q1: "Que fait concrètement Email Normalizer ?"
        a1: "Il supprime les balises (par exemple +label), met l'adresse en minuscules et supprime les particularités de formatage propres au fournisseur afin que les variantes d'une même adresse correspondent à une forme canonique."
        q2: "Est-ce que cela normalise la partie domaine et la partie locale ?"
        a2: "Oui. Les deux sont normalisés. La partie locale est en minuscules et débarrassée des suffixes spécifiques au fournisseur. Le domaine est en minuscules et résolu en alias lorsque cela est possible."
        q3: "Peut-il corriger la mise en majuscules et les espacements ?"
        a3: "La casse est corrigée par la mise en minuscules. Les espaces ne sont pas valides dans les adresses électroniques (conformément à la RFC 5321) et sont supprimés le cas échéant."
        q4: "Est-ce compatible avec les e-mails internationaux ?"
        a4: "Oui. Les adresses e-mail Unicode dans les domaines internationalisés sont prises en charge. La normalisation des domaines applique la mise en minuscules et la résolution des alias ; l’encodage des noms de domaine internationalisés dépend du fournisseur de messagerie sous-jacent."
        q5: "L'utilisation de la version de démonstration est-elle gratuite ?"
        a5: "La démo interactive ne nécessite pas de compte. Une version gratuite est disponible après inscription, avec un quota de requêtes mensuel. Consultez la page des tarifs pour connaître les limites."
      cta:
        heading: "Automatisez cela avec Requiems."
        body: "Une seule clé API. Normalisation des e-mails et bien plus encore dans Requiems."
        cta_primary: "Obtenez votre clé API gratuite"
        cta_docs: "Lire la documentation →"
