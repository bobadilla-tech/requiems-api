      faq:
        heading: "Questions fréquentes"
        support_prompt: "Encore des questions ?"
        support_link: "Contacter le support"
        q1: "Quelle est la différence entre les variantes standard et url ?"
        a1: "Le Base64 standard utilise l'alphabet A-Z, a-z, 0-9, + et /. La variante url (base64url) remplace + par - et / par _ afin que la sortie puisse être incluse directement dans des URLs et noms de fichiers sans encodage pourcentage."
        q2: "L'endpoint de décodage accepte-t-il une entrée sans remplissage ?"
        a2: "Non. Les deux variantes utilisent un décodage Base64 strict qui requiert un remplissage = correct. Si votre entrée manque de remplissage, ajoutez le nombre approprié de caractères = avant de décoder — sinon vous obtiendrez une erreur Base64 invalide."
