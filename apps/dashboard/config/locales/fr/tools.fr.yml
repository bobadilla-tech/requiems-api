      what_it_does:
        coverage_badge: "Couverture"
        coverage_heading: "Détection VPN, proxy, Tor et hébergement en une seule requête."
        coverage_body: "VPN & Proxy Detection utilise la base de données IP2Proxy pour identifier les fournisseurs de VPN, les proxys publics et web, les nœuds de sortie Tor et les IP de centres de données ou d'hébergement. Les données d'organisation ASN proviennent d'une base de données MaxMind distincte. IPv4 et IPv6 sont tous deux entièrement pris en charge."
        simplicity_badge: "Simplicité"
        simplicity_heading: "Une seule requête GET. Pas de corps, pas d'analyse."
        simplicity_body: "Intégrez l'adresse IP dans l'URL. Votre clé API dans l'en-tête. La réponse est un JSON brut avec des indicateurs booléens, un score de menace et un score de fraude directement exploitables."
      use_cases:
        heading: "Conçu pour les flux de fraude et de risque."
        subheading: "VPN & Proxy Detection s'intègre partout où la confiance basée sur l'IP compte : inscription, authentification, bots et conformité."
        signup_title: "Évaluez le risque à l'inscription"
        signup_desc: "Signalez ou bloquez les inscriptions provenant d'IP VPN, proxy ou Tor — un signal fort de fermes de fraude et de création de faux comptes."
        signup_tags: "Prévention de la fraude, Fintech"
