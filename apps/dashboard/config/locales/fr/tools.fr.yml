      faq:
        a1: Il indique si le numéro est valide et joignable, le pays et l'indicatif du pays, le nom de l'opérateur, le type de ligne (mobile, fixe, VoIP, numéro vert ou surtaxé) et le numéro formaté selon la norme E.164 et les normes locales.
        a2: Oui. Il prend en charge les numéros de téléphone de plus de 200 pays et territoires. Vous pouvez saisir le numéro au format E.164 avec l'indicatif du pays, ou laisser l'API détecter le pays à partir du format du numéro.
        a3: Oui. Le champ line_type permet de distinguer les numéros mobiles, fixes, VoIP, gratuits et surtaxés. Utilisez-le pour signaler les numéros virtuels ou jetables afin de détecter les fraudes.
        a4: La détection des opérateurs s'appuie sur des bases de données mondiales et est précise pour la plupart des grands opérateurs d'Amérique du Nord, d'Europe et d'Asie. La précision peut varier pour les MVNO et les opérateurs régionaux de plus petite taille.
