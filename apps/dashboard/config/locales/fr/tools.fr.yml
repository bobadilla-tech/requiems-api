      what_it_does:
        records_badge: "Enregistrements DNS"
        records_heading: "Tous les enregistrements MX, triés par priorité."
        records_body: "MX Lookup interroge le DNS pour récupérer tous les enregistrements d'échange de courrier d'un domaine et les retourne triés par priorité croissante — la valeur la plus basse en premier, conformément au RFC 5321. Chaque résultat inclut le nom d'hôte du serveur de messagerie et sa valeur de priorité numérique."
        simplicity_badge: "Simplicité"
