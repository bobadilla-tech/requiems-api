        heading: "Questions fréquentes"
        subheading: "Tout ce qu'il faut savoir sur Requiems API"
        q1: "Requiems API est-il vraiment gratuit pour commencer ?"
        a1: "Oui ! 500 requêtes par mois entièrement gratuites, sans carte bancaire. Idéal pour tester, les projets perso et les petites applications. Passez à une formule payante seulement quand vous avez besoin de plus."
        q2: "Puis-je l'utiliser pour des projets commerciaux ?"
        a2: "Oui ! Toutes les formules, y compris la gratuite, peuvent servir à des projets commerciaux dans les limites d'usage. Notre service géré est pensé pour la production, quelle que soit la taille de l'entreprise."
        q3: "Où se trouvent vos serveurs ?"
        a3: "Tous nos centres de données sont dans l'Union européenne, avec le réseau edge mondial de Cloudflare pour la conformité RGPD."
        q4: "Quels moyens de paiement acceptez-vous ?"
        a4: "Les principales cartes bancaires via notre prestataire LemonSqueezy (Visa, Mastercard, American Express selon les pays)."
