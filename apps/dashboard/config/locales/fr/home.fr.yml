    faq:
      title: "FAQ — Requiems API"
      heading: "Questions fréquentes"
      subheading: "Réponses aux questions courantes sur la facturation, l'authentification, les limites de débit et l'intégration."
      intro: "Facturation, authentification, limites de débit et passage de l'inscription à la production rapidement."
      getting_started:
        heading: "Pour commencer"
        q1: "Comment démarrer avec Requiems API ?"
        a1_html: "C'est simple ! Créez un compte gratuit, générez votre clé API depuis le tableau de bord et lancez vos requêtes. Consultez notre %{docs_link} pour des guides d'intégration détaillés."
        docs_link: "documentation"
        q2: "Ai-je besoin d'une carte bancaire pour commencer ?"
        a2: "Non ! La formule gratuite inclut 500 requêtes mensuelles sans carte bancaire. Idéal pour tester et les petits projets. Vous pouvez changer de formule quand vous voulez."
        q3: "Quels langages de programmation sont pris en charge ?"
        a3: "Notre API REST fonctionne avec tout langage capable d'effectuer des requêtes HTTP. Nous fournissons des exemples pour JavaScript/Node.js, Python, PHP, Ruby, Go, Java, etc."
      authentication:
        heading: "Authentification"
        q1: "Comment authentifier mes requêtes ?"
        a1: "Incluez votre clé API dans l'en-tête Authorization en tant que jeton Bearer :"
        q2: "Quelle est la différence entre les clés de test et de production ?"
        a2_html: "Les clés de test (préfixe <code class=\"bg-gray-100 dark:bg-gray-700 dark:text-gray-300 px-2 py-1 rounded\">rq_test_</code>) servent au développement et aux tests. Les clés de production (<code class=\"bg-gray-100 dark:bg-gray-700 dark:text-gray-300 px-2 py-1 rounded\">rq_live_</code>) sont pour la production. Les deux types comptent dans le quota mensuel."
        q3: "Puis-je régénérer ma clé API ?"
        a3: "Oui ! Dans le tableau de bord, ouvrez la clé concernée et choisissez « Régénérer ». L'ancienne cesse de fonctionner immédiatement : mettez à jour toutes vos applications."
      billing:
        heading: "Facturation et usage"
        q1: "Comment est calculée la facturation ?"
        a1: "Chaque appel API coûte 1 requête. Votre formule inclut un quota mensuel réinitialisé au début de chaque période. Certains points de terminaison peuvent compter plus d'une requête ; c'est indiqué dans leur documentation."
        q2: "Que se passe-t-il si je dépasse ma limite de requêtes ?"
        a2: "À 75 % du quota, nous vous envoyons une alerte. À 90 %, un second avertissement. À 100 %, les requêtes renvoient 429 jusqu'à changement de formule ou prochain cycle de facturation."
        q3: "Puis-je monter ou descendre de formule ?"
        a3: "Oui ! Vous pouvez changer de formule à tout moment depuis la facturation. Les montées sont immédiates ; les descentes s'appliquent au début de la période suivante."
        q4: "Les requêtes non utilisées sont-elles reportées ?"
        a4: "Non. Le quota se réinitialise à chaque période. Choisissez une formule adaptée à votre usage mensuel type."
      rate_limits:
        heading: "Limites de débit"
        q1: "Quelles sont les limites de débit ?"
        a1: "Elles varient selon la formule :"
        free: "Gratuit : %{rate_limit} requêtes/minute"
        developer: "Développeur : %{rate_limit} requêtes/minute"
        business: "Business : %{rate_limit} requêtes/minute"
        professional: "Professionnel : %{rate_limit} requêtes/minute"
        q2: "Comment gérer les erreurs de limite de débit ?"
        a2_html: "En cas d'erreur 429, implémentez un backoff exponentiel. Attendez quelques secondes avant de réessayer. Consultez l'en-tête <code class=\"bg-gray-100 dark:bg-gray-700 dark:text-gray-300 px-2 py-1 rounded\">Retry-After</code> pour le délai recommandé. Envisagez une formule supérieure si vous atteignez souvent la limite."
      support:
        heading: "Support"
        q1: "Comment obtenir de l'aide ?"
        a1: "Plusieurs canaux :"
        docs_channel:
          label: "Documentation"
          description: "Guides complets et référence API"
        contact_channel:
          label: "Formulaire de contact"
          description: "Support e-mail (réponse sous 24–48 h)"
        github_channel:
          label: "Issues GitHub"
          description: "Signaler des bogues ou demander des fonctionnalités"
        q2: "Quels sont vos délais de réponse ?"
        a2: "Ils varient selon la formule :"
        free_dev: "Gratuit et Développeur : 48 h"
        business_time: "Business : 24 h"
        professional_time: "Professionnel : 12 h (support prioritaire)"
        q3: "Proposez-vous un support entreprise ?"
        a3_html: "Oui ! Les clients entreprise bénéficient d'un support dédié avec délais garantis, accès direct à l'équipe d'ingénierie et assistance prioritaire. %{sales_link} pour en savoir plus."
        contact_sales: "Contacter les ventes"
      still_questions:
        heading: "Encore des questions ?"
        text: "Nous sommes là pour vous aider ! Contactez le support ou consultez la documentation."
        contact: "Contacter le support"
        docs: "Voir la documentation"
