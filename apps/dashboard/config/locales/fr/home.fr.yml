    glossary:
      title: "Glossaire API — Requiems API"
      heading: "Glossaire API"
      description: "Terminologie essentielle pour tout développeur d'API"
      terms:
        - name: "API (interface de programmation d'applications)"
          definition: "Un ensemble de définitions et de protocoles permettant à des applications logicielles de communiquer entre elles. Les APIs définissent les méthodes et formats d'échange d'informations."
          example: "Exemple : Requiems API fournit une API REST pour valider des adresses e-mail par programme."
        - name: "Point de terminaison (endpoint)"
          definition: "Une URL précise où une API accède aux ressources nécessaires. Chaque point de terminaison correspond à une fonction ou ressource donnée."
          example: "Exemple : <code class=\"bg-gray-100 dark:bg-gray-700 dark:text-gray-300 px-2 py-1 rounded\">POST /v1/networking/disposable/check</code>"
        - name: "Authentification"
          definition: "Vérification de l'identité d'un utilisateur ou d'une application. Les APIs exigent en général une authentification pour limiter l'accès aux clients autorisés."
          example: "Exemple : inclure votre clé API dans l'en-tête Authorization : <code class=\"bg-gray-100 dark:bg-gray-700 dark:text-gray-300 px-2 py-1 rounded\">Authorization: Bearer VOTRE_CLE_API</code>"
        - name: "Clé API"
          definition: "Identifiant unique servant à authentifier les requêtes. Elle sert à la fois d'identifiant et de secret."
          example: "Exemple : <code class=\"bg-gray-100 dark:bg-gray-700 dark:text-gray-300 px-2 py-1 rounded\">rq_live_1234567890abcdef</code>"
        - name: "Limitation de débit"
          definition: "Technique pour limiter le nombre de requêtes dans une fenêtre de temps. Limite les abus et garantit un usage équitable."
          example: "Exemple : la formule gratuite autorise 30 requêtes par minute"
        - name: "Requêtes"
          definition: "Unité d'usage de l'API. Chaque appel compte pour 1 requête sur votre quota mensuel. Certains points de terminaison peuvent compter plus ; c'est indiqué dans leur documentation."
          example: "Exemple : un appel au point de terminaison de validation e-mail consomme 1 requête sur votre quota."
        - name: "REST (Representational State Transfer)"
          definition: "Style d'architecture pour applications réseau. Les APIs REST utilisent HTTP pour les opérations CRUD sur les ressources."
          example: "Exemple : GET pour lire, POST pour créer, PUT pour mettre à jour, DELETE pour supprimer"
        - name: "JSON (JavaScript Object Notation)"
          definition: "Format d'échange léger, lisible par les humains et facile à parser par les machines. La plupart des APIs modernes utilisent JSON pour les corps de requête/réponse."
          example: "Exemple : <code class=\"bg-gray-100 dark:bg-gray-700 dark:text-gray-300 px-2 py-1 rounded\">{\"email\": \"test@example.com\", \"is_disposable\": false}</code>"
        - name: "Codes de statut HTTP"
          definition: "Codes à trois chiffres indiquant le résultat d'une requête HTTP. Exemples : 200 (succès), 404 (introuvable), 500 (erreur serveur)."
          example: "En savoir plus : <a href=\"/fr/error_codes\" class=\"text-blue-600 hover:text-blue-700\">Référence des codes d'erreur</a>"
        - name: "Webhook"
          definition: "Mécanisme pour qu'une application pousse des informations en temps réel vers une autre, au lieu de requêtes répétées depuis le client."
          example: "Exemple : recevoir une notification lorsque votre solde de requêtes passe sous un seuil"
        - name: "Paramètres de requête"
          definition: "Paires clé-valeur ajoutées à l'URL pour filtrer, trier ou modifier la réponse. Ils apparaissent après le « ? »."
          example: "Exemple : <code class=\"bg-gray-100 dark:bg-gray-700 dark:text-gray-300 px-2 py-1 rounded\">/v1/words?limit=10&min_length=5</code>"
        - name: "En-têtes"
          definition: "Métadonnées envoyées avec les requêtes et réponses HTTP : jetons d'authentification, types de contenu, etc."
          example: "Exemple : <code class=\"bg-gray-100 dark:bg-gray-700 dark:text-gray-300 px-2 py-1 rounded\">Content-Type: application/json</code>"
      help:
        heading: "Besoin d'aide ?"
