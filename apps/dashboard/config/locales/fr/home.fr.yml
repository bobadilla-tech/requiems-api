    privacy:
      title: "Politique de confidentialité — Requiems API"
      heading: "Politique de confidentialité"
      last_updated: "Dernière mise à jour : %{date}"
      overview:
        heading: "Vue d'ensemble"
        text: "Requiems API (« nous », « notre ») s'engage à protéger votre vie privée. Cette politique explique comment nous collectons, utilisons, divulguons et protégeons vos informations lorsque vous utilisez notre plateforme et nos services API."
      information_we_collect:
        heading: "Informations collectées"
        account:
          heading: "Compte"
          text: "Lors de l'inscription, nous collectons votre adresse e-mail, votre nom et les informations de facturation."
        api_usage:
          heading: "Données d'usage API"
          text: "Nous collectons des métadonnées sur vos requêtes : horodatages, point de terminaison appelé, codes de réponse. Nous ne journalisons PAS le contenu réel des requêtes ou réponses."
        technical:
          heading: "Informations techniques"
          text: "Nous collectons automatiquement les adresses IP, les user-agents et d'autres données techniques pour la sécurité et l'exploitation."
      how_we_use:
        heading: "Utilisation de vos informations"
        items:
          - "Fournir, maintenir et améliorer nos services"
          - "Traiter vos transactions et envoyer les informations associées"
          - "Vous envoyer des avis techniques, mises à jour et messages de support"
          - "Surveiller et analyser les tendances d'usage"
          - "Détecter, prévenir et traiter les problèmes techniques et la fraude"
          - "Respecter nos obligations légales"
      data_storage:
        heading: "Stockage et sécurité des données"
        text: "Toutes les données sont stockées sur des serveurs situés dans l'Union européenne. Nous mettons en œuvre des mesures de sécurité conformes aux usages du secteur, notamment :"
        items:
          - "Chiffrement TLS 1.3 pour les données en transit"
          - "Chiffrement AES-256 pour les données au repos"
          - "Audits et surveillance de sécurité réguliers"
          - "Contrôles d'accès et mécanismes d'authentification"
      data_retention:
        heading: "Conservation des données"
        text: "Nous conservons les informations de compte tant que le compte est actif. Les journaux d'usage sont conservés 90 jours. Vous pouvez demander la suppression de votre compte et des données associées à tout moment."
      gdpr:
        heading: "Vos droits (RGPD)"
        intro: "Si vous êtes dans l'Espace économique européen, vous disposez des droits suivants :"
        items:
          - "Droit d'accès à vos données personnelles"
          - "Droit de rectification des données inexactes"
          - "Droit à l'effacement (« droit à l'oubli »)"
          - "Droit à la limitation du traitement"
          - "Droit à la portabilité des données"
