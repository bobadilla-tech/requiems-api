    validation:
      meta_title: API de validation | API Requiems
      hero:
        headline: Validez les données avant qu'elles ne détruisent votre application.
        subheadline: Arrêtez les mauvais e-mails, les téléphones invalides et les contenus toxiques grâce à des API qui détectent les problèmes à la source.
        primary_cta: Obtenir la clé API
        secondary_cta: Commencez gratuitement
      strategy_call:
        label: Réservez un appel stratégique
      tagline: 'Ces histoires concernent de mauvaises données avant qu''elles ne s''aggravent : fausses inscriptions, mauvais numéros et textes risqués. Ils sont rédigés pour les équipes qui ont besoin d’un chemin rapide et crédible vers des entrées plus propres.'
      filters:
      - key: tous
        label: Tous les cas
      - key: email_validateur
        label: Validateur d'e-mail
      - key: validation_téléphone
        label: Validation par téléphone
      - key: filtre_profanité
        label: Filtre à grossièretés
      featured_cases: []
      use_cases:
      - filter_key: email_validateur
        endpoint: POST /v1/validation/email
        title: Détectez les mauvaises adresses avant les campagnes et la synchronisation CRM
        description: Empêchez les e-mails invalides d'entrer dans votre base de données. Des listes plus claires signifient une meilleure délivrabilité et moins de dépenses inutiles.
        tag_problem: Validation par e-mail
        tag_industry: Commercialisation
        case_anchor: cas-e-mail-rebonds
        example: 'Un flux d''inscription SaaS appelle la validation des e-mails après le flou. Les domaines jetables et les fautes de frappe sont rejetés avant l''envoi de l''e-mail de bienvenue : le support cesse de corriger les adresses « une lettre fausse ».'
      - filter_key: validation_téléphone
        endpoint: GET /v1/validation/phone
        title: Atteignez des numéros réels sur les flux SMS et OTP
        description: Validez les numéros de téléphone pour les campagnes SMS. Atteignez de vrais utilisateurs et supprimez les envois échoués.
        tag_problem: Validation par téléphone
        tag_industry: Commerce électronique
        case_anchor: cas-envoi-sms
        example: Une marque de commerce électronique valide E.164 et le type de ligne à l'étape OTP. Les numéros de téléphone invalides ou fixes n'atteignent jamais la passerelle SMS, ce qui réduit les coûts OTP et les tickets d'échec de livraison.
      - filter_key: filtre_profanité
        endpoint: POST /v1/validation/profanity
        title: Gardez les flux publics et les forums civils à grande échelle
        description: Filtrez les grossièretés dans le contenu généré par les utilisateurs. Protégez les communautés sans examen manuel de chaque publication.
        tag_problem: Modération du contenu
        tag_industry: Réseaux sociaux
        case_anchor: cas-toxique-commentaires
        example: Une application communautaire exécute le texte des commentaires via un filtre de grossièretés côté serveur. Les abus évidents sont bloqués ; les messages limites sont en file d'attente pour examen par le modérateur au lieu d'être mis en ligne.
      - filter_key: email_validateur
        endpoint: POST /v1/validation/email
        title: Inscription d'entreprise plus rapide avec moins de tentatives informatiques
        description: Rationalisez l’intégration grâce aux vérifications des e-mails en périphérie. Moins de tentatives, moins de tickets d’assistance.
        tag_problem: Expérience utilisateur
        tag_industry: SaaS
        case_anchor: cas-e-mail-rebonds
        example: Le libre-service d'entreprise vérifie le domaine et MX avant d'envoyer des invitations SSO. Les hôtes morts et les fautes de frappe échouent rapidement, le service informatique n'attend donc pas des rebonds qui n'apparaissent jamais dans l'interface utilisateur.
      - filter_key: validation_téléphone
        endpoint: GET /v1/validation/phone
        title: Valider les données des abonnés avant le portage et les tickets
        description: Détectez les erreurs téléphoniques avant qu’elles ne provoquent des problèmes en aval. Le support passe du temps sur de vrais problèmes.
        tag_problem: Qualité des données
        tag_industry: Télécom
        case_anchor: cas-envoi-sms
        example: Un portail d'opérateur valide les numéros d'abonné lorsqu'un client dépose une demande de portage. Les mauvaises entrées reviennent le jour même au lieu d’après une semaine de désabonnement « numéro non trouvé ».
      - filter_key: filtre_profanité
        endpoint: POST /v1/validation/profanity
        title: Modération du chat en jeu sans énormes listes de blocage de clients
        description: Modérez automatiquement le texte pour des plateformes plus sûres. Améliorez la confiance et la sécurité avec votre produit.
        tag_problem: Sécurité du contenu
        tag_industry: Jeux
        case_anchor: cas-toxique-commentaires
        example: Le chat en jeu est vérifié lors de l'envoi. Les chaînes à haut risque sont supprimées ou masquées ; les expéditeurs réguliers bénéficient d'un temps de recharge sans envoyer une énorme liste de blocage dans le bundle client.
      scale_metrics:
      - value: 99,99%
        label: Objectif de disponibilité de la plateforme
      - value: ~500ms
        label: Temps de réponse moyen de l'API
      - value: 10 000+
        label: Nombre maximal de validations par minute (en fonction du niveau)
      how_it_works:
        step1_title: Choisissez un motif qui vous semble familier
        step1_body: Choisissez une carte qui reflète les points où vous perdez du temps aujourd'hui (rebonds, échecs de SMS ou UGC bruyant). Chaque résultat correspond à des points de terminaison que vous pouvez essayer avec une petite modification dans votre formulaire ou votre pipeline.
        step2_title: Câblez-le dans votre pile
        step2_body: Utilisez les exemples de référence, ajoutez votre clé API et appelez les points de terminaison HTTPS depuis votre backend ou Edge. La plupart des équipes expédient la première version la même semaine où elles lisent la documentation.
        step3_title: Prouvez-le avec vos propres mesures
        step3_body: 'Comparez avant et après dans des tableaux de bord auxquels vous faites déjà confiance : moins d''échecs, des files d''attente plus courtes, une assistance plus calme ou des pages plus rapides une fois que les mauvaises entrées cessent de se propager.'
