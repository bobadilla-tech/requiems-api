        example: Les messages du forum sont exécutés via une API grossière lors de leur soumission. Les publications bloquées renvoient une raison en ligne ; les modérateurs examinent uniquement la file d'attente signalée au lieu de chaque fil de discussion.
      - filter_key: épeler
        endpoint: POST /v1/text/spellcheck
        title: Détecter les fautes de frappe au moment de la publication dans les documents et le CMS
        description: Corrigez les fautes de frappe avant de publier. Réduisez les risques liés à la marque dans les e-mails, les documents et les copies intégrées à l'application.
        tag_problem: Qualité d'écriture
        tag_industry: SaaS
        case_anchor: cas-sort
        example: Le centre d'aide « Publier » exécute la vérification orthographique sur Markdown. Les éditeurs voient les correctifs suggérés dans la barre latérale avant que l'article ne soit rendu public et indexé.
      - filter_key: similarité
        endpoint: POST /v1/text/similarity
        title: Macros de déduplication et connaissances quasi-dupliquées
        description: Faites correspondre un contenu similaire avec une similarité de texte. Améliorez les recommandations et la déduplication.
        tag_problem: Pertinence de la recherche
        tag_industry: Commerce électronique
        case_anchor: langue de cas
        example: Le support ingère de nouvelles macros et les compare à celles existantes. Les doublons supérieurs à 0,9 cosinus fusionnent automatiquement afin que les agents cessent de sélectionner des extraits presque identiques.
      - filter_key: langue
        endpoint: POST /v1/text/detect-language
        title: Acheminer le contenu collé vers le pipeline de paramètres régionaux approprié
        description: Identifiez automatiquement la langue pour la localisation. Orientez les utilisateurs vers la bonne expérience plus rapidement.
        tag_problem: Localisation
        tag_industry: Applications mondiales
        case_anchor: langue de cas
        example: Un site de documentation détecte la langue du premier paragraphe collé. Les sources non anglaises sont acheminées vers la file d'attente du fournisseur de traduction avec les métadonnées locales attachées.
      - filter_key: thésaurus
        endpoint: GET /v1/text/thesaurus/{word}
        title: Titres et textes plus forts sans changement d'onglet
        description: Trouvez instantanément des synonymes plus forts. Aidez le marketing et les produits à expédier des copies plus nettes.
        tag_problem: Rédaction
        tag_industry: Commercialisation
        case_anchor: cas-sort
        example: 'Le générateur de pages de destination propose trois variantes de titre : chaque mot marqué comme faible reçoit des suggestions de synonymes de l''API du thésaurus avant l''allocation A/B.'
      - filter_key: dictionnaire
        endpoint: GET /v1/text/dictionary/{word}
        title: Une définition canonique dans le centre d'aide et le chat
