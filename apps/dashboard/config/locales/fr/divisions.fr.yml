    places:
      meta_title: API Places | API Requiems
      hero:
        headline: Créez des applications mondiales sans friction de localisation.
        subheadline: API de fuseau horaire, de vacances et de géolocalisation pour des produits prêts à l'emploi et fonctionnant partout.
        primary_cta: Obtenir la clé API
        secondary_cta: Commencez gratuitement
      strategy_call:
        label: Réservez un appel stratégique
      tagline: Ces histoires concernent des horloges, des calendriers et des adresses qui se brisent lorsque vous vous mondialisez. Ils mettent en évidence les API qui comportent des nuances régionales afin que votre produit n'ait pas à le faire.
      filters:
      - key: tous
        label: Tous les cas
      - key: fuseau horaire
        label: Fuseau horaire
      - key: heure_monde
        label: Heure mondiale
      - key: jours_travail
        label: Calculateur de jours ouvrables
      - key: vacances
        label: Vacances
      - key: géocoder
        label: Géocodage
      - key: postal
        label: Code Postal
      - key: villes
        label: Villes
      featured_cases: []
      use_cases:
      - filter_key: fuseau horaire
        endpoint: GET /v1/places/timezone
        title: Enregistrement local et rappels correspondant à l'heure de la propriété
        description: Alignez les horaires avec les fuseaux horaires locaux. Réduisez la confusion pour les voyageurs et les équipes dispersées.
        tag_problem: Gestion du temps
        tag_industry: Voyage
        case_anchor: cas-fuseau horaire
        example: Une location de vacances stocke chaque propriété dans un fuseau horaire IANA. Les e-mails de confirmation et les SMS utilisent la conversion côté serveur, donc « enregistrement à 16 heures » signifie toujours une horloge murale locale.
      - filter_key: géocoder
        endpoint: GET /v1/places/geocode
        title: Transformez les adresses en épingles vers lesquelles l'envoi peut être acheminé
        description: Convertissez instantanément les adresses en coordonnées. Accélérez les cartes, la livraison et la recherche.
        tag_problem: Géocodage
        tag_industry: Logistique
        case_anchor: cas-géo
        example: L'expéditeur reçoit « 123 Main St, Austin ». Le géocodage renvoie la latitude/lng et l'adresse normalisée ; l'application du conducteur se dirige vers l'épingle au lieu du centre-ville ambigu.
      - filter_key: postal
        endpoint: GET /v1/places/postal/{code}
        title: Bloquez les mauvais codes postaux avant l'impression des étiquettes
        description: Validez les codes postaux pour l’expédition mondiale. Détectez les mauvaises adresses avant qu’elles ne quittent l’entrepôt.
        tag_problem: Validation d'adresse
        tag_industry: Commerce électronique
        case_anchor: cas-géo
        example: Le paiement valide le format postal par rapport au pays sélectionné avant l'achat de l'étiquette. Les incohérences PLZ allemandes à 5 chiffres bloquent la commande avec une erreur au niveau du champ au lieu d'une étiquette de retour.
      - filter_key: vacances
        endpoint: GET /v1/places/holidays
        title: Expédier et assister lorsque chaque marché est réellement ouvert
        description: Évitez les jours fériés sur tous les marchés avec des règles de date. Expédiez en toute confiance dans toutes les régions.
        tag_problem: Localisation
        tag_industry: SaaS mondial
        case_anchor: jours fériés
        example: L'automatisation des versions vérifie les jours fériés pour DE, BR et JP. Les déploiements qui atterriraient un jour férié sont repoussés au jour ouvrable suivant avec un résumé Slack pour les PM.
      - filter_key: jours_travail
        endpoint: GET /v1/places/working-days
        title: Des dates SLA qui respectent les week-ends et jours fériés régionaux
        description: Calculez les jours ouvrables dans tous les pays. Les RH et les opérations arrêtent la gymnastique des feuilles de calcul.
        tag_problem: Planification des travaux
        tag_industry: HEURE
        case_anchor: cas-fuseau horaire
        example: SIRH calcule les dates d’échéance des SLA des cas hors week-end et jours fériés spécifiques au pays pour le site de chaque employé. Les commerciaux obtiennent le même numéro dans l’interface utilisateur et dans le journal d’audit exporté.
      - filter_key: heure_monde
        endpoint: GET /v1/places/time/{timezone}
        title: Des horloges de marché qui survivent à l'heure d'été sans correctifs
        description: Affichez des horloges précises pour chaque ville. Établissez la confiance dans les interfaces utilisateur de trading, d’assistance et de planification.
        tag_problem: Heure mondiale
        tag_industry: Technologie financière
        case_anchor: cas-fuseau horaire
        example: Un pied de page du tableau de bord de négociation appelle à l'heure mondiale les codes de lieu de New York, Londres et Tokyo. Les changements d'heure d'été sont automatiquement suivis ; les ingénieurs n’expédient pas de correctifs d’urgence deux fois par an.
