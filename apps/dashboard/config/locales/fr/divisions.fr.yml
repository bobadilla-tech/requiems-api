      hero:
        headline: Améliorez chaque interaction textuelle avec une seule suite d'API.
        subheadline: Vérification orthographique, modération du contenu, analyse linguistique et utilitaires de texte qui améliorent l'expérience utilisateur.
        primary_cta: Obtenir la clé API
