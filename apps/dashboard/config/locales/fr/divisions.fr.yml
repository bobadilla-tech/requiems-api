    networking:
      meta_title: API réseau et Internet | API Requiems
      hero:
        headline: Sécurisez votre réseau avec des informations en temps réel.
        subheadline: Géolocalisation IP, recherches de domaines et détection des menaces pour les équipes d'infrastructure et de sécurité.
        primary_cta: Obtenir la clé API
        secondary_cta: Commencez gratuitement
      strategy_call:
        label: Réservez un appel stratégique
      tagline: 'Ces histoires portent sur ce qui se passe à la périphérie de votre réseau : sessions risquées, géographie floue et travail de domaine fragile. Ils mettent en évidence les API que vous pouvez intégrer plus rapidement que vous ne pouvez doter une équipe complète de signaux.'
      filters:
      - key: tous
        label: Tous les cas
      - key: ip_geo
        label: Géolocalisation IP
      - key: asn
        label: Recherche d'ASN
      - key: VPN
        label: Détection VPN et proxy
      - key: qui est
        label: Recherche WHOIS
      - key: domaine
        label: Informations sur le domaine
      - key: MX
        label: Recherche MX
      - key: jetable
        label: Vérificateur de domaine jetable
      featured_cases: []
      use_cases:
      - filter_key: VPN
        endpoint: GET /v1/networking/ip/vpn/{ip}
        title: Signaler les sessions de connexion à risque derrière les VPN et les proxys
        description: Détectez les VPN et les proxys pour des connexions sécurisées. Arrêtez les attaques scriptées avant qu'elles n'atteignent votre application.
        tag_problem: Détection des menaces
        tag_industry: Cybersécurité
        case_anchor: affaire de fraude
        example: À chaque connexion, l'API évalue l'adresse IP du client pour les signaux VPN, Tor et du centre de données. Les sessions à haut risque bénéficient d’une MFA renforcée ; le trafic résidentiel propre reste sans friction.
      - filter_key: ip_geo
        endpoint: GET /v1/networking/ip/{ip}
        title: Personnalisez par pays sans demander de GPS
        description: Ciblez les utilisateurs par emplacement pour des services personnalisés. Moins d’offres incompatibles et des analyses plus claires.
        tag_problem: Intelligence IP
        tag_industry: Commerce électronique
        case_anchor: cas-géo
        example: Une vitrine résout le pays et la région à partir de l'adresse IP du navigateur pour afficher les estimations d'expédition et la copie fiscale sans demander le GPS. Les tests A/B utilisent le même signal pour la conversion géo-groupée.
      - filter_key: domaine
        endpoint: GET /v1/networking/domain/{domain}
        title: Automatisez les vérifications de domaine dans les flux d'enregistrement
        description: Vérifiez instantanément les domaines pour les plateformes d'enregistrement. Déplacez-vous plus rapidement que les recherches manuelles.
        tag_problem: Recherche de domaine
        tag_industry: SaaS
        case_anchor: domaine de cas
        example: Un workflow de registraire appelle les informations de domaine avant de facturer la carte. Les modèles parqués, suspendus ou fautes de frappe échouent tôt plutôt qu'après l'exécution de la file d'attente d'exécution.
      - filter_key: asn
        endpoint: GET /v1/networking/ip/asn/{ip}
        title: Enrichissez les tickets NOC avec l'ASN et le contexte en amont
        description: Optimisez les performances du réseau avec les données de routage. Déboguez les problèmes de peering et de chemin en toute confiance.
        tag_problem: Analyse de réseau
        tag_industry: Télécom
        case_anchor: affaire de fraude
        example: Lorsque traceroute semble erroné, les opérateurs collent l’ASN de l’adresse IP suspecte dans un outil interne. Le nom de l’organisation et les éléments en amont apparaissent dans le ticket afin que les pairs répondent avec le contexte et non avec des captures d’écran.
      - filter_key: qui est
        endpoint: GET /v1/networking/whois/{domain}
        title: Historique WHOIS exportable pour les audits de marque et juridiques
        description: Automate domain audits for regulatory requirements. Gardez les enregistrements cohérents et consultables.
        tag_problem: Gestion de domaine
        tag_industry: Légal
        case_anchor: domaine de cas
        example: 'La protection de la marque exécute une tâche hebdomadaire sur les domaines AbuseDB : les champs WHOIS sont normalisés et stockés afin que les services juridiques puissent exporter un CSV daté à des fins de preuve de retrait.'
      - filter_key: MX
        endpoint: GET /v1/networking/mx/{domain}
        title: Valider les hôtes de messagerie avant les gros envois
        description: Assurez la délivrabilité des e-mails grâce aux vérifications du serveur. Récupérez le courrier mal configuré avant de l'envoyer.
        tag_problem: Infrastructure de messagerie
        tag_industry: Commercialisation
        case_anchor: domaine de cas
        example: Avant une campagne d'envoi de 50 000, le marketing valide que chaque domaine destinataire dispose d'hôtes MX en direct. Les lignes manquantes dans l'échange de courrier sont mises en quarantaine afin que la réputation de l'ESP ne s'effondre pas.
      scale_metrics:
      - value: 99,99%
        label: Objectif de disponibilité de la plateforme
      - value: ~500ms
        label: Temps de réponse moyen de l'API
      - value: 200+
