      featured_cases: []
      use_cases:
      - filter_key: poubelle
        endpoint: GET /v1/finance/bin/{bin}
        title: Moins de faux refus à la caisse
        description: Enrichissez les métadonnées des cartes pour les risques et le routage. Réduisez les frictions avec les bons clients tout en restant conforme.
        tag_problem: Paiements
        tag_industry: Technologie financière
        case_anchor: casier
        example: L'autorisation envoie les 8 premiers chiffres du PAN (ou l'équivalent du jeton) à la recherche BIN ; Le pays émetteur et le type de produit alimentent votre moteur de règles afin que le débit national cesse de marquer comme le crédit transfrontalier.
      - filter_key: iban
        endpoint: GET /v1/finance/iban/{iban}
        title: Des paiements plus propres avec la validation IBAN
        description: Validez les comptes bancaires avant que l’argent ne soit transféré. Arrêtez les boucles de réparation coûteuses après coup.
        tag_problem: Paiements
        tag_industry: Marchés
        case_anchor: cas-iban
        example: L'intégration du vendeur valide la somme de contrôle et la longueur de l'IBAN pour le pays sélectionné avant de créer un profil de paiement. Les comptes invalides renvoient des erreurs de champ au lieu de fichiers de lots ayant échoué de la banque.
      - filter_key: rapide
        endpoint: GET /v1/finance/swift/{code}
        title: Routage bancaire plus rapide avec les recherches SWIFT
        description: Confirmez les métadonnées de l’institution pour les câbles et la conformité. Réduisez les recherches manuelles pour les équipes financières.
        tag_problem: Données bancaires
        tag_industry: Opérations financières
        case_anchor: cas-rapide
        example: L'analyste colle le BIC dans les outils opérationnels ; la recherche renvoie le nom de l’institution, la ville et les métadonnées de la succursale pour le PDF de confirmation électronique. Les exports CSV incluent les mêmes champs pour les auditeurs.
      - filter_key: crypto
        endpoint: GET /v1/finance/crypto/{symbol}
        title: Tarification en temps réel des actifs numériques
        description: Affichez des prix cryptographiques fiables dans l'application. Gardez les devis alignés sur ce que les utilisateurs attendent.
        tag_problem: Tarifs
        tag_industry: Applications cryptographiques
        case_anchor: cas-fx
        example: Wallet Home interroge les prix spot du BTC et de l’ETH toutes les 30 secondes avec des clés de cache partagées. L'examen des transactions affiche le même identifiant d'instantané que la vignette du portefeuille afin que les utilisateurs ne voient pas deux nombres différents.
      - filter_key: effets
        endpoint: GET /v1/finance/exchange-rate
        title: Des totaux de caisse plus équitables dans le monde entier
        description: Convertissez avec des tarifs transparents. Réduisez les litiges et les paniers abandonnés sur les commandes internationales.
        tag_problem: Multi-devises
        tag_industry: Commerce électronique
        case_anchor: cas-fx
        example: Le sous-total du panier est stocké en EUR du commerçant ; L'actualisation du bouton de paiement extrait le taux moyen du marché en USD plus votre règle d'arrondi. Le reçu par e-mail indique l'horodatage du tarif afin que CS corresponde au montant facturé.
      - filter_key: inflation
        endpoint: GET /v1/finance/inflation
        title: De meilleures données de planification pour les équipes financières
        description: Inflation et données de référence pour les modèles et les informations. Expédiez des informations sans créer de pipelines de données.
        tag_problem: Analytique
        tag_industry: Finance
        case_anchor: cas-fx
        example: 'La feuille FP&A s''exécute lundi cron : extrayez l''IPC annuel pour les États-Unis et l''UE, écrivez les cellules utilisées par les macros de prévision. Les decks citent le même identifiant de série que le wiki interne sans copier-coller à partir de sites d''actualités aléatoires.'
