      strategy_call:
        label: Réservez un appel stratégique
      tagline: Le titre couvre ce que vous pouvez intégrer. Les exemples ci-dessous sont des situations de paiement, de paiement et de change, dans lesquelles les données de validation ou de référence ont modifié le résultat.
      filters:
      - key: tous
        label: Tous les cas
      - key: poubelle
        label: Recherche BIN
      - key: iban
        label: Validateur IBAN
      - key: rapide
        label: Code rapide
