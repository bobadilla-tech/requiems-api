          blurb: "Vérification d'adresse, validation d'identité et géolocalisation pour les services publics."
        energy:
          title: "Énergie"
          blurb: "Géolocalisation des actifs, validation des adresses et données de fuseau horaire pour les services publics et les réseaux intelligents."
