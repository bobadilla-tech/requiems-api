  - name: Batch ASN Lookup
    method: POST
    path: /v1/networking/ip/asn/batch
    description: Look up ASN data for up to 50 IP addresses in a single request. Results are returned in input order. Private and reserved IPs return an empty result with no error.
    parameters:
      - name: ips
        type: array of strings
        required: true
        location: body
        description: List of IP addresses to look up (1–50 items, each must be a valid IPv4 or IPv6 address).
    request_example: |
      {
        "ips": ["8.8.8.8", "1.1.1.1"]
      }
    response_example: |
      {
        "data": {
          "results": [
            {
              "ip": "8.8.8.8",
              "result": { "ip": "8.8.8.8", "asn": "AS15169", "org": "Google LLC", "isp": "Google Public DNS", "domain": "google.com", "route": "8.8.8.0/24", "type": "hosting" }
            },
            {
              "ip": "1.1.1.1",
              "result": { "ip": "1.1.1.1", "asn": "AS13335", "org": "Cloudflare, Inc.", "isp": "Cloudflare", "domain": "cloudflare.com", "route": "1.1.1.0/24", "type": "hosting" }
            }
          ],
          "total": 2
        },
        "metadata": { "timestamp": "2026-01-01T00:00:00Z" }
      }
    response_fields:
      - name: results
        type: array
        description: Per-item results in input order.
      - name: results[].ip
        type: string
        description: The IP address that was looked up.
      - name: results[].result
        type: object
        description: ASN data (omitted on error). Same fields as the single-item endpoint.
      - name: results[].error
        type: string
        description: Error message if the lookup failed (omitted on success).
      - name: total
        type: integer
        description: Total number of items processed.
    errors:
      - code: validation_failed
        status: 422
        description: The ips array is missing, empty, exceeds 50 items, or contains an invalid IP address.
      - code: bad_request
        status: 400
        description: The request body is missing or malformed.
    code_examples:
      curl: |
        curl -X POST https://api.requiems.xyz/v1/networking/ip/asn/batch \
          -H "requiems-api-key: YOUR_API_KEY" \
          -H "Content-Type: application/json" \
          -d '{"ips": ["8.8.8.8", "1.1.1.1"]}'
      python: |
        import requests

        url = "https://api.requiems.xyz/v1/networking/ip/asn/batch"
        headers = {
            "requiems-api-key": "YOUR_API_KEY",
            "Content-Type": "application/json"
        }
        payload = {"ips": ["8.8.8.8", "1.1.1.1"]}

        response = requests.post(url, headers=headers, json=payload)
        for item in response.json()["data"]["results"]:
            if item.get("result"):
                print(item["ip"], item["result"]["asn"], item["result"]["org"])
      javascript: |
        const response = await fetch('https://api.requiems.xyz/v1/networking/ip/asn/batch', {
          method: 'POST',
          headers: {
            'requiems-api-key': 'YOUR_API_KEY',
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ ips: ['8.8.8.8', '1.1.1.1'] })
        });

        const { data } = await response.json();
        data.results.forEach(item => {
          if (item.result) console.log(item.ip, item.result.asn, item.result.org);
        });
      ruby: |
        require 'net/http'
        require 'json'

        uri = URI('https://api.requiems.xyz/v1/networking/ip/asn/batch')
        request = Net::HTTP::Post.new(uri)
        request['requiems-api-key'] = 'YOUR_API_KEY'
        request['Content-Type'] = 'application/json'
        request.body = { ips: ['8.8.8.8', '1.1.1.1'] }.to_json

        response = Net::HTTP.start(uri.hostname, uri.port, use_ssl: true) do |http|
          http.request(request)
        end

        data = JSON.parse(response.body)['data']
        data['results'].each do |item|
          puts "#{item['ip']}: #{item['result']['asn']} #{item['result']['org']}" if item['result']
        end

faq:
  - question: What is an ASN?
    answer: An Autonomous System Number (ASN) is a unique identifier assigned to a group of IP networks and routers that operate under a common administration. It's used by Border Gateway Protocol (BGP) to route traffic between different autonomous systems on the internet.

  - question: What is the difference between org and ISP fields?
    answer: The "org" field represents the organization that owns the IP block, while "isp" identifies the Internet Service Provider providing connectivity. For large companies like Google, these may differ — the organization owns the IP block but multiple ISPs provide connectivity.

  - question: Does this support IPv6?
    answer: Yes, both IPv4 and IPv6 addresses are fully supported.

  - question: What happens with private IP addresses?
    answer: Private IP addresses (like 192.168.x.x, 10.x.x.x, 172.16-31.x.x) do not have ASN information publicly assigned. The API returns the IP with empty ASN fields for private addresses.
