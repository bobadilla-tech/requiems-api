# Timezone API Documentation

api_id: timezone
api_name: Timezone
description: Get timezone information for any location by geographic coordinates or city name. Returns the IANA timezone identifier, UTC offset, current time, and DST status.
base_url: https://api.requiems.xyz

overview:
  use_cases:
    - Display local time for a given location
    - Scheduling and calendar applications
    - Travel and logistics platforms
    - Location-aware notifications

  features:
    - Lookup by latitude/longitude or city name
    - IANA timezone identifiers (e.g. "America/New_York")
    - DST detection for the current date
    - UTC offset in standard +HH:MM format
    - 150+ major cities supported for city-based lookup

endpoints:
  - name: Get Timezone
    method: GET
    path: /v1/places/timezone
    description: Returns timezone information for the given coordinates or city name. Provide either `city` or both `lat` and `lon`.

    parameters:
      - name: lat
        location: query
        type: float
        required: false
        description: "Latitude of the location (-90 to 90). Required when using coordinate-based lookup."
      - name: lon
        location: query
        type: float
        required: false
        description: "Longitude of the location (-180 to 180). Required when using coordinate-based lookup."
      - name: city
        location: query
        type: string
        required: false
        description: "City name for city-based lookup (e.g. 'Tokyo', 'London'). Required when not using coordinates."

    response_example: |
      {
        "timezone": "Europe/London",
        "offset": "+00:00",
        "current_time": "2024-12-15T14:30:00Z",
        "is_dst": false
      }

    response_fields:
      - name: timezone
        type: string
        description: IANA timezone identifier (e.g. "Europe/London", "Asia/Tokyo")
      - name: offset
        type: string
        description: "UTC offset in +HH:MM or -HH:MM format (e.g. '+05:30', '-05:00')"
      - name: current_time
        type: string
        description: Current time in UTC, formatted as RFC 3339 (e.g. "2024-12-15T14:30:00Z")
      - name: is_dst
        type: boolean
        description: Whether the location is currently observing daylight saving time

    code_examples:
      curl: |
        # Lookup by coordinates
        curl "https://api.requiems.xyz/v1/places/timezone?lat=51.5&lon=-0.1" \
          -H "requiems-api-key: YOUR_API_KEY"

        # Lookup by city
        curl "https://api.requiems.xyz/v1/places/timezone?city=Tokyo" \
          -H "requiems-api-key: YOUR_API_KEY"

      python: |
        import requests

        # Lookup by coordinates
        url = "https://api.requiems.xyz/v1/places/timezone"
        headers = {"requiems-api-key": "YOUR_API_KEY"}

        response = requests.get(url, params={"lat": 51.5, "lon": -0.1}, headers=headers)
        print(response.json())

        # Lookup by city
        response = requests.get(url, params={"city": "Tokyo"}, headers=headers)
        print(response.json())

      javascript: |
        // Lookup by coordinates
        const response = await fetch(
          'https://api.requiems.xyz/v1/places/timezone?lat=51.5&lon=-0.1',
          { headers: { 'requiems-api-key': 'YOUR_API_KEY' } }
        );
        const data = await response.json();
        console.log(data.data.timezone);

        // Lookup by city
        const cityResponse = await fetch(
          'https://api.requiems.xyz/v1/places/timezone?city=Tokyo',
          { headers: { 'requiems-api-key': 'YOUR_API_KEY' } }
        );
        const cityData = await cityResponse.json();
        console.log(cityData.data.timezone);

      ruby: |
        require 'net/http'
        require 'json'

        # Lookup by coordinates
        uri = URI('https://api.requiems.xyz/v1/places/timezone')
        uri.query = URI.encode_www_form(lat: 51.5, lon: -0.1)

        request = Net::HTTP::Get.new(uri)
        request['requiems-api-key'] = 'YOUR_API_KEY'

        response = Net::HTTP.start(uri.hostname, uri.port, use_ssl: true) do |http|
          http.request(request)
        end

        data = JSON.parse(response.body)
        puts data['data']['timezone']

  - name: Batch Timezone Lookup
    method: POST
    path: /v1/places/timezone/batch
    description: Look up timezone information for up to 50 locations in a single request. Each item can specify a timezone name, city, or lat/lon coordinates. Priority is timezone name > city > coordinates. Results are returned in input order.
    parameters:
      - name: items
        type: array of objects
        required: true
        location: body
        description: List of timezone lookup requests (1–50 items).
      - name: items[].timezone
        type: string
        required: false
        location: body
        description: "IANA timezone name (e.g. 'America/New_York'). Highest priority."
      - name: items[].city
        type: string
        required: false
        location: body
        description: City name for city-based lookup. Used when timezone is not set.
      - name: items[].lat
        type: number
        required: false
        location: body
        description: Latitude (-90 to 90). Used when neither timezone nor city is set.
      - name: items[].lon
        type: number
        required: false
        location: body
        description: Longitude (-180 to 180). Used alongside lat for coordinate-based lookup.
    request_example: |
      {
        "items": [
          { "timezone": "America/New_York" },
          { "city": "Tokyo" },
          { "lat": 51.5, "lon": -0.1 }
        ]
      }
    response_example: |
      {
        "data": {
          "results": [
            { "info": { "timezone": "America/New_York", "offset": "-05:00", "current_time": "2026-01-01T09:00:00Z", "is_dst": false } },
            { "info": { "timezone": "Asia/Tokyo",       "offset": "+09:00", "current_time": "2026-01-01T23:00:00Z", "is_dst": false } },
            { "info": { "timezone": "Europe/London",    "offset": "+00:00", "current_time": "2026-01-01T14:00:00Z", "is_dst": false } }
          ],
          "total": 3
        },
        "metadata": { "timestamp": "2026-01-01T00:00:00Z" }
      }
    response_fields:
      - name: results
        type: array
        description: Per-item results in input order.
      - name: results[].info.timezone
        type: string
        description: IANA timezone identifier.
      - name: results[].info.offset
        type: string
        description: UTC offset in +HH:MM or -HH:MM format.
      - name: results[].info.current_time
        type: string
        description: Current time in UTC (RFC 3339).
      - name: results[].info.is_dst
        type: boolean
        description: Whether daylight saving time is currently active.
      - name: results[].error
        type: string
        description: Error message if this item failed (omitted on success).
      - name: total
        type: integer
        description: Total number of items processed.
    errors:
      - code: validation_failed
        status: 422
        description: The items array is missing, empty, or exceeds 50 items.
      - code: bad_request
        status: 400
        description: The request body is missing or malformed.
    code_examples:
      curl: |
        curl -X POST https://api.requiems.xyz/v1/places/timezone/batch \
          -H "requiems-api-key: YOUR_API_KEY" \
          -H "Content-Type: application/json" \
          -d '{"items": [{"timezone": "America/New_York"}, {"city": "Tokyo"}, {"lat": 51.5, "lon": -0.1}]}'
      python: |
        import requests

        url = "https://api.requiems.xyz/v1/places/timezone/batch"
        headers = {
            "requiems-api-key": "YOUR_API_KEY",
            "Content-Type": "application/json"
        }
        payload = {
            "items": [
                {"timezone": "America/New_York"},
                {"city": "Tokyo"},
                {"lat": 51.5, "lon": -0.1}
            ]
        }

        response = requests.post(url, headers=headers, json=payload)
        for item in response.json()["data"]["results"]:
            if item.get("info"):
                print(item["info"]["timezone"], item["info"]["offset"])
      javascript: |
        const response = await fetch('https://api.requiems.xyz/v1/places/timezone/batch', {
          method: 'POST',
          headers: {
            'requiems-api-key': 'YOUR_API_KEY',
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            items: [
              { timezone: 'America/New_York' },
              { city: 'Tokyo' },
              { lat: 51.5, lon: -0.1 }
            ]
          })
        });

        const { data } = await response.json();
        data.results.forEach(item => {
          if (item.info) console.log(item.info.timezone, item.info.offset);
        });
      ruby: |
        require 'net/http'
        require 'json'

        uri = URI('https://api.requiems.xyz/v1/places/timezone/batch')
        request = Net::HTTP::Post.new(uri)
        request['requiems-api-key'] = 'YOUR_API_KEY'
        request['Content-Type'] = 'application/json'
        request.body = {
          items: [
            { timezone: 'America/New_York' },
            { city: 'Tokyo' },
            { lat: 51.5, lon: -0.1 }
          ]
        }.to_json

        response = Net::HTTP.start(uri.hostname, uri.port, use_ssl: true) do |http|
          http.request(request)
        end

        data = JSON.parse(response.body)['data']
        data['results'].each do |item|
          puts "#{item['info']['timezone']}: #{item['info']['offset']}" if item['info']
        end

faq:
  - question: Which lookup method should I use — coordinates or city name?
    answer: Use coordinates (lat/lon) for precise lookups anywhere in the world. Use the city name for a quick lookup when you have a well-known city name. Coordinate-based lookup works for any point on Earth, while city-based lookup is limited to the ~150+ cities in our database.

  - question: Is the city parameter case-sensitive?
    answer: No. City names are normalised to lowercase before lookup, so "Tokyo", "TOKYO", and "tokyo" all work.

  - question: What does is_dst mean?
    answer: "is_dst indicates whether the location is currently observing Daylight Saving Time. For locations that do not use DST (e.g. Japan, most of Africa), this is always false."

  - question: What format is the UTC offset returned in?
    answer: "The offset field uses the format +HH:MM or -HH:MM (e.g. '+05:30' for India, '-05:00' for US Eastern Standard Time)."

  - question: What timezone identifiers does the API use?
    answer: All timezone identifiers follow the IANA Time Zone Database standard (also known as the Olson database), e.g. 'America/New_York', 'Europe/London', 'Asia/Tokyo'.
