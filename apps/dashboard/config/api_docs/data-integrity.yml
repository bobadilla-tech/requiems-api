api_id: data-integrity
api_name: Data Integrity System
description: Validate, moderate, and normalize user input at the boundary of your product. Stop bad data before it enters your database or downstream services.
base_url: https://api.requiems.xyz
overview:
  use_cases:
    - Validate and normalize email, phone, and text fields on form submission
    - Filter profanity, toxic content, and off-policy text in user-generated content
    - Clean and standardize records in bulk import or data migration flows
    - Pre-process and validate user input before passing to LLM workflows
    - Enforce text quality standards without building custom validation logic
  features:
    - Profanity and toxicity detection with named category flags
    - Sentiment analysis returning positive, negative, or neutral
    - Automatic language detection with confidence score
    - Text normalization with composable operation pipeline
    - Unicode normalization, HTML stripping, case conversion, and whitespace collapsing
    - Safe for any text content — no data is stored or logged
endpoints:
  - name: Batch Input Validate
    method: POST
    path: /v1/systems/input/validate/batch
    description: Validates and scores a batch of up to 50 contact records in a single request. Each record is processed independently — one item failing does not affect others. Returns per-item email, phone, and text validation results with quality scores, normalized values, plus batch-level aggregates including total, valid_count, invalid_count, and average_quality_score.
    parameters:
      - name: items
        type: array
        required: true
        location: body
        description: "Array of contact records to validate. Each item must include email and phone. Text is optional. Min: 1, Max: 50."
        example: '[{"email":"alice@example.com","phone":"+14155550001"},{"email":"bob@example.com","phone":"+14155550002"}]'
    response_example: |
      {
        "data": {
          "results": [
            {
              "index": 0,
              "email": {
                "valid": true,
                "normalized": "alice@example.com",
                "quality_score": 1,
                "disposable": false
              },
              "phone": {
                "valid": true,
                "normalized": "+1 415-555-0001",
                "quality_score": 1
              },
                "text": null,
                "overall_quality_score": 1,
                "error": null
              },
              {
              "index": 1,
              "email": {
                "valid": true,
                "normalized": "bob@example.com",
                "quality_score": 1,
                "disposable": false
              },
              "phone": {
                "valid": true,
                "normalized": "+1 415-555-0002",
                "quality_score": 1
              },
              "text": null,
              "overall_quality_score": 1,
              "error": null
            }
          ],
          "total": 2,
          "valid_count": 2,
          "invalid_count": 0,
          "average_quality_score": 1
        },
        "metadata": {
          "timestamp": "2026-06-16T21:28:14Z"
        }
      }
    response_fields:
      - name: results
        type: array
        description: List of validation results, one per input item. Preserves the original submission order via the index field.
      - name: results[].index
        type: integer
        description: Zero-based position of the item in the original request array.
      - name: results[].email
        type: object or null
        description: Email validation result. Null when email was not provided for this item.
      - name: results[].email.valid
        type: boolean
        description: True when the email passes syntax and MX validation.
      - name: results[].email.normalized
        type: string or null
        description: Normalized form of the email address. Null when syntax is invalid.
      - name: results[].email.quality_score
        type: number
        description: Email quality score from 0.0 to 1.0. Penalized by invalidity, disposable domain, and suggestions.
      - name: results[].email.disposable
        type: boolean
        description: True when the email domain is a known disposable or temporary provider.
      - name: results[].phone
        type: object or null
        description: Phone validation result. Null when phone was not provided for this item.
      - name: results[].phone.valid
        type: boolean
        description: True when the phone number is valid and dialable.
      - name: results[].phone.normalized
        type: string or null
        description: Normalized phone number in international format. Null when the number is invalid.
      - name: results[].phone.quality_score
        type: number
        description: Phone quality score from 0.0 to 1.0. Penalized by invalidity, VoIP, virtual, landline, and unknown type.
      - name: results[].text
        type: object or null
        description: Text analysis result. Null when text was not provided for this item.
      - name: results[].overall_quality_score
        type: number
        description: >-
          Weighted quality score from 0.0 to 1.0 combining email and phone fields only.
          Weights are email 0.5 and phone 0.4, adjusted proportionally when one field is absent.
          Text does not currently contribute to this score — scoring will be enabled once
          toxicity_score is available from the sentiment service.
          Returns 0.0 when only text is provided.
      - name: results[].error
        type: string or null
        description: >-
          Error message when this item could not be processed due to an unexpected failure,
          such as a service timeout or malformed input. Null when the item was processed
          successfully, regardless of whether the fields passed validation or not.
      - name: total
        type: integer
        description: Total number of items in the batch.
      - name: valid_count
        type: integer
        description: Number of items where all provided fields have valid set to true.
      - name: invalid_count
        type: integer
        description: Number of items where at least one provided field has valid set to false.
      - name: average_quality_score
        type: number
        description: Average of overall_quality_score across all items in the batch.
    errors:
      - code: 422
        message: validation_failed
        description: The request body is invalid.
      - code: 401
        message: unauthorized
        description: Missing or invalid API key.
    code_examples:
      curl: |
        curl -X POST https://api.requiems.xyz/v1/systems/input/validate/batch \
          -H "requiems-api-key: YOUR_API_KEY" \
          -H "Content-Type: application/json" \
          -d '{
            "items": [
              {"email": "alice@example.com", "phone": "+12015551001"},
              {"email": "bob@example.com", "phone": "+12015551002"},
              {"email": "carol@example.com", "phone": "+12015551003"}
            ]
          }'
      python: |
        import requests

        response = requests.post(
          "https://api.requiems.xyz/v1/systems/input/validate/batch",
          headers={"requiems-api-key": "YOUR_API_KEY"},
          json={
            "items": [
              {"email": "alice@example.com", "phone": "+12015551001"},
              {"email": "bob@example.com", "phone": "+12015551002"},
              {"email": "carol@example.com", "phone": "+12015551003"}
            ]
          }
        )

        data = response.json()["data"]

        print(f"Total: {data['total']} | Valid: {data['valid_count']} | Invalid: {data['invalid_count']}")
        print(f"Average quality score: {data['average_quality_score']}")

        for item in data["results"]:
          print(f"\n[{item['index']}]")
          if item.get("error"):
            print(f"  Error: {item['error']}")
            continue
          if item.get("email"):
            print(f"  Email valid: {item['email']['valid']} | Score: {item['email']['quality_score']}")
          if item.get("phone"):
            print(f"  Phone valid: {item['phone']['valid']} | Score: {item['phone']['quality_score']}")
          print(f"  Overall quality score: {item['overall_quality_score']}")
      javascript: |
        const { data } = await fetch('https://api.requiems.xyz/v1/systems/input/validate/batch', {
          method: 'POST',
          headers: { 'requiems-api-key': 'YOUR_API_KEY', 'Content-Type': 'application/json' },
          body: JSON.stringify({
            items: [
              { email: 'alice@example.com', phone: '+12015551001' },
              { email: 'bob@example.com', phone: '+12015551002' },
              { email: 'carol@example.com', phone: '+12015551003' }
            ]
          })
        }).then(r => r.json());

        console.log(`Total: ${data.total} | Valid: ${data.valid_count} | Invalid: ${data.invalid_count}`);
        console.log(`Average quality score: ${data.average_quality_score}`);

        for (const item of data.results) {
          console.log(`\n[${item.index}]`);
          if (item.error) { console.log(`  Error: ${item.error}`); continue; }
          if (item.email) console.log(`  Email valid: ${item.email.valid} | Score: ${item.email.quality_score}`);
          if (item.phone) console.log(`  Phone valid: ${item.phone.valid} | Score: ${item.phone.quality_score}`);
          console.log(`  Overall quality score: ${item.overall_quality_score}`);
        }
      ruby: |
        require 'net/http'
        require 'json'

        uri = URI('https://api.requiems.xyz/v1/systems/input/validate/batch')
        request = Net::HTTP::Post.new(uri)
        request['requiems-api-key'] = 'YOUR_API_KEY'
        request['Content-Type'] = 'application/json'
        request.body = {
          items: [
            { email: 'alice@example.com', phone: '+12015551001' },
            { email: 'bob@example.com', phone: '+12015551002' },
            { email: 'carol@example.com', phone: '+12015551003' }
          ]
        }.to_json

        response = Net::HTTP.start(uri.hostname, uri.port, use_ssl: true) { |h| h.request(request) }
        data = JSON.parse(response.body)['data']

        puts "Total: #{data['total']} | Valid: #{data['valid_count']} | Invalid: #{data['invalid_count']}"
        puts "Average quality score: #{data['average_quality_score']}"

        data['results'].each do |item|
          puts "\n[#{item['index']}]"
          if item['error']
            puts "  Error: #{item['error']}"
            next
          end
          puts "  Email valid: #{item['email']['valid']} | Score: #{item['email']['quality_score']}" if item['email']
          puts "  Phone valid: #{item['phone']['valid']} | Score: #{item['phone']['quality_score']}" if item['phone']
          puts "  Overall quality score: #{item['overall_quality_score']}"
        end

  - name: Input Validate
    method: POST
    path: /v1/systems/input/validate
    description: Validates and scores a single email address, phone number, or text input — or any combination of the three. Returns per-field quality scores, normalized values, risk flags, and an overall quality score for gating or enriching input data.
    parameters:
      - name: email
        type: string
        required: false
        location: body
        description: The email address to validate. At least one of email, phone, or text must be provided.
        example: "user@example.com"
      - name: phone
        type: string
        required: false
        location: body
        description: The phone number to validate. Must include country code in E.164 format. At least one of email, phone, or text must be provided.
        example: "+12015551234"
      - name: text
        type: string
        required: false
        location: body
        description: The text content to analyze for profanity, toxicity, and sentiment. At least one of email, phone, or text must be provided.
        example: "I just wanted to say that your customer service team was incredibly helpful and resolved my issue faster than expected."
    request_example: |
      {
        "email": "user@example.com",
        "phone": "+12015551234",
        "text": "I just wanted to say that your customer service team was incredibly helpful and resolved my issue faster than expected."
      }
    response_example: |
      {
        "data": {
          "email": {
            "valid": true,
            "normalized": "user@example.com",
            "original": "user@example.com",
            "syntax_valid": true,
            "mx_valid": true,
            "disposable": false,
            "suggestion": null,
            "flags": null,
            "quality_score": 1
          },
          "phone": {
            "valid": true,
            "normalized": "+1 201-555-1234",
            "country": "US",
            "type": "landline_or_mobile",
            "carrier": null,
            "risk": {
              "is_voip": false,
              "is_virtual": false
            },
            "flags": null,
            "quality_score": 1
          },
          "text": {
            "is_safe": true,
            "toxicity_score": null,
            "sentiment": "positive",
            "flags": null
          },
          "overall_quality_score": 1
        },
        "metadata": {
          "timestamp": "2026-06-09T23:20:55Z"
        }
      }
    response_fields:
      - name: email
        type: object or null
        description: Email validation result. Null when email was not provided.
      - name: email.valid
        type: boolean
        description: True when the email passes syntax and MX validation.
      - name: email.normalized
        type: string or null
        description: Normalized form of the email address. Null when syntax is invalid.
      - name: email.original
        type: string
        description: The original email address as provided in the request.
      - name: email.syntax_valid
        type: boolean
        description: True when the email address has a valid structure.
      - name: email.mx_valid
        type: boolean
        description: True when the email domain has valid MX records.
      - name: email.disposable
        type: boolean
        description: True when the email domain is a known disposable or temporary provider.
      - name: email.suggestion
        type: string or null
        description: Suggested correction when a typo is detected in the domain (e.g. gmial.com → gmail.com). Null otherwise.
      - name: email.flags
        type: array or null
        description: "Triggered flags. Possible values: email_syntax_invalid, email_mx_invalid, email_disposable, email_has_suggestion."
      - name: email.quality_score
        type: number
        description: Email quality score from 0.0 to 1.0. Penalized by invalidity, disposable domain, and suggestions.
      - name: phone
        type: object or null
        description: Phone validation result. Null when phone was not provided.
      - name: phone.valid
        type: boolean
        description: True when the phone number is valid and dialable.
      - name: phone.normalized
        type: string or null
        description: Normalized phone number in international format. Null when the number is invalid.
      - name: phone.country
        type: string or null
        description: ISO 3166-1 alpha-2 country code detected from the number (e.g. US, CO). Null when the number is invalid.
      - name: phone.type
        type: string or null
        description: "Line type. Null when the number is invalid. Possible values: mobile, landline, voip, toll_free, unknown."
      - name: phone.carrier
        type: object or null
        description: Carrier information. Null when not available.
      - name: phone.carrier.name
        type: string
        description: Name of the carrier or operator associated with the number.
      - name: phone.risk
        type: object or null
        description: Risk signals associated with the phone number. Null when the validator could not determine risk information.
      - name: phone.risk.is_voip
        type: boolean
        description: True when the number is confirmed as a VoIP line. False when explicitly confirmed as non-VoIP.
      - name: phone.risk.is_virtual
        type: boolean
        description: True when the number is confirmed as a virtual number. False when explicitly confirmed as non-virtual.
      - name: phone.flags
        type: array or null
        description: "Triggered flags. Possible values: phone_invalid, phone_voip, phone_virtual, phone_unknown_type, phone_landline."
      - name: phone.quality_score
        type: number
        description: Phone quality score from 0.0 to 1.0. Penalized by invalidity, VoIP, virtual, landline, and unknown type.
      - name: text
        type: object or null
        description: Text analysis result. Null when text was not provided.
      - name: text.is_safe
        type: boolean
        description: False when any moderation flag is triggered. True otherwise.
      - name: text.toxicity_score
        type: number or null
        description: Reserved for future use. Currently always null.
      - name: text.sentiment
        type: string
        description: "Detected sentiment: positive, negative, or neutral."
      - name: text.flags
        type: array or null
        description: "Triggered moderation flags. Possible values: text_profanity."
      - name: overall_quality_score
        type: number
        description: >-
          Weighted quality score from 0.0 to 1.0 combining email and phone fields only.
          Weights are email 0.5 and phone 0.4, adjusted proportionally when one field is absent.
          Text does not currently contribute to this score — scoring will be enabled once
          toxicity_score is available from the sentiment service.
          Returns 0.0 when only text is provided.
    errors:
      - code: 422
        message: validation_failed
        description: All fields (email, phone, text) are absent or empty. At least one must be provided.
      - code: 401
        message: unauthorized
        description: Missing or invalid API key.
    code_examples:
      curl: |
        curl -X POST https://api.requiems.xyz/v1/systems/input/validate \
          -H "requiems-api-key: YOUR_API_KEY" \
          -H "Content-Type: application/json" \
          -d '{"email": "user@example.com", "phone": "+12015551234", "text": "I just wanted to say that your customer service team was incredibly helpful."}'
      python: |
        import requests

        response = requests.post(
          "https://api.requiems.xyz/v1/systems/input/validate",
          headers={"requiems-api-key": "YOUR_API_KEY"},
          json={
            "email": "user@example.com",
            "phone": "+12015551234",
            "text": "I just wanted to say that your customer service team was incredibly helpful."
          }
        )
        data = response.json()["data"]

        if data.get("email"):
          print("Email valid:", data["email"]["valid"], "| Score:", data["email"]["quality_score"])
        if data.get("phone"):
          print("Phone valid:", data["phone"]["valid"], "| Score:", data["phone"]["quality_score"])
        if data.get("text"):
          print("Text safe:", data["text"]["is_safe"], "| Sentiment:", data["text"]["sentiment"])
        print("Overall quality score:", data["overall_quality_score"])
      javascript: |
        const { data } = await fetch('https://api.requiems.xyz/v1/systems/input/validate', {
          method: 'POST',
          headers: { 'requiems-api-key': 'YOUR_API_KEY', 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: 'user@example.com',
            phone: '+12015551234',
            text: 'I just wanted to say that your customer service team was incredibly helpful.'
          })
        }).then(r => r.json());

        if (data.email) console.log('Email valid:', data.email.valid, '| Score:', data.email.quality_score);
        if (data.phone) console.log('Phone valid:', data.phone.valid, '| Score:', data.phone.quality_score);
        if (data.text) console.log('Text safe:', data.text.is_safe, '| Sentiment:', data.text.sentiment);
        console.log('Overall quality score:', data.overall_quality_score);
      ruby: |
        require 'net/http'
        require 'json'

        uri = URI('https://api.requiems.xyz/v1/systems/input/validate')
        request = Net::HTTP::Post.new(uri)
        request['requiems-api-key'] = 'YOUR_API_KEY'
        request['Content-Type'] = 'application/json'
        request.body = {
          email: 'user@example.com',
          phone: '+12015551234',
          text: 'I just wanted to say that your customer service team was incredibly helpful.'
        }.to_json

        response = Net::HTTP.start(uri.hostname, uri.port, use_ssl: true) { |h| h.request(request) }
        data = JSON.parse(response.body)['data']

        puts "Email valid: #{data['email']['valid']} | Score: #{data['email']['quality_score']}" if data['email']
        puts "Phone valid: #{data['phone']['valid']} | Score: #{data['phone']['quality_score']}" if data['phone']
        puts "Text safe: #{data['text']['is_safe']} | Sentiment: #{data['text']['sentiment']}" if data['text']
        puts "Overall quality score: #{data['overall_quality_score']}"
        
  - name: Moderate Content
    method: POST
    path: /v1/systems/content/moderate
    description: Check text for profanity, toxicity, sentiment, and language. Returns per-category flags and an is_safe boolean for gating content.
    parameters:
      - name: text
        type: string
        required: true
        location: body
        description: The text to moderate. Any language. Required.
        example: "This is some user-generated content."
      - name: language
        type: string
        required: false
        location: body
        description: "ISO 639-1 language code (e.g. en, de, fr). When provided, language detection is skipped and confidence is set to 1.0."
        example: en
    request_example: |
      {
        "text": "This is some user-generated content.",
        "language": "en"
      }
    response_example: |
      {
        "data": {
          "is_safe": true,
          "toxicity_score": null,
          "sentiment": "neutral",
          "language": "en",
          "language_confidence": 1.0,
          "flags": [],
          "categories": {
            "profanity": false,
            "hate_speech": false,
            "spam": false,
            "violence": false
          }
        },
        "metadata": {
          "timestamp": "2026-01-01T00:00:00Z"
        }
      }
    response_fields:
      - name: is_safe
        type: boolean
        description: False when any moderation category is triggered. True otherwise.
      - name: toxicity_score
        type: number or null
        description: Reserved for future use. Currently always null.
      - name: sentiment
        type: string
        description: "Detected sentiment: positive, negative, or neutral"
      - name: language
        type: string or null
        description: "Detected or provided ISO 639-1 language code. Null when detection confidence is 0."
      - name: language_confidence
        type: number or null
        description: "Confidence in the detected language from 0.0 to 1.0. 1.0 when language was explicitly provided."
      - name: flags
        type: array
        description: "Triggered moderation flags. Currently possible: text_profanity"
      - name: categories
        type: object
        description: "Per-category boolean flags: profanity, hate_speech, spam, violence"
    errors:
      - code: 422
        message: validation_failed
        description: text field is missing or empty
      - code: 401
        message: unauthorized
        description: Missing or invalid API key
    code_examples:
      curl: |
        curl -X POST https://api.requiems.xyz/v1/systems/content/moderate \
          -H "requiems-api-key: YOUR_API_KEY" \
          -H "Content-Type: application/json" \
          -d '{"text": "This is some user-generated content.", "language": "en"}'
      python: |
        import requests

        response = requests.post(
            "https://api.requiems.xyz/v1/systems/content/moderate",
            headers={"requiems-api-key": "YOUR_API_KEY"},
            json={"text": "This is some user-generated content.", "language": "en"}
        )
        data = response.json()["data"]

        if not data["is_safe"]:
            print("Content blocked. Flags:", data["flags"])
            print("Categories:", {k: v for k, v in data["categories"].items() if v})
        else:
            print(f"Safe. Sentiment: {data['sentiment']}")
      javascript: |
        const { data } = await fetch('https://api.requiems.xyz/v1/systems/content/moderate', {
          method: 'POST',
          headers: { 'requiems-api-key': 'YOUR_API_KEY', 'Content-Type': 'application/json' },
          body: JSON.stringify({ text: 'This is some user-generated content.', language: 'en' })
        }).then(r => r.json());

        if (!data.is_safe) {
          console.warn('Content blocked:', data.flags);
        } else {
          console.log('Sentiment:', data.sentiment);
        }
      ruby: |
        require 'net/http'
        require 'json'

        uri = URI('https://api.requiems.xyz/v1/systems/content/moderate')
        request = Net::HTTP::Post.new(uri)
        request['requiems-api-key'] = 'YOUR_API_KEY'
        request['Content-Type'] = 'application/json'
        request.body = { text: 'This is some user-generated content.', language: 'en' }.to_json

        response = Net::HTTP.start(uri.hostname, uri.port, use_ssl: true) { |h| h.request(request) }
        data = JSON.parse(response.body)['data']
        puts data['is_safe'] ? "Safe. Sentiment: #{data['sentiment']}" : "Blocked: #{data['flags'].inspect}"

  - name: Normalize Text
    method: POST
    path: /v1/systems/text/normalize
    description: Apply a composable pipeline of normalization operations to a string. Trim whitespace, fix encoding, normalize unicode, strip HTML, and more — in a single call.
    parameters:
      - name: text
        type: string
        required: true
        location: body
        description: The text to normalize. Required.
        example: "  Hello,   World!  "
      - name: operations
        type: array
        required: true
        location: body
        description: "Ordered list of normalization operations to apply. At least one required. Valid values: trim, lowercase, uppercase, normalize_unicode, collapse_whitespace, strip_html, remove_punctuation"
        example: '["trim", "lowercase", "collapse_whitespace"]'
    request_example: |
      {
        "text": "  Hello,   World!  ",
        "operations": ["trim", "lowercase", "collapse_whitespace"]
      }
    response_example: |
      {
        "data": {
          "original": "  Hello,   World!  ",
          "normalized": "hello, world!",
          "operations": ["trim", "lowercase", "collapse_whitespace"]
        },
        "metadata": {
          "timestamp": "2026-01-01T00:00:00Z"
        }
      }
    response_fields:
      - name: original
        type: string
        description: The input text as provided
      - name: normalized
        type: string
        description: The text after all operations have been applied in order
      - name: operations
        type: array
        description: The operations list echoed from the request
    errors:
      - code: 422
        message: validation_failed
        description: text is empty or operations array is empty or missing
      - code: 401
        message: unauthorized
        description: Missing or invalid API key
    code_examples:
      curl: |
        curl -X POST https://api.requiems.xyz/v1/systems/text/normalize \
          -H "requiems-api-key: YOUR_API_KEY" \
          -H "Content-Type: application/json" \
          -d '{
            "text": "  Hello,   World!  ",
            "operations": ["trim", "lowercase", "collapse_whitespace"]
          }'
      python: |
        import requests

        response = requests.post(
            "https://api.requiems.xyz/v1/systems/text/normalize",
            headers={"requiems-api-key": "YOUR_API_KEY"},
            json={
                "text": "  Hello,   World!  ",
                "operations": ["trim", "lowercase", "collapse_whitespace"]
            }
        )
        data = response.json()["data"]
        print(data["normalized"])  # hello, world!
      javascript: |
        const { data } = await fetch('https://api.requiems.xyz/v1/systems/text/normalize', {
          method: 'POST',
          headers: { 'requiems-api-key': 'YOUR_API_KEY', 'Content-Type': 'application/json' },
          body: JSON.stringify({
            text: '  Hello,   World!  ',
            operations: ['trim', 'lowercase', 'collapse_whitespace']
          })
        }).then(r => r.json());

        console.log(data.normalized); // hello, world!
      ruby: |
