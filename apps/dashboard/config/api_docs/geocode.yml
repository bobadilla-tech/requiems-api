api_id: geocode
api_name: Geocoding
description: Convert human-readable addresses into geographic coordinates (geocoding) and convert coordinates back into addresses (reverse geocoding). Powered by OpenStreetMap via the Nominatim API.
base_url: https://api.requiems.xyz

overview:
  use_cases:
    - Place pins on a map from a user-supplied address
    - Convert GPS coordinates to a readable address for display
    - Validate and normalise addresses
    - Power location-aware search and filtering features

  features:
    - Forward geocoding (address to lat/lon)
    - Reverse geocoding (lat/lon to address)
    - Worldwide coverage via OpenStreetMap data
    - Results cached for 24 hours for fast repeated lookups

endpoints:
  - name: Geocode Address
    method: GET
    path: /v1/places/geocode
    description: Converts a free-text address into latitude and longitude coordinates.

    parameters:
      - name: address
        location: query
        type: string
        required: true
        description: The address to geocode (street, city, country, or any combination)
        example: 1600 Pennsylvania Ave NW, Washington DC

    response_example: |
      {
        "data": {
          "address": "White House, 1600, Pennsylvania Avenue Northwest, Ward 2, Washington, District of Columbia, 20500, United States",
          "city": "Washington",
          "country": "US",
          "lat": 38.8976763,
          "lon": -77.0365298
        },
        "metadata": {
          "timestamp": "2026-01-01T00:00:00Z"
        }
      }

    response_fields:
      - name: address
        type: string
        description: Full display name of the matched location
      - name: city
        type: string
        description: City or town of the matched location
      - name: country
        type: string
        description: ISO 3166-1 alpha-2 country code (uppercase)
      - name: lat
        type: number
        description: Latitude of the matched location
      - name: lon
        type: number
        description: Longitude of the matched location

    errors:
      - code: not_found
        status: 404
        description: No results found for the given address.
      - code: upstream_error
        status: 503
        description: The geocoding service is temporarily unavailable.
      - code: bad_request
        status: 400
        description: The address parameter is missing.

    code_examples:
      curl: |
        curl "https://api.requiems.xyz/v1/places/geocode?address=1600+Pennsylvania+Ave+NW" \
          -H "requiems-api-key: YOUR_API_KEY"

      python: |
        import requests

        url = "https://api.requiems.xyz/v1/places/geocode"
        headers = {"requiems-api-key": "YOUR_API_KEY"}

        response = requests.get(url, params={"address": "1600 Pennsylvania Ave NW"}, headers=headers)
        data = response.json()
        print(data["data"]["lat"], data["data"]["lon"])

      javascript: |
        const params = new URLSearchParams({ address: '1600 Pennsylvania Ave NW' });
        const response = await fetch(
          `https://api.requiems.xyz/v1/places/geocode?${params}`,
          { headers: { 'requiems-api-key': 'YOUR_API_KEY' } }
        );
        const data = await response.json();
        console.log(data.data.lat, data.data.lon);

      ruby: |
        require 'net/http'
        require 'json'

        uri = URI('https://api.requiems.xyz/v1/places/geocode')
        uri.query = URI.encode_www_form(address: '1600 Pennsylvania Ave NW')

        request = Net::HTTP::Get.new(uri)
        request['requiems-api-key'] = 'YOUR_API_KEY'

        response = Net::HTTP.start(uri.hostname, uri.port, use_ssl: true) do |http|
          http.request(request)
        end

        data = JSON.parse(response.body)
        puts "#{data['data']['lat']}, #{data['data']['lon']}"

  - name: Reverse Geocode
    method: GET
    path: /v1/places/reverse-geocode
    description: Converts geographic coordinates into a human-readable address.

    parameters:
      - name: lat
        location: query
        type: number
        required: true
        description: "Latitude of the location (-90 to 90)"
        example: 38.8977
      - name: lon
        location: query
        type: number
        required: true
        description: "Longitude of the location (-180 to 180)"
        example: -77.0365

    response_example: |
      {
        "data": {
          "lat": 38.8977,
          "lon": -77.0365,
          "address": "White House, 1600, Pennsylvania Avenue Northwest, Ward 2, Washington, District of Columbia, 20500, United States",
          "city": "Washington",
          "country": "US"
        },
        "metadata": {
          "timestamp": "2026-01-01T00:00:00Z"
        }
      }

    response_fields:
      - name: lat
        type: number
        description: Latitude as provided in the request
      - name: lon
        type: number
        description: Longitude as provided in the request
      - name: address
        type: string
        description: Full display name of the location at the given coordinates
      - name: city
        type: string
        description: City or town at the given coordinates
      - name: country
        type: string
        description: ISO 3166-1 alpha-2 country code (uppercase)

    errors:
      - code: not_found
        status: 404
        description: No address found for the given coordinates.
      - code: upstream_error
        status: 503
        description: The geocoding service is temporarily unavailable.
      - code: bad_request
        status: 400
        description: "lat or lon is missing or out of range (lat: -90..90, lon: -180..180)."

    code_examples:
      curl: |
        curl "https://api.requiems.xyz/v1/places/reverse-geocode?lat=38.8977&lon=-77.0365" \
          -H "requiems-api-key: YOUR_API_KEY"

      python: |
        import requests

        url = "https://api.requiems.xyz/v1/places/reverse-geocode"
        headers = {"requiems-api-key": "YOUR_API_KEY"}

        response = requests.get(url, params={"lat": 38.8977, "lon": -77.0365}, headers=headers)
        data = response.json()
        print(data["data"]["address"])

      javascript: |
        const params = new URLSearchParams({ lat: 38.8977, lon: -77.0365 });
        const response = await fetch(
          `https://api.requiems.xyz/v1/places/reverse-geocode?${params}`,
          { headers: { 'requiems-api-key': 'YOUR_API_KEY' } }
        );
        const data = await response.json();
        console.log(data.data.address);

      ruby: |
        require 'net/http'
        require 'json'

        uri = URI('https://api.requiems.xyz/v1/places/reverse-geocode')
        uri.query = URI.encode_www_form(lat: 38.8977, lon: -77.0365)

        request = Net::HTTP::Get.new(uri)
        request['requiems-api-key'] = 'YOUR_API_KEY'

        response = Net::HTTP.start(uri.hostname, uri.port, use_ssl: true) do |http|
          http.request(request)
        end

        data = JSON.parse(response.body)
        puts data['data']['address']

  - name: Batch Geocode Addresses
    method: POST
    path: /v1/places/geocode/batch
    description: Convert up to 20 addresses to coordinates in a single request. Processed concurrently; results are returned in input order. Per-item errors are reported inline. Cache hits avoid outbound network calls.
    parameters:
      - name: addresses
        type: array<string>
        required: true
        location: body
        description: List of addresses to geocode (1–20 items, each non-empty). Max 20 due to Nominatim usage policy.
    request_example: |
      {
        "addresses": [
          "1600 Pennsylvania Ave NW, Washington DC",
          "Eiffel Tower, Paris"
        ]
      }
    response_example: |
      {
        "data": {
          "results": [
            {
              "address": "1600 Pennsylvania Ave NW, Washington DC",
              "result": { "address": "White House, 1600, Pennsylvania Avenue Northwest...", "city": "Washington", "country": "US", "lat": 38.8977, "lon": -77.0365 }
            },
            {
              "address": "Eiffel Tower, Paris",
              "result": { "address": "Tour Eiffel, 5, Avenue Anatole France, Paris...", "city": "Paris", "country": "FR", "lat": 48.8584, "lon": 2.2945 }
            }
          ],
          "total": 2
        },
        "metadata": { "timestamp": "2026-01-01T00:00:00Z" }
      }
    response_fields:
      - name: results
        type: array<object>
        description: Per-item results in input order.
      - name: results[].address
        type: string
        description: The original address as provided in the request.
      - name: results[].result
        type: object
        description: Geocoding result (omitted on error). Same fields as the single-item endpoint.
      - name: results[].error
        type: string
        description: Error message if geocoding failed (omitted on success).
      - name: total
        type: integer
        description: Total number of items processed.
    errors:
      - code: validation_failed
        status: 422
        description: The addresses array is missing, empty, or exceeds 20 items.
      - code: bad_request
        status: 400
        description: The request body is missing or malformed.
    code_examples:
      curl: |
        curl -X POST https://api.requiems.xyz/v1/places/geocode/batch \
          -H "requiems-api-key: YOUR_API_KEY" \
          -H "Content-Type: application/json" \
          -d '{"addresses": ["1600 Pennsylvania Ave NW, Washington DC", "Eiffel Tower, Paris"]}'
      python: |
        import requests

        url = "https://api.requiems.xyz/v1/places/geocode/batch"
        headers = {
            "requiems-api-key": "YOUR_API_KEY",
            "Content-Type": "application/json"
        }
        payload = {"addresses": ["1600 Pennsylvania Ave NW, Washington DC", "Eiffel Tower, Paris"]}

        response = requests.post(url, headers=headers, json=payload)
        for item in response.json()["data"]["results"]:
            if item.get("result"):
                print(item["result"]["lat"], item["result"]["lon"])
      javascript: |
        const response = await fetch('https://api.requiems.xyz/v1/places/geocode/batch', {
          method: 'POST',
          headers: {
            'requiems-api-key': 'YOUR_API_KEY',
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            addresses: ['1600 Pennsylvania Ave NW, Washington DC', 'Eiffel Tower, Paris']
          })
        });

        const { data } = await response.json();
        data.results.forEach(item => {
          if (item.result) console.log(item.result.lat, item.result.lon);
        });
      ruby: |
        require 'net/http'
        require 'json'

        uri = URI('https://api.requiems.xyz/v1/places/geocode/batch')
        request = Net::HTTP::Post.new(uri)
        request['requiems-api-key'] = 'YOUR_API_KEY'
        request['Content-Type'] = 'application/json'
        request.body = {
          addresses: ['1600 Pennsylvania Ave NW, Washington DC', 'Eiffel Tower, Paris']
        }.to_json

        response = Net::HTTP.start(uri.hostname, uri.port, use_ssl: true) do |http|
          http.request(request)
        end

        data = JSON.parse(response.body)['data']
        data['results'].each do |item|
          puts "#{item['result']['lat']}, #{item['result']['lon']}" if item['result']
        end

  - name: Batch Reverse Geocode
    method: POST
    path: /v1/places/reverse-geocode/batch
    description: Convert up to 20 coordinate pairs to addresses in a single request. Processed concurrently; results are returned in input order. Per-item errors are reported inline.
    parameters:
      - name: items
        type: array<object>
        required: true
        location: body
        description: List of coordinate pairs to reverse-geocode (1–20 items). Max 20 due to Nominatim usage policy.
      - name: items[].lat
        type: number
        required: true
        location: body
        description: Latitude (-90 to 90).
      - name: items[].lon
        type: number
        required: true
        location: body
        description: Longitude (-180 to 180).
    request_example: |
      {
        "items": [
          { "lat": 38.8977, "lon": -77.0365 },
          { "lat": 48.8584, "lon": 2.2945 }
        ]
      }
    response_example: |
      {
        "data": {
          "results": [
            {
              "lat": 38.8977, "lon": -77.0365,
              "result": { "lat": 38.8977, "lon": -77.0365, "address": "White House, 1600, Pennsylvania Avenue Northwest...", "city": "Washington", "country": "US" }
            },
            {
              "lat": 48.8584, "lon": 2.2945,
              "result": { "lat": 48.8584, "lon": 2.2945, "address": "Tour Eiffel, 5, Avenue Anatole France, Paris...", "city": "Paris", "country": "FR" }
            }
          ],
          "total": 2
        },
        "metadata": { "timestamp": "2026-01-01T00:00:00Z" }
      }
    response_fields:
      - name: results
        type: array<object>
        description: Per-item results in input order.
      - name: results[].lat
        type: number
        description: Latitude as provided in the request.
      - name: results[].lon
        type: number
        description: Longitude as provided in the request.
      - name: results[].result
        type: object
        description: Reverse geocoding result (omitted on error). Same fields as the single-item endpoint.
      - name: results[].error
        type: string
        description: Error message if reverse geocoding failed (omitted on success).
      - name: total
        type: integer
        description: Total number of items processed.
    errors:
      - code: validation_failed
        status: 422
        description: The items array is missing, empty, or exceeds 20 items.
      - code: bad_request
        status: 400
        description: The request body is missing or malformed.
    code_examples:
      curl: |
        curl -X POST https://api.requiems.xyz/v1/places/reverse-geocode/batch \
          -H "requiems-api-key: YOUR_API_KEY" \
          -H "Content-Type: application/json" \
          -d '{"items": [{"lat": 38.8977, "lon": -77.0365}, {"lat": 48.8584, "lon": 2.2945}]}'
      python: |
        import requests

        url = "https://api.requiems.xyz/v1/places/reverse-geocode/batch"
        headers = {
            "requiems-api-key": "YOUR_API_KEY",
            "Content-Type": "application/json"
        }
        payload = {
            "items": [
                {"lat": 38.8977, "lon": -77.0365},
                {"lat": 48.8584, "lon": 2.2945}
            ]
        }

        response = requests.post(url, headers=headers, json=payload)
        for item in response.json()["data"]["results"]:
            if item.get("result"):
                print(item["result"]["address"])
      javascript: |
        const response = await fetch('https://api.requiems.xyz/v1/places/reverse-geocode/batch', {
          method: 'POST',
          headers: {
            'requiems-api-key': 'YOUR_API_KEY',
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            items: [
              { lat: 38.8977, lon: -77.0365 },
              { lat: 48.8584, lon: 2.2945 }
            ]
          })
        });

        const { data } = await response.json();
        data.results.forEach(item => {
          if (item.result) console.log(item.result.address);
        });
      ruby: |
        require 'net/http'
        require 'json'

        uri = URI('https://api.requiems.xyz/v1/places/reverse-geocode/batch')
        request = Net::HTTP::Post.new(uri)
        request['requiems-api-key'] = 'YOUR_API_KEY'
        request['Content-Type'] = 'application/json'
        request.body = {
          items: [
            { lat: 38.8977, lon: -77.0365 },
            { lat: 48.8584, lon: 2.2945 }
          ]
        }.to_json

        response = Net::HTTP.start(uri.hostname, uri.port, use_ssl: true) do |http|
          http.request(request)
        end

        data = JSON.parse(response.body)['data']
        data['results'].each do |item|
          puts item['result']['address'] if item['result']
        end

faq:
  - question: What geocoding data source does this API use?
    answer: The API uses Nominatim, the official geocoder for OpenStreetMap. It provides worldwide coverage and is kept up to date with OSM community edits.

  - question: Are results cached?
    answer: Yes. Results are cached for 24 hours. Repeated calls with the same address or coordinates return instantly without hitting the upstream service.

  - question: How precise is reverse geocoding?
    answer: Precision depends on the density of OpenStreetMap data at the given coordinates. In well-mapped areas (most cities worldwide) you will get street-level accuracy. Remote areas may return only a region or country.

  - question: Can I geocode non-English addresses?
    answer: Yes. Nominatim supports addresses in most languages and scripts. Pass the address in its native language for best results.
