api_id: horoscope
api_name: Horoscope
description: Get daily horoscope readings for all 12 zodiac signs. Each reading is deterministically generated per sign per day.
base_url: https://api.requiems.xyz
overview:
  use_cases:
    - Daily horoscope widgets
    - Astrology apps
    - Entertainment platforms
    - Personalized daily content
  features:
    - All 12 zodiac signs supported
    - Consistent daily readings (same sign returns same reading throughout the day)
    - Lucky number and mood included
    - Case-insensitive sign parameter
endpoints:
  - name: Get Daily Horoscope
    method: GET
    path: /v1/entertainment/horoscope/{sign}
    description: Returns a daily horoscope reading for the specified zodiac sign.
    parameters:
      - name: sign
        location: path
        type: string
        required: true
        description: >-
          Zodiac sign (case-insensitive). Supported values: aries, taurus, gemini, cancer, leo, virgo, libra, scorpio,
          sagittarius, capricorn, aquarius, pisces
    response_example: |
      {
        "data": {
          "sign": "aries",
          "date": "2024-12-15",
          "horoscope": "Today is a great day for new beginnings. Trust your instincts and take that first step toward your goals.",
          "lucky_number": 7,
          "mood": "energetic"
        },
        "metadata": {
          "timestamp": "2026-01-01T00:00:00Z"
        }
      }
    response_fields:
      - name: sign
        type: string
        description: Normalized zodiac sign (lowercase)
      - name: date
        type: string
        description: Today's date in YYYY-MM-DD format (UTC)
      - name: horoscope
        type: string
        description: Daily horoscope reading
      - name: lucky_number
        type: integer
        description: Lucky number for the day (1-99)
      - name: mood
        type: string
        description: Suggested mood for the day
    code_examples:
      curl: |
        curl https://api.requiems.xyz/v1/entertainment/horoscope/aries \
          -H "requiems-api-key: YOUR_API_KEY"
      python: |
        import requests

        url = "https://api.requiems.xyz/v1/entertainment/horoscope/aries"
        headers = {"requiems-api-key": "YOUR_API_KEY"}

        response = requests.get(url, headers=headers)
        print(response.json())
      javascript: |
        const response = await fetch(
          'https://api.requiems.xyz/v1/entertainment/horoscope/aries',
          { headers: { 'requiems-api-key': 'YOUR_API_KEY' } }
        );
        const data = await response.json();
        console.log(data.data.horoscope);
      ruby: |
        require 'net/http'
        require 'json'

        uri = URI('https://api.requiems.xyz/v1/entertainment/horoscope/aries')
        request = Net::HTTP::Get.new(uri)
        request['requiems-api-key'] = 'YOUR_API_KEY'

        response = Net::HTTP.start(uri.hostname, uri.port, use_ssl: true) do |http|
          http.request(request)
        end

        data = JSON.parse(response.body)
        puts data['data']['horoscope']
  - name: Batch Daily Horoscopes
    method: POST
    path: /v1/entertainment/horoscope/batch
    description: Returns up to 12 daily horoscopes in a single request.
    parameters:
      - name: signs
        type: array
        required: true
        location: body
        description: "Array of signs to get (min: 1, max: 12). Allowed values: aries, taurus, gemini, cancer, leo, virgo, libra, scorpio, sagittarius, capricorn, aquarius, pisces."
        example: |
          ["taurus","cancer","libra"]
    request_example: |
      {
        "signs": ["taurus","cancer","libra"]
      }
    response_example: |
      {
        "data": {
          "results": [
            {
              "sign": "taurus",
              "date": "2026-05-21",
              "horoscope": "Your patience will be rewarded. Take time to reflect before making important decisions today.",
              "lucky_number": 26,
              "mood": "reflective"
            },
            {
              "sign": "cancer",
              "date": "2026-05-21",
              "horoscope": "Your patience will be rewarded. Take time to reflect before making important decisions today.",
              "lucky_number": 2,
              "mood": "reflective"
            },
            {
              "sign": "libra",
              "date": "2026-05-21",
              "horoscope": "Rest and self-care are essential today. Taking care of yourself enables you to take care of others.",
              "lucky_number": 82,
              "mood": "peaceful"
            }
          ],
          "total": 3
        },
        "metadata": {
          "timestamp": "2026-05-21T04:09:20Z"
        }
      }
    response_fields:
      - name: results
        type: array
        description: List of daily horoscopes returned in the same order as the input signs.
      - name: results[].sign
        type: string
        description: Zodiac sign the horoscope corresponds to.
      - name: results[].date
        type: string
        description: Date the horoscope is for, in YYYY-MM-DD format.
      - name: results[].horoscope
        type: string
        description: Daily horoscope reading for the given sign.
      - name: results[].lucky_number
        type: integer
        description: Lucky number for the given sign on that date.
      - name: results[].mood
        type: string
        description: Predicted mood for the given sign on that date.
      - name: total
        type: integer
        description: Total number of horoscopes returned.
    errors:
      - code: validation_failed
        status: 422
        description: The signs array is missing, empty, or contains more than 12 items, or includes unsupported sign values.
      - code: bad_request
        status: 400
        description: Invalid JSON, malformed request body, or unexpected field types.
    code_examples:
      curl: |
        curl -X POST "https://api.requiems.xyz/v1/entertainment/horoscope/batch" \
          -H "requiems-api-key: YOUR_API_KEY" \
          -H "Content-Type: application/json" \
          -d '{
            "signs": [
              "taurus",
              "cancer",
              "libra"
            ]
          }'
      python: |
        import requests

        url = "https://api.requiems.xyz/v1/entertainment/horoscope/batch"

        headers = {
          "requiems-api-key": "YOUR_API_KEY",
          "Content-Type": "application/json"
        }

        payload = {
          "signs": [
            "taurus",
            "cancer",
            "libra"
          ]
        }

        response = requests.post(url, headers=headers, json=payload)

        for item in response.json()["data"]["results"]:
          print(item["sign"], "-", item["date"])
          print("Horoscope:", item["horoscope"])
          print("Mood:", item["mood"])
          print("Lucky number:", item["lucky_number"])

      javascript: |
        const response = await fetch(
          'https://api.requiems.xyz/v1/entertainment/horoscope/batch',
          {
            method: 'POST',
            headers: {
              'requiems-api-key': 'YOUR_API_KEY',
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              signs: [
                'taurus',
                'cancer',
                'libra'
              ]
            })
          }
        );

        const { data } = await response.json();

        data.results.forEach(item => {
          console.log(item.sign, '-', item.date);
          console.log('Horoscope:', item.horoscope);
          console.log('Mood:', item.mood);
          console.log('Lucky number:', item.lucky_number);
        });

      ruby: |
        require 'net/http'
        require 'json'

        uri = URI('https://api.requiems.xyz/v1/entertainment/horoscope/batch')

        request = Net::HTTP::Post.new(uri)

        request['requiems-api-key'] = 'YOUR_API_KEY'
        request['Content-Type'] = 'application/json'

        request.body = {
          signs: [
            'taurus',
            'cancer',
            'libra'
          ]
        }.to_json

        response = Net::HTTP.start(uri.hostname, uri.port, use_ssl: true) do |http|
          http.request(request)
        end

        JSON.parse(response.body)['data']['results'].each do |item|
          puts "#{item['sign']} - #{item['date']}"
          puts "Horoscope: #{item['horoscope']}"
          puts "Mood: #{item['mood']}"
          puts "Lucky number: #{item['lucky_number']}"
        end
faq:
  - question: Are horoscope readings the same for all users on the same day?
    answer: >-
      Yes. Readings are deterministic per sign per day, so every user requesting the same sign on the same day receives
      the same horoscope.
  - question: Is the sign parameter case-sensitive?
    answer: No. You can pass the sign in any case (e.g., "Aries", "ARIES", or "aries") and the API will normalize it.
  - question: Which zodiac signs are supported?
    answer: >-
      All 12 signs are supported — aries, taurus, gemini, cancer, leo, virgo, libra, scorpio, sagittarius, capricorn,
      aquarius, and pisces.
performance:
  p50_ms: 890
  p95_ms: 1095
  p99_ms: 1210
  avg_ms: 931
  samples: 50
  measured_at: "2026-04-20"
