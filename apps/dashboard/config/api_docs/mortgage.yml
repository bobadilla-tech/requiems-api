        status: 422
        description: The mortgages array is missing, empty, or contains more than 50 items.
    code_examples:
      curl: |
        curl -X POST "https://api.requiems.xyz/v1/finance/mortgage/batch" \
          -H "requiems-api-key: YOUR_API_KEY" \
          -H "Content-Type: application/json" \
          -d '{"mortgages":[{"principal": 150000,"rate": 6.5,"years": 10},{"principal": 250000,"rate": 5.2,"years": 30}]}'
      python: |
        import requests

        url = "https://api.requiems.xyz/v1/finance/mortgage/batch"
        headers = {
            "requiems-api-key": "YOUR_API_KEY",
            "Content-Type": "application/json"
        }
        payload = {"mortgages":[{"principal": 150000,"rate": 6.5,"years": 10},{"principal": 250000,"rate": 5.2,"years": 30}]}

        response = requests.post(url, headers=headers, json=payload)
        print(response.json())
      javascript: |
        const response = await fetch(
          'https://api.requiems.xyz/v1/finance/mortgage/batch',
          {
            method: 'POST',
            headers: {
              'requiems-api-key': 'YOUR_API_KEY',
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({ mortgages: [{"principal": 150000,"rate": 6.5,"years": 10},{"principal": 250000,"rate": 5.2,"years": 30}] })
          }
        );

        const { data } = await response.json();
        console.log(data);
      ruby: |
        require 'net/http'
        require 'json'

        uri = URI('https://api.requiems.xyz/v1/finance/mortgage/batch')
        request = Net::HTTP::Post.new(uri)
        request['requiems-api-key'] = 'YOUR_API_KEY'
        request['Content-Type'] = 'application/json'
        request.body = { mortgages: [{"principal": 150000,"rate": 6.5,"years": 10},{"principal": 250000,"rate": 5.2,"years": 30}] }.to_json

        response = Net::HTTP.start(uri.hostname, uri.port, use_ssl: true) do |http|
          http.request(request)
        end

        puts JSON.pretty_generate(JSON.parse(response.body))
faq:
  - question: What formula is used?
    answer: >-
      Standard fixed-rate amortization: M = P × (r(1+r)^n) / ((1+r)^n − 1), where P is the principal, r is the monthly
      rate (annual rate / 12 / 100), and n is the total number of payments (years × 12).
  - question: Are the monetary values rounded?
    answer: >-
      Yes — all monetary values in the response (monthly_payment, total_payment, total_interest, and each schedule
      entry) are rounded to 2 decimal places.
  - question: Why does the final balance show a small rounding difference?
    answer: >-
      Due to floating-point rounding on each monthly payment, the final balance may show $0.00–$0.99 rather than exactly
      $0. This is expected behaviour for fixed-payment amortization schedules.
  - question: What currency does the API use?
    answer: >-
      The API is currency-agnostic. Pass your principal in any unit and interpret the results in that same unit. There
      is no currency conversion.
  - question: Does the API support variable or adjustable-rate mortgages?
    answer: Not currently. Only fixed-rate mortgages are supported. The rate is applied uniformly over the entire loan term.
