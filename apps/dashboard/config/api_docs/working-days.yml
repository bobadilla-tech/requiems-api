# Working Days Calculator API Documentation

api_id: working-days
api_name: Working Days Calculator
description: Calculate the number of working days (business days) between two dates, with optional support for country-specific holidays. Useful for project planning, delivery estimates, and scheduling.
base_url: https://api.requiems.xyz

overview:
  use_cases:
    - Project deadline calculations
    - Delivery time estimates
    - Payroll and billing calculations
    - Service level agreement (SLA) tracking
    - Vacation and leave planning

  features:
    - Calculate business days (Monday-Friday)
    - Optional country-specific holiday adjustments
    - Support for state/region-level holidays
    - ISO date format (YYYY-MM-DD)

endpoints:
  - name: Calculate Working Days
    method: GET
    path: /v1/places/working-days
    description: Calculate the number of working days between two dates, optionally accounting for country-specific holidays

    parameters:
      - name: from
        type: string
        required: true
        location: query
        description: Start date in YYYY-MM-DD format (ISO 8601)
        example: "2024-02-23"

      - name: to
        type: string
        required: true
        location: query
        description: End date in YYYY-MM-DD format (ISO 8601). Must be >= from date.
        example: "2024-02-28"

      - name: country
        type: string
        required: false
        location: query
        description: ISO 3166-1 alpha-2 country code (e.g., "US", "GB", "FR"). When provided, country-specific holidays are excluded from working days count.
        example: "US"

      - name: subdivision
        type: string
        required: false
        location: query
        description: ISO 3166-2 subdivision code for state/region within the country (e.g., "NY" for New York, "CA" for California). Only used when country is provided.
        example: "NY"

    response_example: |
      {
        "data": {
          "working_days": 4,
          "from": "2024-02-23",
          "to": "2024-02-28",
          "country": "US",
          "subdivision": "NY"
        },
        "metadata": {
          "timestamp": "2026-01-01T00:00:00Z"
        }
      }

    response_fields:
      - name: working_days
        type: integer
        description: Number of working days between the two dates (excluding weekends and optionally holidays)
      - name: from
        type: string
        description: Start date (echoed from request)
      - name: to
        type: string
        description: End date (echoed from request)
      - name: country
        type: string
        description: Country code (echoed from request, empty string if not provided)
      - name: subdivision
        type: string
        description: Subdivision code (echoed from request, empty string if not provided)

    errors:
      - code: 400
        message: bad_request
        description: The from and to parameters are required, or to date is before from date, or invalid date format

    code_examples:
      curl: |
        # Without country (only excludes weekends)
        curl "https://api.requiems.xyz/v1/places/working-days?from=2024-02-23&to=2024-02-28" \
          -H "requiems-api-key: YOUR_API_KEY"

        # With country (excludes weekends and US federal holidays)
        curl "https://api.requiems.xyz/v1/places/working-days?from=2024-02-23&to=2024-02-28&country=US" \
          -H "requiems-api-key: YOUR_API_KEY"

        # With country and subdivision (excludes weekends and US + NY holidays)
        curl "https://api.requiems.xyz/v1/places/working-days?from=2024-02-23&to=2024-02-28&country=US&subdivision=NY" \
          -H "requiems-api-key: YOUR_API_KEY"

      python: |
        import requests

        url = "https://api.requiems.xyz/v1/places/working-days"
        headers = {"requiems-api-key": "YOUR_API_KEY"}
        params = {
            "from": "2024-02-23",
            "to": "2024-02-28",
            "country": "US",
            "subdivision": "NY"
        }

        response = requests.get(url, headers=headers, params=params)
        result = response.json()['data']
        print(f"{result['working_days']} working days")

      javascript: |
        const params = new URLSearchParams({
          from: '2024-02-23',
          to: '2024-02-28',
          country: 'US',
          subdivision: 'NY'
        });

        const response = await fetch(
          `https://api.requiems.xyz/v1/places/working-days?${params}`,
          {
            headers: {
              'requiems-api-key': 'YOUR_API_KEY'
            }
          }
        );

        const { data } = await response.json();
        console.log(`${data.working_days} working days`);

      ruby: |
        require 'net/http'
        require 'json'

        uri = URI('https://api.requiems.xyz/v1/places/working-days')
        uri.query = URI.encode_www_form(
          from: '2024-02-23',
          to: '2024-02-28',
          country: 'US',
          subdivision: 'NY'
        )

        request = Net::HTTP::Get.new(uri)
        request['requiems-api-key'] = 'YOUR_API_KEY'

        response = Net::HTTP.start(uri.hostname, uri.port, use_ssl: true) do |http|
          http.request(request)
        end

        data = JSON.parse(response.body)['data']
        puts "#{data['working_days']} working days"
  - name: Calculate Working Days Batch
    method: POST
    path: /v1/places/working-days/batch
    description: Calculate working days for multiple date ranges in a single request. Results preserve input order.

    request_body:
      - name: items
        type: array
        required: true
        description: List of date range objects to calculate. Minimum 1, maximum 50.

      - name: items[].from
        type: string
        required: true
        description: Start date in YYYY-MM-DD format (ISO 8601)
        example: "2024-02-23"

      - name: items[].to
        type: string
        required: true
        description: End date in YYYY-MM-DD format (ISO 8601). Must be >= from date.
        example: "2024-02-28"

      - name: items[].country
        type: string
        required: false
        description: ISO 3166-1 alpha-2 country code. When provided, country-specific holidays are excluded.
        example: "US"

      - name: items[].subdivision
        type: string
        required: false
        description: ISO 3166-2 subdivision code. Only used when country is provided.
        example: "NY"

    request_example: |
      {
        "items": [
          {
            "from": "2024-02-23",
            "to": "2024-02-28"
          },
          {
            "from": "2024-02-23",
            "to": "2024-02-28",
            "country": "US",
            "subdivision": "NY"
          }
        ]
      }

    response_example: |
      {
        "data": {
          "results": [
            {
              "working_days": 4,
              "from": "2024-02-23",
              "to": "2024-02-28"
            },
            {
              "working_days": 4,
              "from": "2024-02-23",
              "to": "2024-02-28",
              "country": "US",
              "subdivision": "NY"
            }
          ]
        },
        "metadata": {
          "timestamp": "2026-01-01T00:00:00Z"
        }
      }

    response_fields:
      - name: results
        type: array
        description: List of working days results, preserving input order
      - name: results[].working_days
        type: integer
        description: Number of working days between the two dates
      - name: results[].from
        type: string
        description: Start date (echoed from request)
      - name: results[].to
        type: string
        description: End date (echoed from request)
      - name: results[].country
        type: string
        description: Country code (echoed from request, omitted if not provided)
      - name: results[].subdivision
        type: string
        description: Subdivision code (echoed from request, omitted if not provided)

    errors:
      - code: 400
        message: invalid_request
        description: Invalid or malformed JSON body, items array is empty or missing, or items exceeds 50
      - code: 422
        message: unprocessable_entity
        description: items is missing or empty, or exceeds 50 entries  

    code_examples:
      curl: |
        curl -X POST "https://api.requiems.xyz/v1/places/working-days/batch" \
          -H "requiems-api-key: YOUR_API_KEY" \
          -H "Content-Type: application/json" \
          -d '{
            "items": [
              { "from": "2024-02-23", "to": "2024-02-28" },
              { "from": "2024-02-23", "to": "2024-02-28", "country": "US", "subdivision": "NY" }
            ]
          }'

      python: |
        import requests

        url = "https://api.requiems.xyz/v1/places/working-days/batch"
        headers = {"requiems-api-key": "YOUR_API_KEY"}
        payload = {
            "items": [
                {"from": "2024-02-23", "to": "2024-02-28"},
                {"from": "2024-02-23", "to": "2024-02-28", "country": "US", "subdivision": "NY"},
            ]
        }

        response = requests.post(url, json=payload, headers=headers)
        results = response.json()['data']['results']
        for r in results:
            print(f"{r['working_days']} working days between {r['from']} and {r['to']}")

      javascript: |
        const response = await fetch(
          "https://api.requiems.xyz/v1/places/working-days/batch",
          {
            method: "POST",
            headers: {
              "requiems-api-key": "YOUR_API_KEY",
              "Content-Type": "application/json",
            },
            body: JSON.stringify({
              items: [
                { from: "2024-02-23", to: "2024-02-28" },
                { from: "2024-02-23", to: "2024-02-28", country: "US", subdivision: "NY" },
              ],
            }),
          },
        );

        const { data } = await response.json();
        data.results.forEach(r => {
          console.log(`${r.working_days} working days between ${r.from} and ${r.to}`);
        });

      ruby: |
        require 'net/http'
        require 'json'

        uri = URI('https://api.requiems.xyz/v1/places/working-days/batch')
        request = Net::HTTP::Post.new(uri)
        request['requiems-api-key'] = 'YOUR_API_KEY'
        request['Content-Type'] = 'application/json'
        request.body = JSON.generate({
          items: [
            { from: '2024-02-23', to: '2024-02-28' },
            { from: '2024-02-23', to: '2024-02-28', country: 'US', subdivision: 'NY' }
          ]
        })

        response = Net::HTTP.start(uri.hostname, uri.port, use_ssl: true) do |http|
          http.request(request)
        end

        results = JSON.parse(response.body)['data']['results']
        results.each { |r| puts "#{r['working_days']} working days between #{r['from']} and #{r['to']}" }

faq:
  - question: What defines a working day?
    answer: By default, working days are Monday through Friday, excluding weekends (Saturday and Sunday). When a country is specified, public holidays for that country are also excluded.

  - question: Which countries are supported for holiday calculations?
    answer: The API supports holiday calendars for most countries worldwide using ISO 3166-1 alpha-2 country codes. If a country is not recognized, the API returns only weekend-excluding calculations.

  - question: How are holidays determined?
    answer: The API uses the business-days-calculator library which includes comprehensive holiday calendars for each country, including federal/national holidays and optional state/regional holidays when a subdivision is specified.

  - question: What if the to date is before the from date?
    answer: The API will return a 400 Bad Request error. The to date must be greater than or equal to the from date.

  - question: Are partial days counted?
    answer: No. The calculation counts full calendar days between the from and to dates (inclusive), then excludes weekends and holidays as appropriate.
