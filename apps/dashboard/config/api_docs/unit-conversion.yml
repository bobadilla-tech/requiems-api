api_id: unit-conversion
api_name: Unit Conversion
description: >-
  Convert between units of measurement and discover available conversion types. Supports length, weight, volume,
  temperature, area, and speed conversions.
base_url: https://api.requiems.xyz
overview:
  use_cases:
    - Scientific and engineering calculations
    - Travel and distance planning
    - Recipe scaling and cooking conversions
    - Fitness and health tracking
    - Educational tools
    - Build unit selection dropdowns in UIs
  features:
    - Length, weight, volume, temperature, area, and speed conversions
    - 39 supported units across 6 categories
    - Human-readable formula in every response
    - Results rounded to 6 decimal places
    - Fast, no-database lookups
    - Endpoint to discover all available units
endpoints:
  - name: Convert Units
    method: GET
    path: /v1/technology/convert
    description: Convert a value from one unit to another
    parameters:
      - name: from
        type: string
        required: true
        location: query
        description: Source unit key (e.g. miles, kg, c)
        example: miles
      - name: to
        type: string
        required: true
        location: query
        description: Target unit key (e.g. km, lb, f)
        example: km
      - name: value
        type: number
        required: true
        location: query
        description: Numeric value to convert
        example: 10
    response_example: |
      {
        "data": {
          "from": "miles",
          "to": "km",
          "input": 10,
          "result": 16.09344,
          "formula": "miles × 1.609344"
        },
        "metadata": {
          "timestamp": "2026-01-01T00:00:00Z"
        }
      }
    response_fields:
      - name: from
        type: string
        description: Source unit key
      - name: to
        type: string
        description: Target unit key
      - name: input
        type: number
        description: The original input value
      - name: result
        type: number
        description: The converted value (rounded to 6 decimal places)
      - name: formula
        type: string
        description: Human-readable conversion formula
    code_examples:
      curl: |
        curl "https://api.requiems.xyz/v1/technology/convert?from=miles&to=km&value=10" \
          -H "requiems-api-key: YOUR_API_KEY"
      python: |
        import requests

        url = "https://api.requiems.xyz/v1/technology/convert"
        params = {"from": "miles", "to": "km", "value": 10}
        headers = {"requiems-api-key": "YOUR_API_KEY"}

        response = requests.get(url, params=params, headers=headers)
        print(response.json())
      javascript: |
        const params = new URLSearchParams({ from: 'miles', to: 'km', value: 10 });
        const response = await fetch(`https://api.requiems.xyz/v1/technology/convert?${params}`, {
          headers: {
            'requiems-api-key': 'YOUR_API_KEY'
          }
        });

        const { data } = await response.json();
        console.log(data.result); // 16.09344
      ruby: |
        require 'net/http'
        require 'json'

        uri = URI('https://api.requiems.xyz/v1/technology/convert')
        uri.query = URI.encode_www_form(from: 'miles', to: 'km', value: 10)
        request = Net::HTTP::Get.new(uri)
        request['requiems-api-key'] = 'YOUR_API_KEY'

        response = Net::HTTP.start(uri.hostname, uri.port, use_ssl: true) do |http|
          http.request(request)
        end

        data = JSON.parse(response.body)['data']
        puts data['result'] # 16.09344
  - name: List Available Units
    method: GET
    path: /v1/technology/convert/units
    description: Returns all available unit conversion types grouped by measurement category
    parameters: []
    response_example: |
      {
        "data": {
          "length": ["cm", "ft", "in", "km", "m", "miles", "mm", "nmi", "yd"],
          "weight": ["g", "kg", "lb", "mg", "oz", "stone", "t"],
          "volume": ["cup", "fl_oz", "gal", "l", "ml", "pt", "qt", "tbsp", "tsp"],
          "temperature": ["c", "f", "k"],
          "area": ["acre", "cm2", "ft2", "ha", "in2", "km2", "m2", "mm2", "yd2"],
          "speed": ["km_h", "knots", "m_s", "mph"]
        },
        "metadata": {
          "timestamp": "2026-01-01T00:00:00Z"
        }
      }
    response_fields:
      - name: length
        type: array
        description: >-
          Available length units: millimeter (mm), centimeter (cm), meter (m), kilometer (km), inch (in), foot (ft),
          yard (yd), mile (miles), nautical mile (nmi)
      - name: weight
        type: array
        description: >-
          Available weight units: milligram (mg), gram (g), kilogram (kg), metric ton (t), ounce (oz), pound (lb), stone
          (stone)
      - name: volume
        type: array
        description: >-
          Available volume units: milliliter (ml), liter (l), teaspoon (tsp), tablespoon (tbsp), fluid ounce (fl_oz),
          cup (cup), pint (pt), quart (qt), gallon (gal)
      - name: temperature
        type: array
        description: "Available temperature units: celsius (c), fahrenheit (f), kelvin (k)"
      - name: area
        type: array
        description: >-
          Available area units: square millimeter (mm2), square centimeter (cm2), square meter (m2), square kilometer
          (km2), square inch (in2), square foot (ft2), square yard (yd2), acre (acre), hectare (ha)
      - name: speed
        type: array
        description: >-
          Available speed units: meters per second (m_s), kilometers per hour (km_h), miles per hour (mph), knots
          (knots)
    code_examples:
      curl: |
        curl https://api.requiems.xyz/v1/technology/convert/units \
          -H "requiems-api-key: YOUR_API_KEY"
      python: |
        import requests

        url = "https://api.requiems.xyz/v1/technology/convert/units"
        headers = {"requiems-api-key": "YOUR_API_KEY"}

        response = requests.get(url, headers=headers)
        units = response.json()['data']

        # Print all length units
        print("Length units:", units['length'])
      javascript: |
        const response = await fetch('https://api.requiems.xyz/v1/technology/convert/units', {
          headers: {
            'requiems-api-key': 'YOUR_API_KEY'
          }
        });

        const { data } = await response.json();

        // Build a dropdown with length units
        data.length.forEach(unit => {
          console.log(`<option value="${unit}">${unit}</option>`);
        });
      ruby: |
        require 'net/http'
        require 'json'

        uri = URI('https://api.requiems.xyz/v1/technology/convert/units')
        request = Net::HTTP::Get.new(uri)
        request['requiems-api-key'] = 'YOUR_API_KEY'

        response = Net::HTTP.start(uri.hostname, uri.port, use_ssl: true) do |http|
          http.request(request)
        end

        units = JSON.parse(response.body)['data']
        puts "Temperature units: #{units['temperature'].join(', ')}"
  - name: Batch Convert Units
    method: POST
    path: /v1/technology/convert/batch
    description: convert up to 50 unit conversion operations in a single request.
    parameters:
      - name: operations
        type: array
        required: true
        location: body
        description: "Array of operations to convert (min: 1, max: 50)."
        example: |
          [{"from": "kg", "to": "lb", "value": 10}, {"from": "c", "to": "f", "value": 5}]
    request_example: |
      {
        "operations": [
          {
            "from": "kg",
            "to": "lb",
            "value": 10
          },
          {
            "from": "c",
            "to": "f",
            "value": 5
          }
       ]
      }
    response_example: |
      {
        "data": {
          "results": [
            {
              "from": "kg",
              "to": "lb",
              "success": true,
              "data": {
                "from": "kg",
                "to": "lb",
                "input": 10,
                "result": 22.046244,
                "formula": "kg × 2.204624"
              }
            },
            {
              "from": "c",
              "to": "f",
              "success": true,
              "data": {
                "from": "c",
                "to": "f",
                "input": 5,
                "result": 41,
                "formula": "°C × 9/5 + 32"
              }
            }
          ],
          "total": 2
        },
        "metadata": {
          "timestamp": "2026-05-15T21:52:05Z"
        }
      }
    response_fields:
      - name: results
        type: array
        description: List of unit conversion results returned in the same order as the input operations.
      - name: results[].from
        type: string
        description: Source unit used for the conversion.
      - name: results[].to
        type: string
        description: Target unit used for the conversion.
      - name: results[].success
        type: boolean
        description: Indicates whether the conversion operation was successful.
      - name: results[].error
        type: string
        description: Error message if the conversion failed. Empty when success is true.
      - name: results[].data
        type: object
        description: Conversion result details. Contains empty values when the conversion fails.
      - name: results[].data.from
        type: string
        description: Source unit.
      - name: results[].data.to
        type: string
        description: Target unit.
      - name: results[].data.input
        type: number
        description: Original numeric value provided for conversion.
      - name: results[].data.result
        type: number
        description: Converted numeric result.
      - name: results[].data.formula
        type: string
        description: Formula or conversion factor used to calculate the result.
      - name: total
        type: integer
        description: Total number of conversion results returned.
    errors:
      - code: validation_failed
        status: 422
        description: The operations array is missing, empty, or contains more than 50 items.
      - code: bad_request
        status: 400
        description: Invalid JSON, malformed request body, or unexpected field types.
    code_examples:
      curl: |
        curl -X POST "https://api.requiems.xyz/v1/technology/convert/batch" \
          -H "requiems-api-key: YOUR_API_KEY" \
          -H "Content-Type: application/json" \
          -d '{
            "operations": [
              {
                "from": "kg",
                "to": "lb",
                "value": 10
              },
              {
                "from": "c",
                "to": "f",
                "value": 5
              }
            ]
          }'
      python: |
        import requests

        url = "https://api.requiems.xyz/v1/technology/convert/batch"

        headers = {
          "requiems-api-key": "YOUR_API_KEY",
          "Content-Type": "application/json"
        }

        payload = {
          "operations": [
            {
              "from": "kg",
              "to": "lb",
              "value": 10
            },
            {
              "from": "c",
              "to": "f",
              "value": 5
            }
          ]
        }

        response = requests.post(url, headers=headers, json=payload)

        for item in response.json()["data"]["results"]:
          print(item["from"], "->", item["to"])

          if item["success"]:
            print("Result:", item["data"]["result"])
            print("Formula:", item["data"]["formula"])
          else:
            print("Error:", item["error"])

      javascript: |
        const response = await fetch(
          'https://api.requiems.xyz/v1/technology/convert/batch',
          {
            method: 'POST',
            headers: {
              'requiems-api-key': 'YOUR_API_KEY',
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              operations: [
                {
                  from: 'kg',
                  to: 'lb',
                  value: 10
                },
                {
                  from: 'c',
                  to: 'f',
                  value: 5
                }
              ]
            })
          }
        );

        const { data } = await response.json();

        data.results.forEach(item => {
          console.log(item.from, '->', item.to);

          if (item.success) {
            console.log('Result:', item.data.result);
            console.log('Formula:', item.data.formula);
          } else {
            console.log('Error:', item.error);
          }
        });

      ruby: |
        require 'net/http'
        require 'json'

        uri = URI('https://api.requiems.xyz/v1/technology/convert/batch')

        request = Net::HTTP::Post.new(uri)

        request['requiems-api-key'] = 'YOUR_API_KEY'
        request['Content-Type'] = 'application/json'

        request.body = {
          operations: [
            {
              from: 'kg',
              to: 'lb',
              value: 10
            },
            {
              from: 'c',
              to: 'f',
              value: 5
            }
          ]
        }.to_json

        response = Net::HTTP.start(uri.hostname, uri.port, use_ssl: true) do |http|
          http.request(request)
        end

        JSON.parse(response.body)['data']['results'].each do |item|
          puts "#{item['from']} -> #{item['to']}"

          if item['success']
            puts "Result: #{item['data']['result']}"
            puts "Formula: #{item['data']['formula']}"
          else
            puts "Error: #{item['error']}"
          end
        end
