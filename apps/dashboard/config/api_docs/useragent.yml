api_id: useragent
api_name: User Agent Parser
description: Parse user agent strings to extract browser name, version, operating system, device type, and bot detection.
base_url: https://api.requiems.xyz
overview:
  use_cases:
    - Analytics dashboards
    - Serving device-specific content
    - Bot filtering and traffic analysis
    - Browser compatibility reporting
  features:
    - Browser name and version detection
    - Operating system and version detection
    - Device classification (desktop, mobile, tablet, bot)
    - Bot/crawler detection
endpoints:
  - name: Parse User Agent
    method: GET
    path: /v1/technology/useragent
    description: Parses a user agent string and returns structured information about the browser, OS, device, and bot status.
    parameters:
      - name: ua
        type: string
        required: true
        location: query
        description: The user agent string to parse.
        example: >-
          Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0
          Safari/537.36
    response_example: |
      {
        "data": {
          "browser": "Chrome",
          "browser_version": "120.0",
          "os": "Windows",
          "os_version": "10/11",
          "device": "desktop",
          "is_bot": false
        },
        "metadata": {
          "timestamp": "2026-01-01T00:00:00Z"
        }
      }
    response_fields:
      - name: browser
        type: string
        description: Detected browser name (e.g. Chrome, Firefox, Safari, Edge, Opera, Internet Explorer, Other)
      - name: browser_version
        type: string
        description: Detected browser version (major.minor)
      - name: os
        type: string
        description: Detected operating system (e.g. Windows, macOS, Linux, Android, iOS, ChromeOS, Other)
      - name: os_version
        type: string
        description: Detected OS version (format varies by platform)
      - name: device
        type: string
        description: Device type — one of desktop, mobile, tablet, bot, or unknown
      - name: is_bot
        type: boolean
        description: True when the user agent matches a known bot or crawler pattern
    errors:
      - code: bad_request
        status: 400
        description: The ua query parameter is missing.
    code_examples:
      curl: >
        curl
        "https://api.requiems.xyz/v1/technology/useragent?ua=Mozilla%2F5.0+%28Windows+NT+10.0%29+Chrome%2F120.0.0.0" \
          -H "requiems-api-key: YOUR_API_KEY"
      python: |
        import requests
        from urllib.parse import quote

        ua = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/120.0.0.0"
        url = f"https://api.requiems.xyz/v1/technology/useragent?ua={quote(ua)}"
        headers = {"requiems-api-key": "YOUR_API_KEY"}

        response = requests.get(url, headers=headers)
        print(response.json())
      javascript: |
        const ua = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/120.0.0.0";
        const url = `https://api.requiems.xyz/v1/technology/useragent?ua=${encodeURIComponent(ua)}`;

        const response = await fetch(url, {
          headers: { 'requiems-api-key': 'YOUR_API_KEY' }
        });

        const data = await response.json();
        console.log(data.data.browser);
      ruby: |
        require 'net/http'
        require 'json'

        ua = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/120.0.0.0"
        uri = URI("https://api.requiems.xyz/v1/technology/useragent?ua=#{URI.encode_www_form_component(ua)}")
        request = Net::HTTP::Get.new(uri)
        request['requiems-api-key'] = 'YOUR_API_KEY'

        response = Net::HTTP.start(uri.hostname, uri.port, use_ssl: true) do |http|
          http.request(request)
        end

        data = JSON.parse(response.body)
        puts data['data']['browser']
  - name: Batch Parse User Agents
    method: POST
    path: /v1/technology/useragent/batch
    description: Parses up to 50 user agents in a single request.
    parameters:
      - name: user_agents
        type: array
        required: true
        location: body
        description: "Array of user agents to parse (min: 1, max: 50)."
        example: |
          [
            "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36",
            "Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15"
          ]
    request_example: |
      {
         "user_agents": [
           "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36",
           "Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15"
         ]
       }
    response_example: |
      {
        "data": {
          "results": [
            {
              "user_agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36",
              "data": {
                "browser": "Chrome",
                "browser_version": "124.0",
                "os": "Windows",
                "os_version": "10/11",
                "device": "desktop",
                "is_bot": false
              }
            },
            {
              "user_agent": "Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15",
              "data": {
                "browser": "Safari",
                "browser_version": "",
                "os": "iOS",
                "os_version": "17.0",
                "device": "mobile",
                "is_bot": false
              }
            }
          ],
          "total": 2
        },
        "metadata": {
          "timestamp": "2026-05-19T05:33:14Z"
        }
      }
    response_fields:
      - name: results
        type: array
        description: List of parsed user agents results returned in the same order as the input user agents.
      - name: results[].user_agent
        type: string
        description: The original user agent string from the input.
      - name: results[].data
        type: object
        description: Parsed user agent details.
      - name: results[].data.browser
        type: string
        description: Detected browser name (e.g. Chrome, Firefox, Safari, Edge, Opera, Internet Explorer, Other). Empty if not detected.
      - name: results[].data.browser_version
        type: string
        description: Detected browser version (major.minor). Empty if not detected.
      - name: results[].data.os
        type: string
        description: Detected operating system (e.g. Windows, macOS, Linux, Android, iOS, ChromeOS, Other). Empty if not detected.
      - name: results[].data.os_version
        type: string
        description: Detected OS version (format varies by platform). Empty if not detected.
      - name: results[].data.device
        type: string
        description: Device type — one of desktop, mobile, tablet, bot, or unknown
      - name: results[].data.is_bot
        type: boolean
        description: True when the user agent matches a known bot or crawler pattern
      - name: total
        type: integer
        description: Total number of parsed user agent results returned.
    errors:
      - code: validation_failed
        status: 422
        description: The user_agents array is missing, empty, or contains more than 50 items.
      - code: bad_request
        status: 400
        description: Invalid JSON, malformed request body, or unexpected field types.
    code_examples:
      curl: |
        curl -X POST "https://api.requiems.xyz/v1/technology/useragent/batch" \
          -H "requiems-api-key: YOUR_API_KEY" \
          -H "Content-Type: application/json" \
          -d '{
            "user_agents": [
              "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36",
              "Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15"
            ]
          }'
      python: |
        import requests

        url = "https://api.requiems.xyz/v1/technology/useragent/batch"

        headers = {
          "requiems-api-key": "YOUR_API_KEY",
          "Content-Type": "application/json"
        }

        payload = {
          "user_agents": [
            "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36",
            "Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15"
          ]
        }

        response = requests.post(url, headers=headers, json=payload)

        for item in response.json()["data"]["results"]:
          print(item["user_agent"])
          print("Browser:", item["data"]["browser"], item["data"]["browser_version"])
          print("OS:", item["data"]["os"], item["data"]["os_version"])
          print("Device:", item["data"]["device"])
          print("Is Bot:", item["data"]["is_bot"])
      javascript: |
        const response = await fetch(
          'https://api.requiems.xyz/v1/technology/useragent/batch',
          {
            method: 'POST',
            headers: {
              'requiems-api-key': 'YOUR_API_KEY',
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              user_agents: [
                'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36',
                'Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15'
              ]
            })
          }
        );

        const { data } = await response.json();

        data.results.forEach(item => {
          console.log(item.user_agent);
          console.log('Browser:', item.data.browser, item.data.browser_version);
          console.log('OS:', item.data.os, item.data.os_version);
          console.log('Device:', item.data.device);
          console.log('Is Bot:', item.data.is_bot);
        });
      ruby: |
        require 'net/http'
        require 'json'

        uri = URI('https://api.requiems.xyz/v1/technology/useragent/batch')

        request = Net::HTTP::Post.new(uri)

        request['requiems-api-key'] = 'YOUR_API_KEY'
        request['Content-Type'] = 'application/json'

        request.body = {
          user_agents: [
            'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36',
            'Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15'
          ]
        }.to_json

        response = Net::HTTP.start(uri.hostname, uri.port, use_ssl: true) do |http|
          http.request(request)
        end

        JSON.parse(response.body)['data']['results'].each do |item|
          puts item['user_agent']
          puts "Browser: #{item['data']['browser']} #{item['data']['browser_version']}"
          puts "OS: #{item['data']['os']} #{item['data']['os_version']}"
          puts "Device: #{item['data']['device']}"
          puts "Is Bot: #{item['data']['is_bot']}"
        end
faq:
  - question: Which browsers are detected?
    answer: Chrome, Firefox, Safari, Edge, Opera, and Internet Explorer. Anything else returns "Other".
  - question: How is bot detection handled?
    answer: >-
      The API checks for known bot/crawler keywords in the user agent string, including Googlebot, Bingbot, curl, wget,
      python-requests, and many others.
  - question: What device types are returned?
    answer: desktop, mobile, tablet, bot, or unknown. Tablets are identified by iPad or Android without 'Mobile' in the UA.
performance:
  p50_ms: 928
  p95_ms: 1051
  p99_ms: 1122
  avg_ms: 962
  samples: 50
  measured_at: "2026-04-20"
