api_id: whois
api_name: WHOIS Lookup
description: Get domain registration details including registrar, name servers, status, creation and expiry dates, and DNSSEC information.
base_url: https://api.requiems.xyz

overview:
  use_cases:
    - Verifying domain ownership before initiating a transfer
    - Checking domain expiry dates for monitoring or alerting
    - Enriching lead data with registrar and registration details
    - Security research and phishing domain investigation

  features:
    - Registrar name and WHOIS server
    - Name servers list
    - Domain status flags (e.g. clientTransferProhibited)
    - Creation, updated, and expiry dates
    - DNSSEC status

endpoints:
  - name: WHOIS Lookup
    method: GET
    path: /v1/networking/whois/{domain}
    description: Returns WHOIS registration information for a domain name.

    parameters:
      - name: domain
        type: string
        required: true
        location: path
        description: "The domain name to look up (e.g. example.com)"
        example: example.com

    response_example: |
      {
        "data": {
          "domain": "example.com",
          "registrar": "RESERVED-Internet Assigned Numbers Authority",
          "name_servers": [
            "A.IANA-SERVERS.NET",
            "B.IANA-SERVERS.NET"
          ],
          "status": [
            "clientDeleteProhibited",
            "clientTransferProhibited",
            "clientUpdateProhibited"
          ],
          "created_date": "1995-08-14T04:00:00Z",
          "updated_date": "2023-08-14T07:01:38Z",
          "expiry_date": "2024-08-13T04:00:00Z",
          "dnssec": true
        },
        "metadata": {
          "timestamp": "2026-01-01T00:00:00Z"
        }
      }

    response_fields:
      - name: domain
        type: string
        description: The domain name that was looked up
      - name: registrar
        type: string
        description: The name of the registrar holding the domain registration
      - name: name_servers
        type: array<string>
        description: List of authoritative name servers for the domain
      - name: status
        type: array<string>
        description: "EPP status codes for the domain (e.g. clientTransferProhibited)"
      - name: created_date
        type: string
        description: Date the domain was first registered (ISO 8601)
      - name: updated_date
        type: string
        description: Date the domain record was last updated (ISO 8601)
      - name: expiry_date
        type: string
        description: Date the domain registration expires (ISO 8601)
      - name: dnssec
        type: boolean
        description: True when DNSSEC is enabled for the domain

    errors:
      - code: bad_request
        status: 400
        description: The domain name format is invalid.
      - code: not_found
        status: 404
        description: No WHOIS record was found for the domain.
      - code: internal_error
        status: 500
        description: Unexpected server error or upstream WHOIS query failure.

    code_examples:
      curl: |
        curl "https://api.requiems.xyz/v1/networking/whois/example.com" \
          -H "requiems-api-key: YOUR_API_KEY"

      python: |
        import requests

        url = "https://api.requiems.xyz/v1/networking/whois/example.com"
        headers = {"requiems-api-key": "YOUR_API_KEY"}

        response = requests.get(url, headers=headers)
        print(response.json())

      javascript: |
        const response = await fetch('https://api.requiems.xyz/v1/networking/whois/example.com', {
          headers: { 'requiems-api-key': 'YOUR_API_KEY' }
        });

        const data = await response.json();
        console.log(data.data.registrar, data.data.expiry_date);

      ruby: |
        require 'net/http'
        require 'json'

        uri = URI('https://api.requiems.xyz/v1/networking/whois/example.com')
        request = Net::HTTP::Get.new(uri)
        request['requiems-api-key'] = 'YOUR_API_KEY'

        response = Net::HTTP.start(uri.hostname, uri.port, use_ssl: true) do |http|
          http.request(request)
        end

        data = JSON.parse(response.body)
        puts data['data']['registrar']

  - name: Batch WHOIS Lookup
    method: POST
    path: /v1/networking/whois/batch
    description: >-
      Returns WHOIS information for up to 50 domains in a single request.
      Results are returned in the same order as the input array.
      Domains without WHOIS data return found: false instead of failing the
      entire request.

    parameters:
      - name: domains
        type: array<string>
        required: true
        location: body
        description: "Array of domain names. Min: 1, Max: 50."
        example: '["example.com", "google.com"]'

    response_example: |
      {
        "data": {
          "results": [
            {
              "domain": "example.com",
              "found": true,
              "data": {
                "domain": "example.com",
                "registrar": "RESERVED-Internet Assigned Numbers Authority",
                "name_servers": [
                  "A.IANA-SERVERS.NET",
                  "B.IANA-SERVERS.NET"
                ],
                "status": [
                  "clientDeleteProhibited"
                ],
                "created_date": "1995-08-14T04:00:00Z",
                "updated_date": "2023-08-14T07:01:38Z",
                "expiry_date": "2024-08-13T04:00:00Z",
                "dnssec": true
              }
            },
            {
              "domain": "doesnotexist.com",
              "found": false,
              "error": "domain not found"
            }
          ],
          "total": 2
        },
        "metadata": {
          "timestamp": "2026-01-01T00:00:00Z"
        }
      }

    response_fields:
      - name: results
        type: array<object>
        description: One entry per domain, in the same order as the input

      - name: results[].domain
        type: string
        description: Domain name requested in the batch

      - name: results[].found
        type: boolean
        description: False when WHOIS data could not be found

      - name: results[].error
        type: string
        description: Error message when found is false

      - name: results[].data
        type: object
        description: WHOIS information for the domain when found is true

      - name: total
        type: integer
        description: Total number of results returned

    errors:
      - code: validation_failed
        status: 422
        description: >-
          Invalid request body. This includes empty arrays,
          more than 50 domains, invalid domain names,
          or malformed payloads.

      - code: internal_error
        status: 500
        description: Unexpected server error during batch WHOIS lookup.

    code_examples:
      curl: |
        curl -X POST "https://api.requiems.xyz/v1/networking/whois/batch" \
          -H "requiems-api-key: YOUR_API_KEY" \
          -H "Content-Type: application/json" \
          -d '{"domains":["example.com","google.com"]}'

      python: |
        import requests

        url = "https://api.requiems.xyz/v1/networking/whois/batch"

        headers = {
            "requiems-api-key": "YOUR_API_KEY",
            "Content-Type": "application/json"
        }

        payload = {
            "domains": ["example.com", "google.com"]
        }

        response = requests.post(url, headers=headers, json=payload)

        for item in response.json()["data"]["results"]:
            if item["found"]:
                print(item["data"]["registrar"])
            else:
                print(item["error"])

      javascript: |
        const response = await fetch(
          'https://api.requiems.xyz/v1/networking/whois/batch',
          {
            method: 'POST',
            headers: {
              'requiems-api-key': 'YOUR_API_KEY',
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              domains: ['example.com', 'google.com']
            })
          }
        );

        const { data } = await response.json();

        data.results.forEach(item => {
          if (item.found) {
            console.log(item.data.domain, item.data.registrar);
          } else {
            console.log(item.domain, item.error);
          }
        });

      ruby: |
        require 'net/http'
        require 'json'

        uri = URI('https://api.requiems.xyz/v1/networking/whois/batch')

        request = Net::HTTP::Post.new(uri)
        request['requiems-api-key'] = 'YOUR_API_KEY'
        request['Content-Type'] = 'application/json'

        request.body = {
          domains: ['example.com', 'google.com']
        }.to_json

        response = Net::HTTP.start(
          uri.hostname,
          uri.port,
          use_ssl: true
        ) do |http|
          http.request(request)
        end

        results = JSON.parse(response.body)['data']['results']

        results.each do |item|
          if item['found']
            puts "#{item['domain']} -> #{item['data']['registrar']}"
          else
            puts "#{item['domain']} -> #{item['error']}"
          end
        end

faq:
  - question: What domains are supported?
    answer: Any publicly registered domain with a WHOIS server is supported. This includes all common TLDs (.com, .net, .org, .io, etc.) and most country-code TLDs (ccTLDs).

  - question: Why are some fields empty in the response?
    answer: WHOIS data availability depends on the registry and registrar policies. Many registrars redact personal contact information under GDPR or similar privacy regulations. Fields will be omitted from the response when not available.

  - question: What does the not_found error mean?
    answer: A 404 not_found response means the domain is either unregistered or the registry returned no data for it.

  - question: How fresh is the WHOIS data?
    answer: WHOIS data is fetched live from the authoritative WHOIS servers on each request. There is no caching layer, so the data reflects the current state of the registry.

  - question: What does found false mean in the batch endpoint?
    answer: >-
      It means the domain does not have WHOIS data available or is not
      registered. The batch request itself still succeeds.

  - question: How many domains can I send in a batch request?
    answer: >-
      Up to 50 domains per request. Sending more than 50 domains returns
      a 422 validation_failed error.

  - question: Are batch responses ordered?
    answer: >-
      Yes. Results are returned in the same order as the domains sent
      in the request body.
