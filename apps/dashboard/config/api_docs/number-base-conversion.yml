api_id: number-base-conversion
api_name: Number Base Conversion
description: Convert integers between binary (base 2), octal (base 8), decimal (base 10), and hexadecimal (base 16).
base_url: https://requiems.xyz
overview:
  use_cases:
    - Developer tools and calculators
    - Converting memory addresses or CPU flags between hex and binary
    - Teaching or learning number systems
    - Debugging low-level protocol data
  features:
    - Supports binary, octal, decimal, and hexadecimal
    - Accepts optional base prefixes (0x, 0b, 0o)
    - Supports negative integers
    - Fast, in-memory only — no database required
endpoints:
  - name: Convert Base
    method: GET
    path: /v1/technology/base
    description: Convert an integer from one number base to another.
    parameters:
      - name: from
        type: integer
        required: true
        location: query
        description: Source base (2, 8, 10, or 16)
        example: 10
      - name: to
        type: integer
        required: true
        location: query
        description: Target base (2, 8, 10, or 16)
        example: 16
      - name: value
        type: string
        required: true
        location: query
        description: "The number as a string. Accepts optional prefixes: 0x (hex), 0b (binary), 0o (octal)."
        example: "255"
    response_example: |
      {
        "data": {
          "input": "255",
          "from": 10,
          "to": 16,
          "result": "ff"
        },
        "metadata": {
          "timestamp": "2026-01-01T00:00:00Z"
        }
      }
    response_fields:
      - name: input
        type: string
        description: The original value as provided in the request
      - name: from
        type: integer
        description: The source base
      - name: to
        type: integer
        description: The target base
      - name: result
        type: string
        description: The converted value in the target base
    errors:
      - code: bad_request
        status: 400
        description: A required parameter is missing, the base is not one of 2/8/10/16, or value is not valid for the given base.
    code_examples:
      curl: |
        # Decimal to hex
        curl "https://requiems.xyz/v1/technology/base?from=10&to=16&value=255" \
          -H "requiems-api-key: YOUR_API_KEY"

        # Hex to binary (using 0x prefix)
        curl "https://requiems.xyz/v1/technology/base?from=16&to=2&value=0xff" \
          -H "requiems-api-key: YOUR_API_KEY"
      python: |
        import requests

        url = "https://requiems.xyz/v1/technology/base"
        headers = {"requiems-api-key": "YOUR_API_KEY"}
        params = {"from": 10, "to": 16, "value": "255"}

        response = requests.get(url, params=params, headers=headers)
        print(response.json()["data"]["result"])  # ff
      javascript: |
        const params = new URLSearchParams({ from: 10, to: 16, value: '255' });
        const response = await fetch(
          `https://requiems.xyz/v1/technology/base?${params}`,
          { headers: { 'requiems-api-key': 'YOUR_API_KEY' } }
        );

        const { data } = await response.json();
        console.log(data.result); // ff
      ruby: |
        require 'net/http'
        require 'json'

        uri = URI('https://requiems.xyz/v1/technology/base')
        uri.query = URI.encode_www_form(from: 10, to: 16, value: '255')
        request = Net::HTTP::Get.new(uri)
        request['requiems-api-key'] = 'YOUR_API_KEY'

        response = Net::HTTP.start(uri.hostname, uri.port, use_ssl: true) do |http|
          http.request(request)
        end

        puts JSON.parse(response.body)['data']['result']  # ff
  - name: Batch Convert Base
    method: POST
    path: /v1/technology/base/batch
    description: Convert up to 50 numbers between bases in a single request. Results are returned in input order. Per-item errors are reported inline.
    parameters:
      - name: items
        type: array<object>
        required: true
        location: body
        description: List of conversion requests (1–50 items).
      - name: items[].from
        type: integer
        required: true
        location: body
        description: Source base (2, 8, 10, or 16).
      - name: items[].to
        type: integer
        required: true
        location: body
        description: Target base (2, 8, 10, or 16).
      - name: items[].value
        type: string
        required: true
        location: body
        description: "The number as a string. Accepts optional prefixes: 0x (hex), 0b (binary), 0o (octal)."
    request_example: |
      {
        "items": [
          { "from": 10, "to": 16, "value": "255" },
          { "from": 2,  "to": 10, "value": "1111" }
        ]
      }
    response_example: |
      {
        "data": {
          "results": [
            { "from": 10, "to": 16, "input": "255",  "result": "ff" },
            { "from": 2,  "to": 10, "input": "1111", "result": "15" }
          ],
          "total": 2
        },
        "metadata": { "timestamp": "2026-01-01T00:00:00Z" }
      }
    response_fields:
      - name: results
        type: array<object>
        description: Per-item results in input order.
      - name: results[].from
        type: integer
        description: The source base used for conversion.
      - name: results[].to
        type: integer
        description: The target base used for conversion.
      - name: results[].input
        type: string
        description: The original value as provided in the request.
      - name: results[].result
        type: string
        description: The converted value in the target base (omitted on error).
      - name: results[].error
        type: string
        description: Error message if this item failed (omitted on success).
      - name: total
        type: integer
        description: Total number of items processed.
    errors:
      - code: validation_failed
        status: 422
        description: The items array is missing, empty, or exceeds 50 items.
      - code: bad_request
        status: 400
        description: The request body is missing or malformed.
    code_examples:
      curl: |
        curl -X POST https://requiems.xyz/v1/technology/base/batch \
          -H "requiems-api-key: YOUR_API_KEY" \
          -H "Content-Type: application/json" \
          -d '{"items": [{"from": 10, "to": 16, "value": "255"}, {"from": 2, "to": 10, "value": "1111"}]}'
      python: |
        import requests

        url = "https://requiems.xyz/v1/technology/base/batch"
        headers = {
            "requiems-api-key": "YOUR_API_KEY",
            "Content-Type": "application/json"
        }
        payload = {
            "items": [
                {"from": 10, "to": 16, "value": "255"},
                {"from": 2,  "to": 10, "value": "1111"}
            ]
        }

        response = requests.post(url, headers=headers, json=payload)
        for item in response.json()["data"]["results"]:
            print(item.get("result") or item.get("error"))
      javascript: |
        const response = await fetch('https://requiems.xyz/v1/technology/base/batch', {
          method: 'POST',
          headers: {
            'requiems-api-key': 'YOUR_API_KEY',
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            items: [
              { from: 10, to: 16, value: '255' },
              { from: 2,  to: 10, value: '1111' }
            ]
          })
        });

        const { data } = await response.json();
        data.results.forEach(item => console.log(item.result ?? item.error));
      ruby: |
        require 'net/http'
        require 'json'

        uri = URI('https://requiems.xyz/v1/technology/base/batch')
        request = Net::HTTP::Post.new(uri)
        request['requiems-api-key'] = 'YOUR_API_KEY'
        request['Content-Type'] = 'application/json'
        request.body = {
          items: [
            { from: 10, to: 16, value: '255' },
            { from: 2,  to: 10, value: '1111' }
          ]
        }.to_json

        response = Net::HTTP.start(uri.hostname, uri.port, use_ssl: true) do |http|
          http.request(request)
        end

        data = JSON.parse(response.body)['data']
        data['results'].each { |item| puts item['result'] || item['error'] }
faq:
  - question: Which bases are supported?
    answer: >-
      Binary (2), octal (8), decimal (10), and hexadecimal (16). Passing any other value for from or to returns a 400
      error.
  - question: Can I use 0x, 0b, or 0o prefixes?
    answer: Yes. The API strips common base prefixes before parsing, so 0xff, 0b11111111, and 0o377 are all accepted.
  - question: Are negative numbers supported?
    answer: Yes. A leading minus sign is preserved — for example, -255 in decimal converts to -ff in hexadecimal.
  - question: Is the hexadecimal output upper or lower case?
    answer: Lower case. The API uses Go's standard strconv.FormatInt which produces lower-case hex digits (a–f).
performance:
  p50_ms: 775
  p95_ms: 896
  p99_ms: 1050
  avg_ms: 795
  samples: 50
  measured_at: "2026-04-20"
