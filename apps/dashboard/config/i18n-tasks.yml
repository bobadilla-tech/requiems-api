base_locale: en
locales: [en, es, fr]

data:
  read:
    - config/locales/%{locale}.yml
    - config/locales/%{locale}/**/*.%{locale}.yml
  write:
    - config/locales/%{locale}.yml

# Dynamic key namespaces — slug-based views use t("#{i18n_scope}.key") patterns.
# These keys cannot be statically detected, so suppress false "unused" reports.
ignore_unused:
  - "case_studies.*.*"
  - "comparisons.competitors.*.*"
  - "comparisons.competitors.*"
  - "divisions.*.*"
  - "industries.*.*"
  - "systems.*.*"
  - "categories.*.*"
  - "date.*"
  - "devise.*"
  - "number.*"
  - "time.*"
  - "support.*"

ignore_missing: []

# Search patterns for t() usage in code
search:
  paths:
    - app
  only:
    - "*.rb"
    - "*.erb"
    - "*.haml"
    - "*.slim"
