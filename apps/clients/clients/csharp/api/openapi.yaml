openapi: 3.0.3
info:
  description: "Unified access to enterprise-grade APIs — email validation, text utilities,\
    \ and more. Authenticate with the `requiems-api-key` header. Each call costs 1\
    \ credit unless an endpoint states otherwise. Client (4xx) and server (5xx) errors\
    \ are not charged, and requests to unknown routes or with an unsupported method\
    \ are not recorded."
  title: Requiems API
  version: 1.0.0
servers:
- description: Production
  url: https://requiems.xyz
security:
- requiems-api-key: []
tags:
- description: Get random pieces of advice and wisdom for inspiration
  name: advice
- description: "Generate barcodes in multiple formats (Code 128, Code 93, Code 39,\
    \ EAN-8, EAN-13), returned as a PNG image or base64-encoded JSON"
  name: barcode
- description: Encode strings to Base64 and decode Base64 back to plain text. Supports
    standard and URL-safe (base64url) variants.
  name: base64
- description: "Pass the first 6–8 digits of any payment card and get back the issuing\
    \ bank, card network, type, and country"
  name: bin-lookup
- description: Get a random Chuck Norris fact from a curated built-in database. Every
    call returns a different fact with a stable unique ID.
  name: chuck-norris
- description: "Look up city metadata including population, timezone, and coordinates"
  name: cities
- description: "Convert color values between HEX, RGB, HSL, and CMYK. Every response\
    \ includes all four representations."
  name: color-conversion
- description: "Historical and current annual average prices for 16 major commodities\
    \ — precious metals, energy, and agricultural goods. Sourced from FRED (Federal\
    \ Reserve Economic Data)."
  name: commodities
- description: "Atomic, namespace-isolated hit counter"
  name: counter
- description: "Get live cryptocurrency prices, 24h change, market cap, and trading\
    \ volume for 20+ major coins including BTC, ETH, SOL, and more."
  name: crypto
- description: "Get a random dad joke. Classic groan-worthy puns and wholesome humor,\
    \ served one at a time."
  name: dad-jokes
- description: "Convert structured data between JSON, YAML, CSV, XML, and TOML in\
    \ a single API call."
  name: data-format-conversion
- description: "Validate, moderate, and normalize user input at the boundary of your\
    \ product. Stop bad data before it enters your database or downstream services."
  name: data-integrity
- description: Detect the language of any text with confidence scoring
  name: detect-language
- description: "Common developer tools available on the same API key as your production\
    \ systems. QR codes, Base64 encoding, Markdown rendering, and more."
  name: developer-utilities
- description: "Get word definitions, phonetics, usage examples, and synonyms"
  name: dictionary
- description: Detect disposable and temporary email addresses to prevent fraud and
    improve data quality. Our comprehensive blocklist is continuously updated to catch
    the latest disposable email providers.
  name: disposable_email
- description: "Look up DNS records and check domain availability. Returns A, AAAA,\
    \ MX, NS, TXT, and CNAME records alongside a registration availability flag."
  name: domain-info
- description: "Normalize email addresses to their canonical form. Lowercased, trimmed,\
    \ and canonicalized with provider-specific rules including alias-domain resolution.\
    \ Also available as part of the full Email Validator."
  name: email-normalize
- description: "Full email validation in one call. Syntax check, MX record lookup,\
    \ disposable domain detection, normalization, and typo suggestions. Includes everything\
    \ from the Disposable Domain Checker and Email Normalizer in a single request."
  name: email-validate
- description: "Look up emoji by name, search by keyword, or get a random emoji with\
    \ full Unicode metadata."
  name: emoji
- description: Get live currency exchange rates and convert amounts between currencies.
    Rates are sourced from the ECB and cached for up to one hour.
  name: exchange-rate
- description: "Get random interesting facts from a curated database. Filter by category\
    \ — science, history, technology, nature, space, or food. Includes source attribution."
  name: facts
- description: "Browse 1,500+ exercises with step-by-step instructions, target muscles,\
    \ secondary muscles, equipment requirements, and body part filters."
  name: fitness-exercises
- description: Convert addresses to coordinates and coordinates back to addresses
  name: geocode
- description: "Resolve addresses, coordinates, and IPs into complete location profiles.\
    \ Timezone, UTC offset, public holidays, and working day counts included in every\
    \ response."
  name: global-data
- description: Get a list of holidays for a specific country and year
  name: holidays
- description: Get daily horoscope readings for all 12 zodiac signs
  name: horoscope
- description: Validate IBAN numbers and extract the bank code and account number.
    Supports all countries in the official SWIFT IBAN Registry (~80 countries).
  name: iban
- description: "Compose email, phone, IP, and behavioral signals into a single risk\
    \ decision. One call returns whether a user is real, safe, and trustworthy."
  name: identity-risk
- description: "Historical and current CPI inflation rates for 241 countries, sourced\
    \ from the World Bank. Includes up to 30 years of annual data."
  name: inflation
- description: "Look up Autonomous System Number (ASN), organization, ISP, and network\
    \ route information for any IP address."
  name: ip-asn
- description: "Get geolocation data for any IP address including country, city, ISP,\
    \ and VPN detection."
  name: ip-info
- description: Generate placeholder text for design mockups and prototypes
  name: lorem-ipsum
- description: Convert Markdown to HTML in a single API call. Optionally sanitize
    the output to strip unsafe tags and prevent XSS.
  name: markdown
- description: "Calculate monthly mortgage payments and full amortization schedules.\
    \ Pass principal, annual interest rate, and loan term in years."
  name: mortgage
- description: "Look up MX (Mail Exchange) records for any domain. Returns all mail\
    \ server hostnames with their priorities, sorted from highest to lowest priority."
  name: mx-lookup
- description: "Convert integers between binary, octal, decimal, and hexadecimal.\
    \ Accepts optional 0x, 0b, and 0o prefixes."
  name: number-base-conversion
- description: Generate cryptographically secure random passwords with customizable
    length and character sets
  name: password-generator
- description: "Validate financial identifiers and score transaction risk in a single\
    \ call. Combines BIN lookup, IBAN parsing, SWIFT verification, and IP intelligence."
  name: payments-intelligence
- description: "Validate phone numbers globally. Detect carrier, country, type, and\
    \ VOIP or virtual risk using only phone metadata."
  name: phone-validation
- description: "Look up city, state, and coordinates for any postal code worldwide"
  name: postal-code
- description: Detect and censor profanity in text for content moderation
  name: profanity
- description: "Generate QR codes from any text or URL, returned as a PNG image or\
    \ base64-encoded JSON"
  name: qr-code
- description: Access a database of inspirational and famous quotes
  name: quotes
- description: "Generate random fake user profiles for testing and prototyping — names,\
    \ emails, phone numbers, addresses, and avatars"
  name: random-user
- description: "Analyze the sentiment of any text and get a positive, negative, or\
    \ neutral classification with a confidence score and full class breakdown."
  name: sentiment
- description: Check spelling and get correction suggestions for misspelled words
  name: spell-check
- description: Generate Sudoku puzzles with solutions across multiple difficulty levels
  name: sudoku
- description: "Validate and look up bank information by SWIFT/BIC code, including\
    \ institution, location, and branch metadata."
  name: swift-code
- description: Compare two texts and get a cosine similarity score between 0 and 1
  name: text-similarity
- description: Find synonyms and antonyms for any word to enhance vocabulary and writing
  name: thesaurus
- description: Get timezone information for any location by coordinates or city name
  name: timezone
- description: "Get random trivia questions with multiple-choice answers. Filter by\
    \ category (science, history, geography, sports, music, movies, literature, math,\
    \ technology, nature) and difficulty (easy, medium, hard)."
  name: trivia
- description: "Convert between units of measurement — length, weight, volume, temperature,\
    \ area, and speed"
  name: unit-conversion
- description: "Parse user agent strings to extract browser, OS, device type, and\
    \ bot detection"
  name: useragent
- description: "Detect if an IP address belongs to a VPN, proxy, Tor exit node, or\
    \ hosting provider. Returns threat scores and fraud indicators for fraud prevention\
    \ and risk assessment."
  name: vpn-detection
- description: "Get domain registration details including registrar, name servers,\
    \ status, creation and expiry dates, and DNSSEC information."
  name: whois
- description: "Get random words with definitions and parts of speech. Perfect for\
    \ vocabulary builders, educational apps, word games, or content inspiration."
  name: random-word
- description: Calculate the number of working days between two dates with optional
    country-specific holidays
  name: working-days
- description: Get the current time for any IANA timezone by name
  name: world-time
paths:
  /v1/text/advice:
    get:
      description: Returns a random piece of advice
      responses:
        "200":
          content:
            application/json:
              example:
                data:
                  id: 42
                  advice: Don't compare yourself to others. Compare yourself to the
                    person you were yesterday.
                metadata:
                  timestamp: 2026-01-01T00:00:00Z
              schema:
                $ref: "#/components/schemas/_v1_text_advice_get_200_response"
          description: Successful response
      security:
      - requiems-api-key: []
      summary: Get Random Advice
      tags:
      - advice
  /v1/technology/barcode:
    get:
      description: Returns a raw PNG image of the barcode. Ideal for direct embedding
        or file download.
      parameters:
      - description: The text or numeric string to encode in the barcode
        explode: true
        in: query
        name: data
        required: true
        schema:
          example: "123456789"
          type: string
        style: form
      - description: "Barcode format: code128, code93, code39, ean8, ean13"
        explode: true
        in: query
        name: type
        required: true
        schema:
          example: code128
          type: string
        style: form
      responses:
        "200":
          description: Successful response
        "400":
          description: "Missing or invalid parameters (e.g. data not provided, unsupported\
            \ type)"
        "422":
          description: "Data is invalid for the chosen barcode type (e.g. wrong digit\
            \ count for EAN-8/EAN-13, non-numeric EAN data)"
      security:
      - requiems-api-key: []
      summary: Generate Barcode (PNG)
      tags:
      - barcode
  /v1/technology/barcode/base64:
    get:
      description: "Returns a JSON envelope containing the barcode as a base64-encoded\
        \ PNG string, along with its type and dimensions."
      parameters:
      - description: The text or numeric string to encode in the barcode
        explode: true
        in: query
        name: data
        required: true
        schema:
          example: "123456789"
          type: string
        style: form
      - description: "Barcode format: code128, code93, code39, ean8, ean13"
        explode: true
        in: query
        name: type
        required: true
        schema:
          example: code128
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              example:
                data:
                  image: <base64-encoded PNG data>
                  type: code128
                  width: 300
                  height: 100
                metadata:
                  timestamp: 2026-01-01T00:00:00Z
              schema:
                $ref: "#/components/schemas/_v1_technology_barcode_base64_get_200_response"
          description: Successful response
        "400":
          description: "Missing or invalid parameters (e.g. data not provided, unsupported\
            \ type)"
        "422":
          description: "Data is invalid for the chosen barcode type (e.g. wrong digit\
            \ count for EAN-8/EAN-13, non-numeric EAN data)"
      security:
      - requiems-api-key: []
      summary: Generate Barcode (Base64 JSON)
      tags:
      - barcode
  /v1/technology/base64/encode:
    post:
      description: Encode a plain-text string to Base64. Supports standard (RFC 4648)
        and URL-safe (base64url) variants.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/_v1_technology_base64_encode_post_request"
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                data:
                  result: SGVsbG8sIHdvcmxkIQ==
                metadata:
                  timestamp: 2026-01-01T00:00:00Z
              schema:
                $ref: "#/components/schemas/_v1_technology_base64_encode_post_200_response"
          description: Successful response
        "400":
          description: value field is missing or empty
        "401":
          description: Missing or invalid API key
        "422":
          description: variant is not standard or url
      security:
      - requiems-api-key: []
      summary: Base64 Encode
      tags:
      - developer-utilities
  /v1/technology/base64/decode:
    post:
      description: Decode a Base64-encoded string back to plain text. Returns 422
        for invalid or unpadded input.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/_v1_technology_base64_decode_post_request"
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                data:
                  result: "Hello, world!"
                metadata:
                  timestamp: 2026-01-01T00:00:00Z
              schema:
                $ref: "#/components/schemas/_v1_technology_base64_decode_post_200_response"
          description: Successful response
        "400":
          description: value field is missing or empty
        "401":
          description: Missing or invalid API key
        "422":
          description: The value is not valid Base64 and cannot be decoded
      security:
      - requiems-api-key: []
      summary: Base64 Decode
      tags:
      - developer-utilities
  /v1/finance/bin/{bin}:
    get:
      description: Returns card metadata for the given 6–8 digit BIN prefix.
      parameters:
      - description: 6–8 digit Bank Identification Number. Dashes and spaces are stripped
          automatically.
        explode: false
        in: path
        name: bin
        required: true
        schema:
          example: "424242"
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              example:
                data:
                  bin: "424242"
                  scheme: visa
                  card_type: credit
                  card_level: classic
                  issuer_name: Chase
                  issuer_url: www.chase.com
                  issuer_phone: "+18002324000"
                  country_code: US
                  country_name: United States
                  prepaid: false
                  luhn: true
                  confidence: 0.92
                metadata:
                  timestamp: 2026-01-01T00:00:00Z
              schema:
                $ref: "#/components/schemas/_v1_finance_bin__bin__get_200_response"
          description: Successful response
        "400":
          description: BIN is not 6–8 digits or contains non-digit characters.
        "404":
          description: BIN prefix not found in the database.
        "500":
          description: Unexpected server error.
      security:
      - requiems-api-key: []
      summary: BIN Lookup
      tags:
      - bin-lookup
  /v1/entertainment/chuck-norris:
    get:
      description: Returns a randomly selected Chuck Norris fact from the built-in
        database.
      responses:
        "200":
          content:
            application/json:
              example:
                data:
                  id: cn_0
                  fact: Chuck Norris can divide by zero.
                metadata:
                  timestamp: 2026-01-01T00:00:00Z
              schema:
                $ref: "#/components/schemas/_v1_entertainment_chuck_norris_get_200_response"
          description: Successful response
      security:
      - requiems-api-key: []
      summary: Get Random Chuck Norris Fact
      tags:
      - chuck-norris
  /v1/places/cities/{city}:
    get:
      description: Returns metadata for a city by name. Lookup is case-insensitive.
      parameters:
      - description: "City name to look up (e.g. london, tokyo, new york city)"
        explode: false
        in: path
        name: city
        required: true
        schema:
          example: london
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              example:
                data:
                  name: London
                  country: GB
                  population: 7556900
                  timezone: Europe/London
                  lat: 51.5085
                  lon: -0.1257
                metadata:
                  timestamp: 2026-01-01T00:00:00Z
              schema:
                $ref: "#/components/schemas/_v1_places_cities__city__get_200_response"
          description: Successful response
        "404":
          description: No city with that name was found in the dataset.
        "500":
          description: Unexpected server error.
      security:
      - requiems-api-key: []
      summary: Get City Info
      tags:
      - cities
  /v1/technology/color:
    get:
      description: Convert a color value from one format to another. The response
        always includes all four formats.
      parameters:
      - description: "Source color format: hex, rgb, hsl, or cmyk"
        explode: true
        in: query
        name: from
        required: true
        schema:
          example: hex
          type: string
        style: form
      - description: "Target color format: hex, rgb, hsl, or cmyk"
        explode: true
        in: query
        name: to
        required: true
        schema:
          example: hsl
          type: string
        style: form
      - description: "Color value in the source format (e.g. #ff5733, rgb(255,87,51),\
          \ hsl(11,100%,60%), cmyk(0%,66%,80%,0%))"
        explode: true
        in: query
        name: value
        required: true
        schema:
          example: "#ff5733"
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              example:
                data:
                  input: "#ff5733"
                  result: "hsl(11, 100%, 60%)"
                  formats:
                    hex: "#ff5733"
                    rgb: "rgb(255, 87, 51)"
                    hsl: "hsl(11, 100%, 60%)"
                    cmyk: "cmyk(0%, 66%, 80%, 0%)"
                metadata:
                  timestamp: 2026-01-01T00:00:00Z
              schema:
                $ref: "#/components/schemas/_v1_technology_color_get_200_response"
          description: Successful response
        "400":
          description: "One or more of from, to, or value parameters is missing or\
            \ the from/to value is not one of: hex, rgb, hsl, cmyk."
        "422":
          description: The value cannot be parsed in the specified from format.
        "500":
          description: Unexpected server error.
      security:
      - requiems-api-key: []
      summary: Convert Color
      tags:
      - color-conversion
  /v1/finance/commodities/{commodity}:
    get:
      description: Returns the latest annual average price and up to 10 years of historical
        data for the requested commodity slug.
      parameters:
      - description: "Commodity slug (e.g. gold, silver, oil). See supported slugs\
          \ below."
        explode: false
        in: path
        name: commodity
        required: true
        schema:
          example: gold
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              example:
                data:
                  commodity: gold
                  name: Gold
                  price: 2386.33
                  unit: oz
                  currency: USD
                  change_24h: 23.01
                  historical:
                  - period: "2023"
                    price: 1940.54
                  - period: "2022"
                    price: 1800.12
                  - period: "2021"
                    price: 1798.52
                  - period: "2020"
                    price: 1769.64
                  - period: "2019"
                    price: 1392.6
                  - period: "2018"
                    price: 1268.93
                  - period: "2017"
                    price: 1257.15
                  - period: "2016"
                    price: 1251.65
                  - period: "2015"
                    price: 1160.06
                  - period: "2014"
                    price: 1266.4
                metadata:
                  timestamp: 2026-01-01T00:00:00Z
              schema:
                $ref: "#/components/schemas/_v1_finance_commodities__commodity__get_200_response"
          description: Successful response
        "404":
          description: No data found for the given commodity slug. Check the supported
            slugs list.
        "500":
          description: Unexpected server error.
      security:
      - requiems-api-key: []
      summary: Get Commodity Price
      tags:
      - commodities
  /v1/technology/counter/{namespace}:
    get:
      description: Get the current value of a counter without incrementing it
      parameters:
      - description: "Counter namespace (1-64 chars: alphanumeric, hyphen, underscore)"
        explode: false
        in: path
        name: namespace
        required: true
        schema:
          example: page-views
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              example:
                data:
                  namespace: page-views
                  value: 42
                metadata:
                  timestamp: 2026-01-01T00:00:00Z
              schema:
                $ref: "#/components/schemas/_v1_technology_counter__namespace__get_200_response"
          description: Successful response
        "400":
          description: "Invalid namespace: must be 1–64 chars, alphanumeric, hyphen\
            \ or underscore only"
        "500":
          description: Internal server error
      security:
      - requiems-api-key: []
      summary: Get Counter Value
      tags:
      - counter
    post:
      description: Atomically increment a counter in the specified namespace and return
        the new value
      parameters:
      - description: "Counter namespace (1-64 chars: alphanumeric, hyphen, underscore)"
        explode: false
        in: path
        name: namespace
        required: true
        schema:
          example: page-views
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              example:
                data:
                  namespace: page-views
                  value: 42
                metadata:
                  timestamp: 2026-01-01T00:00:00Z
              schema:
                $ref: "#/components/schemas/_v1_technology_counter__namespace__post_200_response"
          description: Successful response
        "400":
          description: "Invalid namespace: must be 1–64 chars, alphanumeric, hyphen\
            \ or underscore only"
        "500":
          description: Internal server error
      security:
      - requiems-api-key: []
      summary: Increment Counter
      tags:
      - counter
  /v1/finance/crypto/{symbol}:
    get:
      description: Returns current price data for the given cryptocurrency symbol.
      parameters:
      - description: "Uppercase ticker symbol (e.g. BTC, ETH, SOL)"
        explode: false
        in: path
        name: symbol
        required: true
        schema:
          example: BTC
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              example:
                data:
                  symbol: BTC
                  name: Bitcoin
                  price_usd: 42000.5
                  change_24h: 2.5
                  market_cap: 820000000000
                  volume_24h: 25000000000
                metadata:
                  timestamp: 2026-01-01T00:00:00Z
              schema:
                $ref: "#/components/schemas/_v1_finance_crypto__symbol__get_200_response"
          description: Successful response
        "422":
          description: The symbol is not in the supported coin list.
        "503":
          description: CoinGecko is unavailable or returned an unexpected response.
      security:
      - requiems-api-key: []
      summary: Get Crypto Price
      tags:
      - crypto
  /v1/entertainment/jokes/dad:
    get:
      description: Returns a randomly selected dad joke from the collection.
      responses:
        "200":
          content:
            application/json:
              example:
                data:
                  id: joke_7
                  joke: Why don't scientists trust atoms? Because they make up everything!
                metadata:
                  timestamp: 2026-01-01T00:00:00Z
              schema:
                $ref: "#/components/schemas/_v1_entertainment_jokes_dad_get_200_response"
          description: Successful response
        "401":
          description: Missing API key
        "403":
          description: Invalid or revoked API key
      security:
      - requiems-api-key: []
      summary: Get Random Dad Joke
      tags:
      - dad-jokes
  /v1/technology/format:
    post:
      description: "Convert content from one structured data format to another. Supported\
        \ formats: json, yaml, csv, xml, toml."
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/_v1_technology_format_post_request"
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                data:
                  result: |
                    age: 30
                    name: Alice
                metadata:
                  timestamp: 2026-01-01T00:00:00Z
              schema:
                $ref: "#/components/schemas/_v1_technology_format_post_200_response"
          description: Successful response
        "413":
          description: The content field exceeds the 512 KB limit.
        "422":
          description: "One of from, to, or content is missing, or from/to is not\
            \ one of the supported format values.; The content field is not valid\
            \ JSON (when from is json).; The content field is not valid YAML (when\
            \ from is yaml).; The content field is not valid CSV, or a row has more\
            \ columns than the header (when from is csv).; The content field is not\
            \ valid XML (when from is xml).; The content field is not valid TOML (when\
            \ from is toml).; The data structure is incompatible with the target format\
            \ (e.g. converting a JSON array to TOML, which requires a top-level object)."
      security:
      - requiems-api-key: []
      summary: Convert Format
      tags:
      - data-format-conversion
  /v1/systems/content/moderate:
    post:
      description: "Check text for profanity, toxicity, sentiment, and language. Returns\
        \ per-category flags and an is_safe boolean for gating content."
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/_v1_systems_content_moderate_post_request"
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
