                      city: Washington
                      country: US
                      lat: 38.8977
                      lon: -77.0365
                  - address: "Eiffel Tower, Paris"
                    result:
                      address: "Tour Eiffel, 5, Avenue Anatole France, Paris..."
                      city: Paris
                      country: FR
                      lat: 48.8584
