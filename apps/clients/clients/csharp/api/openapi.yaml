  /v1/places/working-days:
    get:
      description: "Calculate the number of working days between two dates, optionally\
        \ accounting for country-specific holidays"
      parameters:
      - description: Start date in YYYY-MM-DD format (ISO 8601)
        explode: true
        in: query
        name: from
        required: true
        schema:
          example: 2024-02-23
          type: string
        style: form
      - description: End date in YYYY-MM-DD format (ISO 8601). Must be >= from date.
        explode: true
        in: query
        name: to
        required: true
        schema:
          example: 2024-02-28
          type: string
        style: form
      - description: "ISO 3166-1 alpha-2 country code (e.g., \"US\", \"GB\", \"FR\"\
          ). When provided, country-specific holidays are excluded from working days\
          \ count."
        explode: true
        in: query
        name: country
        required: false
        schema:
          example: US
          type: string
        style: form
      - description: "ISO 3166-2 subdivision code for state/region within the country\
          \ (e.g., \"NY\" for New York, \"CA\" for California). Only used when country\
          \ is provided."
        explode: true
        in: query
        name: subdivision
        required: false
        schema:
          example: NY
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              example:
                data:
                  working_days: 4
                  from: 2024-02-23
                  to: 2024-02-28
                  country: US
                  subdivision: NY
                metadata:
                  timestamp: 2026-01-01T00:00:00Z
              schema:
                $ref: "#/components/schemas/_v1_places_working_days_get_200_response"
          description: Successful response
        "400":
          description: "The from and to parameters are required, or to date is before\
            \ from date, or invalid date format"
      security:
      - requiems-api-key: []
      summary: Calculate Working Days
      tags:
      - working-days
  /v1/places/time/{timezone}:
    get:
      description: "Returns the current time for the given IANA timezone identifier.\
        \ The timezone is supplied as a path parameter (e.g. `America/New_York`, `Europe/London`,\
        \ `UTC`)."
