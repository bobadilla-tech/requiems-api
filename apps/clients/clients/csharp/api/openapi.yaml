                  current_time: 2024-12-15T14:30:00Z
                  is_dst: false
                metadata:
                  timestamp: 2024-12-15T14:30:00Z
              schema:
                $ref: "#/components/schemas/_v1_places_time__timezone__get_200_response"
          description: Successful response
