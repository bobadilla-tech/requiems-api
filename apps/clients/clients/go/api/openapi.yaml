        "200":
          content:
            application/json:
              example:
                data:
                  original: Te.st.User+spam@Googlemail.com
                  normalized: testuser@gmail.com
                  local: testuser
                  domain: gmail.com
                  changes:
                  - lowercased
                  - removed_dots
                  - removed_plus_tag
                  - canonicalised_domain
                metadata:
                  timestamp: 2026-01-01T00:00:00Z
              schema:
                $ref: "#/components/schemas/_v1_text_normalize_post_200_response"
          description: Successful response
