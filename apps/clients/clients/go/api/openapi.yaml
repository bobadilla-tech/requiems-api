    get:
      description: "Returns the current time for the given IANA timezone identifier.\
        \ The timezone is supplied as a path parameter (e.g. `America/New_York`, `Europe/London`,\
        \ `UTC`)."
      parameters:
      - description: "IANA timezone identifier (e.g. 'America/New_York', 'Europe/London',\
          \ 'Asia/Kolkata')"
        explode: false
        in: path
        name: timezone
        required: true
        schema:
          example: America/New_York
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              example:
                data:
                  timezone: America/New_York
                  offset: -05:00
                  current_time: 2024-12-15T14:30:00Z
                  is_dst: false
                metadata:
                  timestamp: 2024-12-15T14:30:00Z
              schema:
                $ref: "#/components/schemas/_v1_places_time__timezone__get_200_response"
          description: Successful response
      security:
      - requiems-api-key: []
      summary: Get Current Time by Timezone
      tags:
      - world-time
