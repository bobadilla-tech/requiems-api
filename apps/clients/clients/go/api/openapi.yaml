      tags:
      - email-normalize
  /v1/text/normalize/batch:
    post:
      description: "Normalizes up to 100 email addresses in one request. Results are\
        \ in the same order as the input. Each item includes valid (boolean); when\
        \ false, only original and message are set. Usage is billed per email processed\
        \ (see gateway usage headers)."
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/_v1_text_normalize_batch_post_request"
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                data:
                  results:
                  - original: user@example.com
                    normalized: user@example.com
                    local: user
                    domain: example.com
                    changes: []
                    valid: true
                  - original: not-an-email
                    valid: false
                    message: invalid email address
                  - original: te.st@gmail.com
                    normalized: test@gmail.com
                    local: test
                    domain: gmail.com
                    changes:
                    - lowercased
                    - removed_dots
                    valid: true
                  total: 3
                metadata:
                  timestamp: 2026-01-01T00:00:00Z
