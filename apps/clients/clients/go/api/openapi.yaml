        style: form
      - description: Longitude of the location (-180 to 180). Required when using
          coordinate-based lookup.
        explode: true
        in: query
        name: lon
        required: false
        schema:
          type: string
        style: form
      - description: "City name for city-based lookup (e.g. 'Tokyo', 'London'). Required\
          \ when not using coordinates."
        explode: true
        in: query
        name: city
        required: false
        schema:
          type: string
        style: form
