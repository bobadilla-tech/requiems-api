# Requiems API internal backend.
service: requiems-api

image: bobadilla-tech/requiems-api

volumes:
  - /home/deploy/vendor:/app/dbs

servers:
  web:
    hosts:
      - <%= ENV["HETZNER_VPS_IP"] %>
    options:
      network-alias: requiems-api

proxy:
  ssl: false
  host: requiems.xyz
  app_port: 8080
  forward_headers: true
  healthcheck:
    path: /healthz
  run:
    http_port: 8080
    https_port: 8443
    publish: true
    bind_ips:
      - 127.0.0.1

registry:
  server: ghcr.io
  username: <%= ENV["KAMAL_REGISTRY_USERNAME"] || "bobadilla-tech" %>
  password:
    - KAMAL_REGISTRY_PASSWORD

builder:
  context: apps/api
  dockerfile: infra/docker/api.Dockerfile
  arch: amd64

secrets_path: infra/kamal/secrets

ssh:
  user: deploy

env:
  clear:
    ENVIRONMENT: production
    PORT: "8080"
    LANGUAGETOOL_URL: http://languagetool:8010
    NOMINATIM_URL: https://nominatim.openstreetmap.org
    VPN_DATABASE_PATH: dbs/IP2PROXY-LITE-PX2.BIN
    VPN_ASN_DATABASE_PATH: dbs/GeoLite2-ASN.mmdb
    IP_CITY_DATABASE_PATH: dbs/GeoLite2-City.mmdb
    POSTAL_CODE_DB_PATH: dbs/postal_codes.txt
    CITIES_DB_PATH: dbs/cities15000.txt
  secret:
    - DATABASE_URL
    - REDIS_URL

# Go migrations run on boot (MigrateWithRetry), so allow extra time to become ready.
deploy_timeout: 120

accessories:
  db:
    service: db
    image: postgres:16-alpine
    host: <%= ENV["HETZNER_VPS_IP"] %>
    env:
      secret:
        - POSTGRES_USER
        - POSTGRES_PASSWORD
        - POSTGRES_DB
    directories:
      - data:/var/lib/postgresql/data

  redis:
    service: redis
    image: redis:7-alpine
    host: <%= ENV["HETZNER_VPS_IP"] %>
    # Set REDIS_MAXMEMORY in the deploy environment only after measuring
    # protected auth/quota state, Sidekiq, and bounded TTL disposable caches
    # with headroom. A missing value must stop the deploy rather than silently
    # enabling a placeholder capacity with noeviction.
    cmd: redis-server --maxmemory <%= ENV.fetch("REDIS_MAXMEMORY") %> --maxmemory-policy noeviction
    directories:
      - data:/data

  languagetool:
    service: languagetool
    image: erikvl87/languagetool
    host: <%= ENV["HETZNER_VPS_IP"] %>
    options:
      restart: unless-stopped

  caddy:
    service: caddy
    image: caddy:2-alpine
    host: <%= ENV["HETZNER_VPS_IP"] %>
    network: host
    files:
      - infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - infra/caddy/certs/cloudflare-origin-pull-ca.pem:/etc/caddy/certs/cloudflare-origin-pull-ca.pem:ro
    directories:
      - caddy_data:/data
      - caddy_config:/config
