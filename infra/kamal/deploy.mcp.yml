# Requiems API MCP server.
service: requiems-mcp

image: bobadilla-tech/requiems-mcp

servers:
  web:
    - <%= ENV["HETZNER_VPS_IP"] %>

proxy:
  ssl: false
  host: mcp.requiems.xyz
  app_port: 3000
  forward_headers: true
  healthcheck:
    path: /healthz
  run:
    http_port: 8080
    https_port: 8443
    publish: true
    bind_ips:
      - 127.0.0.1

registry:
  server: ghcr.io
  username: <%= ENV["KAMAL_REGISTRY_USERNAME"] || "bobadilla-tech" %>
  password:
    - KAMAL_REGISTRY_PASSWORD

builder:
  context: apps/mcp
  dockerfile: infra/docker/mcp.Dockerfile
  arch: amd64

secrets_path: infra/kamal/secrets

ssh:
  user: deploy

env:
  clear:
    REQUIEMS_BASE_URL: https://api.requiems.xyz
