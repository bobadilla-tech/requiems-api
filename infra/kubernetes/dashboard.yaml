---
# Rails Dashboard Service - ClusterIP for access via ingress
apiVersion: v1
kind: Service
metadata:
  name: dashboard
  namespace: requiem
  labels:
    app: dashboard
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 3000
      protocol: TCP
      name: http
  selector:
    app: dashboard

---
# Rails Dashboard Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard
  namespace: requiem
  labels:
    app: dashboard
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dashboard
  template:
    metadata:
      labels:
        app: dashboard
    spec:
      initContainers:
      - name: db-migrate
        image: requiem-dashboard:latest
        imagePullPolicy: IfNotPresent
        command: ["sh", "-c", "./bin/rails db:migrate"]
        env:
        - name: RAILS_ENV
          valueFrom:
            configMapKeyRef:
              name: requiem-config
              key: RAILS_ENV
        - name: POSTGRES_USER
          valueFrom:
            configMapKeyRef:
              name: requiem-config
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: requiem-secrets
              key: POSTGRES_PASSWORD
        - name: POSTGRES_HOST
          valueFrom:
            configMapKeyRef:
              name: requiem-config
              key: POSTGRES_HOST
        - name: POSTGRES_PORT
          valueFrom:
            configMapKeyRef:
              name: requiem-config
              key: POSTGRES_PORT
        - name: POSTGRES_DB
          valueFrom:
            configMapKeyRef:
              name: requiem-config
              key: POSTGRES_DB
        - name: DATABASE_URL
          value: postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(POSTGRES_HOST):$(POSTGRES_PORT)/$(POSTGRES_DB)?sslmode=disable
        - name: REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: requiem-config
              key: REDIS_HOST
        - name: REDIS_PORT
          valueFrom:
            configMapKeyRef:
              name: requiem-config
              key: REDIS_PORT
        - name: REDIS_URL
          value: redis://$(REDIS_HOST):$(REDIS_PORT)
        - name: SECRET_KEY_BASE
          valueFrom:
            secretKeyRef:
              name: requiem-secrets
              key: SECRET_KEY_BASE
        - name: RAILS_MASTER_KEY
          valueFrom:
            secretKeyRef:
              name: requiem-secrets
              key: RAILS_MASTER_KEY
        - name: CLOUDFLARE_ACCOUNT_ID
          valueFrom:
            secretKeyRef:
              name: requiem-secrets
              key: CLOUDFLARE_ACCOUNT_ID
        - name: CLOUDFLARE_KV_NAMESPACE_ID
          valueFrom:
            secretKeyRef:
              name: requiem-secrets
              key: CLOUDFLARE_KV_NAMESPACE_ID
        - name: CLOUDFLARE_API_TOKEN
          valueFrom:
            secretKeyRef:
              name: requiem-secrets
              key: CLOUDFLARE_API_TOKEN
      containers:
      - name: dashboard
        image: requiem-dashboard:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
          name: http
        env:
        - name: RAILS_ENV
          valueFrom:
            configMapKeyRef:
              name: requiem-config
              key: RAILS_ENV
        - name: POSTGRES_USER
          valueFrom:
            configMapKeyRef:
              name: requiem-config
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: requiem-secrets
              key: POSTGRES_PASSWORD
        - name: POSTGRES_HOST
          valueFrom:
            configMapKeyRef:
              name: requiem-config
              key: POSTGRES_HOST
        - name: POSTGRES_PORT
          valueFrom:
            configMapKeyRef:
              name: requiem-config
              key: POSTGRES_PORT
        - name: POSTGRES_DB
          valueFrom:
            configMapKeyRef:
              name: requiem-config
              key: POSTGRES_DB
        - name: DATABASE_URL
          value: postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(POSTGRES_HOST):$(POSTGRES_PORT)/$(POSTGRES_DB)?sslmode=disable
        - name: REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: requiem-config
              key: REDIS_HOST
        - name: REDIS_PORT
          valueFrom:
            configMapKeyRef:
              name: requiem-config
              key: REDIS_PORT
        - name: REDIS_URL
          value: redis://$(REDIS_HOST):$(REDIS_PORT)
        - name: SECRET_KEY_BASE
          valueFrom:
            secretKeyRef:
              name: requiem-secrets
              key: SECRET_KEY_BASE
        - name: RAILS_MASTER_KEY
          valueFrom:
            secretKeyRef:
              name: requiem-secrets
              key: RAILS_MASTER_KEY
        - name: CLOUDFLARE_ACCOUNT_ID
          valueFrom:
            secretKeyRef:
              name: requiem-secrets
              key: CLOUDFLARE_ACCOUNT_ID
        - name: CLOUDFLARE_KV_NAMESPACE_ID
          valueFrom:
            secretKeyRef:
              name: requiem-secrets
              key: CLOUDFLARE_KV_NAMESPACE_ID
        - name: CLOUDFLARE_API_TOKEN
          valueFrom:
            secretKeyRef:
              name: requiem-secrets
              key: CLOUDFLARE_API_TOKEN
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 60
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 5

---
# Sidekiq Deployment (no service needed - background jobs)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sidekiq
  namespace: requiem
  labels:
    app: sidekiq
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sidekiq
  template:
    metadata:
      labels:
        app: sidekiq
    spec:
      containers:
      - name: sidekiq
        image: requiem-dashboard:latest
        imagePullPolicy: IfNotPresent
        command: ["bundle", "exec", "sidekiq"]
        env:
        - name: RAILS_ENV
          valueFrom:
            configMapKeyRef:
              name: requiem-config
              key: RAILS_ENV
        - name: POSTGRES_USER
          valueFrom:
            configMapKeyRef:
              name: requiem-config
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: requiem-secrets
              key: POSTGRES_PASSWORD
        - name: POSTGRES_HOST
          valueFrom:
            configMapKeyRef:
              name: requiem-config
              key: POSTGRES_HOST
        - name: POSTGRES_PORT
          valueFrom:
            configMapKeyRef:
              name: requiem-config
              key: POSTGRES_PORT
        - name: POSTGRES_DB
          valueFrom:
            configMapKeyRef:
              name: requiem-config
              key: POSTGRES_DB
        - name: DATABASE_URL
          value: postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(POSTGRES_HOST):$(POSTGRES_PORT)/$(POSTGRES_DB)?sslmode=disable
        - name: REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: requiem-config
              key: REDIS_HOST
        - name: REDIS_PORT
          valueFrom:
            configMapKeyRef:
              name: requiem-config
              key: REDIS_PORT
        - name: REDIS_URL
          value: redis://$(REDIS_HOST):$(REDIS_PORT)
        - name: SECRET_KEY_BASE
          valueFrom:
            secretKeyRef:
              name: requiem-secrets
              key: SECRET_KEY_BASE
        - name: RAILS_MASTER_KEY
          valueFrom:
            secretKeyRef:
              name: requiem-secrets
              key: RAILS_MASTER_KEY
        - name: CLOUDFLARE_ACCOUNT_ID
          valueFrom:
            secretKeyRef:
              name: requiem-secrets
              key: CLOUDFLARE_ACCOUNT_ID
        - name: CLOUDFLARE_KV_NAMESPACE_ID
          valueFrom:
            secretKeyRef:
              name: requiem-secrets
              key: CLOUDFLARE_KV_NAMESPACE_ID
        - name: CLOUDFLARE_API_TOKEN
          valueFrom:
            secretKeyRef:
              name: requiem-secrets
              key: CLOUDFLARE_API_TOKEN
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
