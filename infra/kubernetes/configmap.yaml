apiVersion: v1
kind: ConfigMap
metadata:
  name: requiem-config
  namespace: requiem
data:
  # Database configuration
  POSTGRES_USER: requiem
  POSTGRES_DB: requiem
  POSTGRES_HOST: db
  POSTGRES_PORT: "5432"
  
  # Redis configuration
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  
  # API configuration
  PORT: "8080"
  
  # Rails configuration
  RAILS_ENV: production
