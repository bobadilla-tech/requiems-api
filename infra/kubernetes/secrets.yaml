apiVersion: v1
kind: Secret
metadata:
  name: requiem-secrets
  namespace: requiem
type: Opaque
stringData:
  # Database password
  # WARNING: Change this before deploying to production!
  # Generate with: openssl rand -base64 32
  POSTGRES_PASSWORD: requiem_change_me_in_production
  
  # Rails secrets
  # CRITICAL: Generate a new secret key base before deploying!
  # Generate with: openssl rand -hex 64
  SECRET_KEY_BASE: generate_new_secret_key_base_with_openssl_rand_hex_64
  
  # Rails master key (for encrypted credentials)
  # Generate with: openssl rand -hex 32
  RAILS_MASTER_KEY: generate_new_rails_master_key_with_openssl_rand_hex_32
  
  # Cloudflare credentials (set these in production)
  CLOUDFLARE_ACCOUNT_ID: ""
  CLOUDFLARE_KV_NAMESPACE_ID: ""
  CLOUDFLARE_API_TOKEN: ""
  
  # Backend secret for internal API authentication
  # Generate with: openssl rand -hex 32
  BACKEND_SECRET: generate_new_backend_secret_with_openssl_rand_hex_32
