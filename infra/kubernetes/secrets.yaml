apiVersion: v1
kind: Secret
metadata:
  name: requiem-secrets
  namespace: requiem
type: Opaque
stringData:
  # Database password
  POSTGRES_PASSWORD: requiem
  
  # Rails secrets (change these in production!)
  SECRET_KEY_BASE: changeme_in_production
  
  # Cloudflare credentials (set these in production)
  CLOUDFLARE_ACCOUNT_ID: ""
  CLOUDFLARE_KV_NAMESPACE_ID: ""
  CLOUDFLARE_API_TOKEN: ""
  
  # Backend secret for internal API authentication
  BACKEND_SECRET: ""
