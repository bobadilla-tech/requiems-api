---
# Ingress for external access to the dashboard
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: requiem-ingress
  namespace: requiem
  annotations:
    # Use nginx ingress controller or your preferred ingress
    kubernetes.io/ingress.class: nginx
    # Enable SSL/TLS redirect
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # Enable HTTPS
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
  - hosts:
    - requiems.xyz
    - internal.requiems.xyz
    secretName: requiem-tls
  rules:
  # Main dashboard and landing page
  - host: requiems.xyz
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: dashboard
            port:
              number: 80
  # Internal API (should be protected by X-Backend-Secret header)
  - host: internal.requiems.xyz
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: api
            port:
              number: 8080
