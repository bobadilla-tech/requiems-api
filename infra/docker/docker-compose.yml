name: requiem-backend

services:
  languagetool:
    image: erikvl87/languagetool
    restart: unless-stopped
    healthcheck:
      test: [
        "CMD-SHELL",
        "wget -qO- http://localhost:8010/v2/languages > /dev/null 2>&1",
      ]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    build:
      context: ../../apps/api
      dockerfile: ../../infra/docker/api.Dockerfile
    env_file: .env
    environment:
      - PORT=8080
      - ENVIRONMENT=production
    volumes:
      - /home/deploy/vendor:/app/dbs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      languagetool:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  mcp:
    build:
      context: ../../apps/mcp
      dockerfile: ../../infra/docker/mcp.Dockerfile
    env_file: .env
    environment:
      - MCP_TRANSPORT=http
      - MCP_HTTP_PORT=3000
      - REQUIEMS_BASE_URL=https://requiems.xyz
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://localhost:3000/healthz').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  db:
    image: postgres:16-alpine
    env_file: .env
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    # REDIS_MAXMEMORY is an explicit deployment input, not a tuned default.
    # Set it only after measuring protected auth/quota state, Sidekiq, and the
    # bounded TTL disposable caches with headroom; noeviction otherwise turns
    # memory pressure into rejected protected writes.
    command: >-
      sh -c 'test -n "$${REDIS_MAXMEMORY}" || { echo "REDIS_MAXMEMORY must be set after capacity validation" >&2; exit 1; }; exec redis-server --maxmemory "$${REDIS_MAXMEMORY}" --maxmemory-policy noeviction'
    environment:
      REDIS_MAXMEMORY: ${REDIS_MAXMEMORY:?set REDIS_MAXMEMORY after Redis capacity validation}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  dashboard:
    build:
      context: ../../apps/dashboard
      dockerfile: ../../infra/docker/dashboard.Dockerfile
      additional_contexts:
        scripts: ../../scripts
    env_file: .env
    environment:
      - RAILS_ENV=production
      - RAILS_LOG_LEVEL=warn
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    command: >
      sh -c "./bin/rails db:prepare &&
             ./bin/thrust ./bin/rails server"

  worker:
    build:
      context: ../../apps/dashboard
      dockerfile: ../../infra/docker/dashboard.Dockerfile
      additional_contexts:
        scripts: ../../scripts
    env_file: .env
    environment:
      - RAILS_ENV=production
      - RAILS_LOG_LEVEL=warn
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: bundle exec sidekiq

  caddy:
    image: caddy:2-alpine
    env_file: .env
    depends_on:
      - api
      - dashboard
      - mcp
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  db_data: {}
  redis_data: {}
  caddy_data: {}
  caddy_config: {}
