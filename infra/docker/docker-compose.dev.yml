name: requiem-dev

networks:
  stack:
    driver: bridge

services:
  db:
    image: postgres:16-alpine
    networks:
      - stack
    env_file:
      - .env.example
      - path: .env.local
        required: false
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U requiem"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    networks:
      - stack
    env_file:
      - .env.example
      - path: .env.local
        required: false
    # noeviction + an explicit maxmemory: auth-cache/rate-limit/quota state
    # (apikey:*, ratelimit:*, usage:*) must never be evicted under memory
    # pressure, and they now share this instance with disposable response
    # caches (geocode:*/crypto:*/exchange:*, TTL'd but otherwise unprotected
    # under noeviction — acceptable since they're small and TTL'd, but this
    # config does mean they lose any allkeys-lru-style protection a future
    # contributor might otherwise assume they have). At capacity, noeviction
    # doesn't drop data — Redis starts rejecting WRITE commands with "OOM
    # command not allowed" while reads keep succeeding; the rate
    # limiter/quota middleware (apps/api/platform/middleware) treat that
    # identically to a connection error/timeout, not as a separate case.
    # Development uses the bounded value in .env.example; production must set
    # REDIS_MAXMEMORY only after validating its shared workload capacity.
    # Read REDIS_MAXMEMORY inside the container so .env.local, supplied via
    # env_file, is available before Redis is started. Compose service env_file
    # values are not available to Compose-time interpolation.
    command: ["sh", "-c", "exec redis-server --maxmemory \"$${REDIS_MAXMEMORY:-256mb}\" --maxmemory-policy noeviction"]
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  languagetool:
    image: erikvl87/languagetool
    networks:
      - stack
    ports:
      - "8010:8010"
    restart: unless-stopped
    profiles:
      - languagetool
    healthcheck:
      test: [
        "CMD-SHELL",
        "wget -qO- http://localhost:8010/v2/languages > /dev/null 2>&1",
      ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    build:
      context: ../../apps/api
      dockerfile: ../../infra/docker/api.dev.Dockerfile
    networks:
      - stack
    working_dir: /app
    env_file:
      - .env.example
      - path: .env.local
        required: false
    volumes:
      - ../../apps/api:/app
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      languagetool:
        condition: service_healthy
        required: false

  mcp:
    build:
      context: ../../apps/mcp
      dockerfile: ../../infra/docker/mcp.dev.Dockerfile
    networks:
      - stack
    working_dir: /app
    command: >
      sh -c "
        bun install &&
        REQUIEMS_API_KEY=$$LOCAL_DEV_API_KEY bun run --watch src/server.ts
      "
    environment:
      - MCP_TRANSPORT=http
      - MCP_HTTP_PORT=3000
      - REQUIEMS_BASE_URL=http://api:8080
    env_file:
      - .env.example
      - path: .env.local
        required: false
    volumes:
      - ../../apps/mcp:/app
    ports:
      - "3100:3000"
    depends_on:
      api:
        condition: service_started

  dashboard:
    build:
      context: ../../apps/dashboard
      dockerfile: ../../infra/docker/dashboard.dev.Dockerfile
    networks:
      - stack
    working_dir: /app
    command: >
      sh -c "
        bundle exec rails db:create db:migrate db:seed &&
        bundle exec rails tailwindcss:build &&
        rm -f tmp/pids/server.pid &&
        bundle exec rails server -b 0.0.0.0 -p 3000
      "
    env_file:
      - .env.example
      - path: .env.local
        required: false
    volumes:
      - ../../apps/dashboard:/app
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started
    stdin_open: true
    tty: true

  sidekiq:
    build:
      context: ../../apps/dashboard
      dockerfile: ../../infra/docker/dashboard.dev.Dockerfile
    networks:
      - stack
    working_dir: /app
    command: >
      sh -c "
        bundle exec sidekiq
      "
    env_file:
      - .env.example
      - path: .env.local
        required: false
    volumes:
      - ../../apps/dashboard:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      dashboard:
        condition: service_started
      api:
        condition: service_started

volumes:
  db_data:
  redis_data:
