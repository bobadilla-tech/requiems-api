name: Kamal Deploy
description: Build, push, and deploy an app to the VPS with Kamal.

inputs:
  config:
    description: "Path to the Kamal deploy config (e.g. infra/kamal/deploy.api.yml)"
    required: true
  required-secrets:
    description: "Space-separated env var names that must be non-empty before deploying"
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Set up Ruby
      uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b
      with:
        ruby-version: "3.4"

    - name: Install Kamal
      shell: bash
      run: BUNDLE_GEMFILE="$GITHUB_WORKSPACE/infra/kamal/Gemfile" bundle install

    - name: Configure SSH
      shell: bash
      run: |
        mkdir -p ~/.ssh
        printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
        chmod 600 ~/.ssh/id_ed25519
        printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
        chmod 644 ~/.ssh/known_hosts

    - name: Verify required secrets
      shell: bash
      run: |
        for var in ${{ inputs.required-secrets }}; do
          if [ -z "${!var}" ]; then
            echo "::error::Missing required secret: $var"
            exit 1
          fi
        done

    - name: Remove legacy Caddy container
      if: inputs.config == 'infra/kamal/deploy.api.yml'
      shell: bash
      run: |
        ssh -o BatchMode=yes "deploy@$HETZNER_VPS_IP" 'service_label=$(docker inspect -f "{{ index .Config.Labels \"service\" }}" caddy 2>/dev/null || true); if [ "$service_label" != "caddy" ] && docker inspect caddy >/dev/null 2>&1; then docker rm --force caddy; fi'

    - name: Bootstrap and deploy
      shell: bash
      run: BUNDLE_GEMFILE="$GITHUB_WORKSPACE/infra/kamal/Gemfile" bundle exec kamal setup -c ${{ inputs.config }}
