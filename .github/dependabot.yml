version: 2

updates:
  # ── GitHub Actions ────────────────────────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # ── Go (apps/api) ─────────────────────────────────────────────────────────
  - package-ecosystem: "gomod"
    directory: "/apps/api"
    schedule:
      interval: "weekly"

  # ── Ruby / Rails (apps/dashboard) ─────────────────────────────────────────
  - package-ecosystem: "bundler"
    directory: "/apps/dashboard"
    schedule:
      interval: "weekly"

  # ── Tutorials (apps/tutorials) ────────────────────────────────────────────
  - package-ecosystem: "npm"
    directory: "/apps/tutorials/nextjs-email-validation"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # ── SDK clients & example apps (apps/clients) ─────────────────────────────
  - package-ecosystem: "gomod"
    directory: "/apps/clients/clients/go"
    schedule:
      interval: "weekly"
  - package-ecosystem: "pip"
    directory: "/apps/clients/clients/python"
    schedule:
      interval: "weekly"
  - package-ecosystem: "bundler"
    directory: "/apps/clients/clients/ruby"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/apps/clients/clients/typescript"
    schedule:
      interval: "weekly"
  - package-ecosystem: "gomod"
    directory: "/apps/clients/example-apps/go"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/apps/clients/example-apps/typescript"
    schedule:
      interval: "weekly"

  # ── Agent skills (apps/skills) ────────────────────────────────────────────
  - package-ecosystem: "npm"
    directory: "/apps/skills"
    schedule:
      interval: "weekly"
