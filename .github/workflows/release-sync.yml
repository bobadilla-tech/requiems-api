name: Release Sync

# Runs when a release is published (instead of on a cron). Each job opens a PR
# only when its output actually changed:
#   - clients: regenerate the OpenAPI SDKs (apps/clients), version bump
#   - skills:  regenerate the agent skills (apps/skills) from the api_docs YAML
# Merging those PRs triggers the publish workflows (publish-skills.yml, and
# publish-clients.yml once publishing is implemented).

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-sync
  cancel-in-progress: false

# PRs opened with the default GITHUB_TOKEN do not trigger workflows, so the
# required "CI Success" check never reports and the PR cannot merge. Set a
# SYNC_PR_TOKEN secret (fine-grained PAT or GitHub App token with contents +
# pull-requests write) so CI runs on the generated PRs and auto-merge works.
env:
  HAS_PR_TOKEN: ${{ secrets.SYNC_PR_TOKEN != '' }}

jobs:
  clients:
    name: Regenerate Clients
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/clients
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"

      - uses: actions/setup-go@v7
        with:
          go-version: "1.22.x"

      - name: Download the latest OpenAPI spec
        run: curl -fsSL https://requiems.xyz/openapi.json -o "$RUNNER_TEMP/openapi.json"

      - name: Generate clients and bump version
        id: process_clients
        run: |
          CURRENT_VERSION=$(cat VERSION 2>/dev/null | xargs || echo "1.0.0")
          echo "Current version: $CURRENT_VERSION"

          generate_clients() {
            local ver=$1
            local props="npmName=api-client,packageVersion=$ver,npmVersion=$ver,gemVersion=$ver,targetFramework=net8.0"
            # Wipe previous output so files for renamed/removed API tags don't linger
            rm -rf clients/typescript clients/csharp clients/python clients/ruby clients/go
            npx @openapitools/openapi-generator-cli generate -i "$RUNNER_TEMP/openapi.json" -g typescript-axios -o clients/typescript -p $props
            npx @openapitools/openapi-generator-cli generate -i "$RUNNER_TEMP/openapi.json" -g csharp -o clients/csharp -p $props,library=httpclient
            npx @openapitools/openapi-generator-cli generate -i "$RUNNER_TEMP/openapi.json" -g python -o clients/python -p $props
            npx @openapitools/openapi-generator-cli generate -i "$RUNNER_TEMP/openapi.json" -g ruby -o clients/ruby -p $props
            npx @openapitools/openapi-generator-cli generate -i "$RUNNER_TEMP/openapi.json" -g go -o clients/go -p $props
          }

          generate_clients $CURRENT_VERSION

          if [ -n "$(git status --porcelain -- clients/)" ]; then
            IFS='.' read -r major minor patch <<< "$CURRENT_VERSION"
            NEW_VERSION="${major}.${minor}.$((patch+1))"
            echo $NEW_VERSION > VERSION
            generate_clients $NEW_VERSION
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      # Build/typecheck only: running the example apps would hit the live API.
      - name: Smoke tests (build only)
        if: steps.process_clients.outputs.has_changes == 'true'
        run: |
          set -e
          (cd clients/typescript && npm install && npm run build)
          (cd example-apps/typescript && npm install && npx tsc --noEmit)
          (cd example-apps/csharp && dotnet build)
          (cd example-apps/python && pip install urllib3 pydantic python-dateutil aiohttp && PYTHONPATH=../../clients/python python -c "import openapi_client; openapi_client.AdviceApi")
          (cd example-apps/ruby && gem install typhoeus && ruby -I ../../clients/ruby/lib -e "require 'openapi_client'; OpenapiClient::AdviceApi")
          (cd clients/go && rm -rf test go.mod go.sum && go mod init openapi && go mod tidy)
          (cd example-apps/go && go mod tidy && go build -o /dev/null .)

      - name: Open pull request
        id: cpr
        if: steps.process_clients.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.SYNC_PR_TOKEN || secrets.GITHUB_TOKEN }}
          commit-message: "chore: regenerate OpenAPI clients"
          title: "Automated: regenerate API clients"
          body: |
            Regenerated after release ${{ github.event.release.tag_name || '(manual run)' }}: the OpenAPI spec changed.

            - Clients regenerated for TypeScript, C#, Python, Ruby and Go.
            - Version bump applied (`apps/clients/VERSION`).
            - Build-only smoke tests passed in the workflow run (example apps are not run against the live API).

            Merging this PR triggers `publish-clients.yml`.
          add-paths: apps/clients
          branch: "chore/automated-client-regeneration"
          base: "main"
          delete-branch: true

      - name: Enable auto-merge
        if: steps.cpr.outputs.pull-request-number != '' && env.HAS_PR_TOKEN == 'true'
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.SYNC_PR_TOKEN }}
        run: gh pr merge --auto --squash "${{ steps.cpr.outputs.pull-request-number }}" --repo "$GITHUB_REPOSITORY"

  skills:
    name: Regenerate Skills
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-node@v7
        with:
          node-version-file: apps/skills/.nvmrc
          cache: npm
          cache-dependency-path: apps/skills/package-lock.json

      - name: Install dependencies
        working-directory: apps/skills
        run: npm ci

      - name: Regenerate skills
        working-directory: apps/skills
        run: node scripts/build/index.ts --source ../dashboard/config/api_docs --output ./skills

      - name: Detect changes
        id: diff
        run: |
          if [ -n "$(git status --porcelain -- apps/skills/skills/)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump patch version
        if: steps.diff.outputs.changed == 'true'
        working-directory: apps/skills
        run: npm version patch --no-git-tag-version

      - name: Build PR body
        if: steps.diff.outputs.changed == 'true'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: .github/scripts/build-skills-pr-body.sh "$RUNNER_TEMP/pr-body.md"

      - name: Open pull request
        id: cpr
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.SYNC_PR_TOKEN || secrets.GITHUB_TOKEN }}
          commit-message: "chore: regenerate skills from api_docs"
          title: "Automated: regenerate agent skills"
          body-path: ${{ runner.temp }}/pr-body.md
          add-paths: apps/skills
          branch: "chore/automated-skill-regeneration"
          base: "main"
          delete-branch: true

      - name: Enable auto-merge
        if: steps.cpr.outputs.pull-request-number != '' && env.HAS_PR_TOKEN == 'true'
        env:
          GH_TOKEN: ${{ secrets.SYNC_PR_TOKEN }}
        run: gh pr merge --auto --squash "${{ steps.cpr.outputs.pull-request-number }}" --repo "$GITHUB_REPOSITORY"
