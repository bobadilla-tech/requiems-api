name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - ".gitignore"
      - "*.md"
      - "**/*.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - ".gitignore"
      - "*.md"
      - "**/*.md"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    name: Detect Changed Apps
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      dashboard: ${{ steps.filter.outputs.dashboard }}
      auth-gateway: ${{ steps.filter.outputs.auth-gateway }}
      api-management: ${{ steps.filter.outputs.api-management }}
    steps:
      - uses: actions/checkout@v6

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            api:
              - 'apps/api/**'
              - '.github/workflows/ci.yml'
            dashboard:
              - 'apps/dashboard/**'
              - '.github/workflows/ci.yml'
            auth-gateway:
              - 'apps/workers/auth-gateway/**'
              - 'apps/workers/shared/**'
              - '.github/workflows/ci.yml'
            api-management:
              - 'apps/workers/api-management/**'
              - 'apps/workers/shared/**'
              - '.github/workflows/ci.yml'

  go-test:
    name: Go Tests
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.api == 'true'
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/api

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: requiem
          POSTGRES_PASSWORD: requiem
          POSTGRES_DB: requiem_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache-dependency-path: apps/api/go.sum

      - name: Load env defaults
        working-directory: .
        run: grep -v '^#' infra/docker/.env.example | grep -v '^$' | grep -v '=\s*$' >> $GITHUB_ENV

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        env:
          DATABASE_URL: postgres://requiem:requiem@localhost:5432/requiem_test?sslmode=disable
          BACKEND_SECRET: test_secret_min_32_chars_long_for_testing_only
          REDIS_URL: redis://127.0.0.1:6379/0
        run: go test -race -coverprofile=coverage.out ./...

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: apps/api/coverage.out
          flags: go

  # Advisory: skipped for Dependabot PRs (dep updates don't change code style)
  go-lint:
    name: Go Lint (Advisory)
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.api == 'true' && github.actor != 'dependabot[bot]'
    continue-on-error: true

    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache-dependency-path: apps/api/go.sum

      - name: Download dependencies
        working-directory: apps/api
        run: go mod download

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.10
          working-directory: apps/api

  rails-test:
    name: Rails Tests
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.dashboard == 'true'
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: requiem
          POSTGRES_PASSWORD: requiem
          POSTGRES_DB: requiem_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4.8"
          bundler-cache: true
          working-directory: apps/dashboard

      - name: Load env defaults
        run: grep -v '^#' infra/docker/.env.example | grep -v '^$' | grep -v '=\s*$' >> $GITHUB_ENV

      - name: Setup test database
        working-directory: apps/dashboard
        env:
          RAILS_ENV: test
          DATABASE_URL: postgres://requiem:requiem@localhost:5432/requiem_test?sslmode=disable
          REDIS_URL: redis://localhost:6379
        run: |
          bin/rails db:create
          bin/rails db:schema:load

      - name: Run tests
        working-directory: apps/dashboard
        env:
          RAILS_ENV: test
          DATABASE_URL: postgres://requiem:requiem@localhost:5432/requiem_test?sslmode=disable
          REDIS_URL: redis://localhost:6379
          BACKEND_SECRET: test_secret_min_32_chars_long_for_testing_only
        run: bin/rails test

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: apps/dashboard/coverage/lcov/dashboard.lcov
          flags: rails

  # Combines former rails-security + rails-lint into one runner.
  # Saves one Ruby setup (~3 min) per Rails PR touch.
  # Brakeman/audit are blocking; RuboCop is advisory (step-level continue-on-error).
  rails-checks:
    name: Rails Security & Lint
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.dashboard == 'true'

    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop

    steps:
      - uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4.8"
          bundler-cache: true
          working-directory: apps/dashboard

      - name: Brakeman security scan
        working-directory: apps/dashboard
        run: bundle exec brakeman --no-pager --format json --output brakeman.json || true

      - name: Upload Brakeman results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: brakeman-results
          path: apps/dashboard/brakeman.json

      - name: Bundler audit
        working-directory: apps/dashboard
        run: bundle exec bundler-audit

      - name: Importmap audit
        working-directory: apps/dashboard
        run: bin/importmap audit

      # Advisory: skipped for Dependabot PRs (dep updates don't change code style)
      - name: Cache RuboCop
        if: github.actor != 'dependabot[bot]'
        uses: actions/cache@v5
        with:
          path: apps/dashboard/tmp/rubocop
          key: rubocop-${{ runner.os }}-${{ hashFiles('apps/dashboard/.rubocop.yml', 'apps/dashboard/Gemfile.lock') }}
          restore-keys: |
            rubocop-${{ runner.os }}-

      - name: RuboCop
        if: github.actor != 'dependabot[bot]'
        working-directory: apps/dashboard
        continue-on-error: true # Non-blocking
        run: bundle exec rubocop

  # Combines former worker-typecheck + worker-test + worker-lint into one runner.
  # Saves 2× runner startup + pnpm install (~4 min) per auth-gateway PR touch.
  # Typecheck runs first → fast failure on type errors before slow test suite.
  # Biome lint is advisory (step-level continue-on-error), skipped for Dependabot.
  # Bug fix: cache key now includes shared lockfile so shared dep changes invalidate cache.
  worker-test:
    name: Worker Tests
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.auth-gateway == 'true'
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: "10.26.0"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "pnpm"
          # Include shared lockfile: shared dep changes now correctly invalidate cache
          cache-dependency-path: |
            apps/workers/shared/pnpm-lock.yaml
            apps/workers/auth-gateway/pnpm-lock.yaml

      - name: Install shared dependencies
        working-directory: apps/workers/shared
        run: pnpm install --frozen-lockfile

      - name: Install dependencies
        working-directory: apps/workers/auth-gateway
        run: pnpm install --frozen-lockfile

      - name: TypeScript check
        working-directory: apps/workers/auth-gateway
        run: pnpm run typecheck

      - name: Run tests with coverage
        working-directory: apps/workers/auth-gateway
        run: pnpm exec vitest run --coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: apps/workers/auth-gateway/coverage/lcov.info
          flags: auth-gateway

      - name: Upload shared coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: apps/workers/auth-gateway/coverage/lcov.info
          flags: shared

      # Advisory: skipped for Dependabot PRs
      - name: Biome lint
        if: github.actor != 'dependabot[bot]'
        working-directory: apps/workers/auth-gateway
        continue-on-error: true # Non-blocking
        run: pnpm run lint

      - name: Biome format check
        if: github.actor != 'dependabot[bot]'
        working-directory: apps/workers/auth-gateway
        continue-on-error: true # Non-blocking
        run: pnpm run format:check

  # Combines former api-management-typecheck + api-management-test into one runner.
  # Saves 1× runner startup + pnpm install (~2 min) per api-management PR touch.
  # Bug fix: cache key now includes shared lockfile.
  api-management-test:
    name: API Management Tests
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.api-management == 'true'
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: "10.26.0"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "pnpm"
          # Include shared lockfile: shared dep changes now correctly invalidate cache
          cache-dependency-path: |
            apps/workers/shared/pnpm-lock.yaml
            apps/workers/api-management/pnpm-lock.yaml

      - name: Install shared dependencies
        working-directory: apps/workers/shared
        run: pnpm install --frozen-lockfile

      - name: Install dependencies
        working-directory: apps/workers/api-management
        run: pnpm install --frozen-lockfile

      - name: TypeScript check
        working-directory: apps/workers/api-management
        run: pnpm run typecheck

      - name: Run tests with coverage
        working-directory: apps/workers/api-management
        run: pnpm exec vitest run --coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: apps/workers/api-management/coverage/lcov.info
          flags: api-management

      - name: Upload shared coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: apps/workers/api-management/coverage/lcov.info
          flags: shared

  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs:
      - detect-changes
      - go-test
      - rails-test
      - rails-checks
      - worker-test
      - api-management-test
    if: always()

    steps:
      - name: Check all required jobs
        run: |
          if [[ "${{ needs.go-test.result }}" == "failure" ]]; then
            echo "❌ Go tests failed"
            exit 1
          fi

          if [[ "${{ needs.rails-test.result }}" == "failure" ]]; then
            echo "❌ Rails tests failed"
            exit 1
          fi

          if [[ "${{ needs.rails-checks.result }}" == "failure" ]]; then
            echo "❌ Rails security checks failed"
            exit 1
          fi

          if [[ "${{ needs.worker-test.result }}" == "failure" ]]; then
            echo "❌ Worker tests failed"
            exit 1
          fi

          if [[ "${{ needs.api-management-test.result }}" == "failure" ]]; then
            echo "❌ API Management tests failed"
            exit 1
          fi

          echo "✅ All required checks passed!"
