name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - ".gitignore"
      - "*.md"
      - "**/*.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - ".gitignore"
      - "*.md"
      - "**/*.md"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    name: Detect Changed Apps
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      dashboard: ${{ steps.filter.outputs.dashboard }}
      auth-gateway: ${{ steps.filter.outputs.auth-gateway }}
      api-management: ${{ steps.filter.outputs.api-management }}
      mcp: ${{ steps.filter.outputs.mcp }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            api:
              - 'apps/api/**'
              - '.github/workflows/ci.yml'
            dashboard:
              - 'apps/dashboard/**'
              - '.github/workflows/ci.yml'
            auth-gateway:
              - 'apps/workers/auth-gateway/**'
              - 'apps/workers/shared/**'
              - '.github/workflows/ci.yml'
            api-management:
              - 'apps/workers/api-management/**'
              - 'apps/workers/shared/**'
              - '.github/workflows/ci.yml'
            mcp:
              - 'apps/mcp/**'
              - '.github/workflows/ci.yml'

  go-test:
    name: Go Tests
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.api == 'true'
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/api

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: requiem
          POSTGRES_PASSWORD: requiem
          POSTGRES_DB: requiem_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache-dependency-path: apps/api/go.sum

      - name: Cache Go build
        uses: actions/cache@v6
        with:
          path: ~/.cache/go-build
          key: go-build-${{ runner.os }}-${{ hashFiles('apps/api/go.sum') }}
          restore-keys: go-build-${{ runner.os }}-

      - name: Load env defaults
        working-directory: .
        run: grep -v '^#' infra/docker/.env.example | grep -v '^$' | grep -v '=\s*$' >> $GITHUB_ENV

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        env:
          DATABASE_URL: postgres://requiem:requiem@localhost:5432/requiem_test?sslmode=disable
          BACKEND_SECRET: test_secret_min_32_chars_long_for_testing_only
          REDIS_URL: redis://127.0.0.1:6379/0
        run: go test -race -coverprofile=coverage.out ./...

      - name: Upload coverage to Codecov
        if: github.actor != 'dependabot[bot]'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: apps/api/coverage.out
          flags: go
          fail_ci_if_error: false

  go-lint:
    name: Go Lint (Advisory)
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.api == 'true' && github.actor != 'dependabot[bot]'
    continue-on-error: true

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache-dependency-path: apps/api/go.sum

      - name: Cache Go build
        uses: actions/cache@v6
        with:
          path: ~/.cache/go-build
          key: go-build-${{ runner.os }}-${{ hashFiles('apps/api/go.sum') }}
          restore-keys: go-build-${{ runner.os }}-

      - name: Download dependencies
        working-directory: apps/api
        run: go mod download

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.10
          working-directory: apps/api

  rails-test:
    name: Rails Tests
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.dashboard == 'true'
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: requiem
          POSTGRES_PASSWORD: requiem
          POSTGRES_DB: requiem_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4.8"
          bundler-cache: true
          working-directory: apps/dashboard

      - name: Cache Rails bootsnap
        uses: actions/cache@v6
        with:
          path: apps/dashboard/tmp/cache
          key: bootsnap-${{ runner.os }}-ruby3.4.8-${{ hashFiles('apps/dashboard/Gemfile.lock') }}
          restore-keys: bootsnap-${{ runner.os }}-ruby3.4.8-

      - name: Load env defaults
        run: grep -v '^#' infra/docker/.env.example | grep -v '^$' | grep -v '=\s*$' >> $GITHUB_ENV

      - name: Setup test database
        working-directory: apps/dashboard
        env:
          RAILS_ENV: test
          DATABASE_URL: postgres://requiem:requiem@localhost:5432/requiem_test?sslmode=disable
          REDIS_URL: redis://localhost:6379
          BACKEND_SECRET: test_secret_min_32_chars_long_for_testing_only
        run: bin/rails db:prepare

      - name: Run tests
        working-directory: apps/dashboard
        env:
          RAILS_ENV: test
          DATABASE_URL: postgres://requiem:requiem@localhost:5432/requiem_test?sslmode=disable
          REDIS_URL: redis://localhost:6379
          BACKEND_SECRET: test_secret_min_32_chars_long_for_testing_only
        run: bin/rails test

      - name: Check for missing translations
        working-directory: apps/dashboard
        run: bundle exec i18n-tasks missing

      - name: Upload coverage to Codecov
        if: github.actor != 'dependabot[bot]'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: apps/dashboard/coverage/lcov/dashboard.lcov
          flags: rails
          fail_ci_if_error: false

  rails-checks:
    name: Rails Security & Lint
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.dashboard == 'true'

    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop

    steps:
      - uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4.8"
          bundler-cache: true
          working-directory: apps/dashboard

      - name: Cache Rails bootsnap
        uses: actions/cache@v6
        with:
          path: apps/dashboard/tmp/cache
          key: bootsnap-${{ runner.os }}-ruby3.4.8-${{ hashFiles('apps/dashboard/Gemfile.lock') }}
          restore-keys: bootsnap-${{ runner.os }}-ruby3.4.8-

      - name: Brakeman security scan
        working-directory: apps/dashboard
        run: bundle exec brakeman --no-pager --format json --output brakeman.json || true

      - name: Upload Brakeman results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: brakeman-results
          path: apps/dashboard/brakeman.json

      - name: Bundler audit
        working-directory: apps/dashboard
        run: bundle exec bundler-audit

      - name: Importmap audit
        working-directory: apps/dashboard
        run: bin/importmap audit

      - name: Cache RuboCop
        if: github.actor != 'dependabot[bot]'
        uses: actions/cache@v6
        with:
          path: apps/dashboard/tmp/rubocop
          key: rubocop-${{ runner.os }}-${{ hashFiles('apps/dashboard/.rubocop.yml', 'apps/dashboard/Gemfile.lock') }}
          restore-keys: |
            rubocop-${{ runner.os }}-

      - name: RuboCop
        if: github.actor != 'dependabot[bot]'
        working-directory: apps/dashboard
        continue-on-error: true # Non-blocking
        run: bundle exec rubocop

  worker-test:
    name: Worker Tests
    needs: detect-changes
    if: needs.detect-changes.outputs.auth-gateway == 'true'
    uses: ./.github/workflows/_worker-ci.yml
    with:
      app-path: apps/workers/auth-gateway
      app-name: auth-gateway
      has-lint: true
    secrets: inherit

  api-management-test:
    name: API Management Tests
    needs: detect-changes
    if: needs.detect-changes.outputs.api-management == 'true'
    uses: ./.github/workflows/_worker-ci.yml
    with:
      app-path: apps/workers/api-management
      app-name: api-management
      has-lint: true
    secrets: inherit

  mcp-test:
    name: MCP Tests
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.mcp == 'true'
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/mcp

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Run tests
        run: bun test

  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs:
      - detect-changes
      - go-test
      - rails-test
      - rails-checks
      - worker-test
      - api-management-test
      - mcp-test
    if: always()

    steps:
      - name: Check all required jobs
        run: |
          if [[ "${{ needs.go-test.result }}" == "failure" ]]; then
            echo "❌ Go tests failed"
            exit 1
          fi

          if [[ "${{ needs.rails-test.result }}" == "failure" ]]; then
            echo "❌ Rails tests failed"
            exit 1
          fi

          if [[ "${{ needs.rails-checks.result }}" == "failure" ]]; then
            echo "❌ Rails security checks failed"
            exit 1
          fi

          if [[ "${{ needs.worker-test.result }}" == "failure" ]]; then
            echo "❌ Worker tests failed"
            exit 1
          fi

          if [[ "${{ needs.api-management-test.result }}" == "failure" ]]; then
            echo "❌ API Management tests failed"
            exit 1
          fi

          if [[ "${{ needs.mcp-test.result }}" == "failure" ]]; then
            echo "❌ MCP tests failed"
            exit 1
          fi

          echo "✅ All required checks passed!"
