name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - ".gitignore"
      - "*.md"
      - "**/*.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - ".gitignore"
      - "*.md"
      - "**/*.md"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    name: Detect Changed Apps
    runs-on: ubuntu-24.04
    outputs:
      api: ${{ steps.filter.outputs.api }}
      dashboard: ${{ steps.filter.outputs.dashboard }}
      mcp: ${{ steps.filter.outputs.mcp }}
      tutorials: ${{ steps.filter.outputs.tutorials }}
      clients: ${{ steps.filter.outputs.clients }}
      skills: ${{ steps.filter.outputs.skills }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            api:
              - 'apps/api/**'
              - '.github/workflows/ci.yml'
            dashboard:
              - 'apps/dashboard/**'
              - 'apps/api/platform/middleware/testdata/**'
              - '.github/workflows/ci.yml'
            mcp:
              - 'apps/mcp/**'
              - '.github/workflows/ci.yml'
            tutorials:
              - 'apps/tutorials/**'
              - '.github/workflows/ci.yml'
            clients:
              - 'apps/clients/**'
              - '.github/workflows/ci.yml'
            skills:
              - 'apps/skills/**'
              - '.github/workflows/ci.yml'

  go-test:
    name: Go Tests
    runs-on: ubuntu-24.04
    needs: detect-changes
    if: needs.detect-changes.outputs.api == 'true'
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/api

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: requiem
          POSTGRES_PASSWORD: requiem
          POSTGRES_DB: requiem_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache-dependency-path: apps/api/go.sum

      - name: Cache Go build
        uses: actions/cache@v6
        with:
          path: ~/.cache/go-build
          key: go-build-${{ runner.os }}-${{ hashFiles('apps/api/go.sum') }}
          restore-keys: go-build-${{ runner.os }}-

      - name: Load env defaults
        working-directory: .
        run: grep -v '^#' infra/docker/.env.example | grep -v '^$' | grep -v '=\s*$' >> $GITHUB_ENV

      - name: Download dependencies
        run: go mod download

      - name: Create dedicated migration test database
        # app_test.go is the only test that runs golang-migrate's real
        # migrations (via App.New -> db.MigrateWithRetry). Several
        # services/*/*_integration_test.go files independently run their own
        # `CREATE TABLE IF NOT EXISTS` for the same tables those migrations
        # create (e.g. swift_codes) as a self-sufficiency fallback for
        # running that one package in isolation. go test ./... runs packages
        # concurrently by default, so if both hit the same database, they
        # race on table creation — Postgres doesn't make CREATE TABLE (IF NOT
        # EXISTS) safe against a genuinely concurrent CREATE. Giving
        # app_test.go's migration bootstrap (TEST_DATABASE_URL, which it
        # already prefers) its own database keeps it out of that race,
        # mirroring infra/docker/postgres-init/01-create-test-db.sh's
        # existing Rails-vs-Go database split for the same reason.
        env:
          PGPASSWORD: requiem
        run: psql -h localhost -U requiem -d requiem_test -c "CREATE DATABASE requiem_migrate_test"

      - name: Run tests
        env:
          DATABASE_URL: postgres://requiem:requiem@localhost:5432/requiem_test?sslmode=disable
          TEST_DATABASE_URL: postgres://requiem:requiem@localhost:5432/requiem_migrate_test?sslmode=disable
          REDIS_URL: redis://127.0.0.1:6379/0
        run: go test -race -coverprofile=coverage.out ./...

      - name: Upload coverage to Codecov
        if: github.actor != 'dependabot[bot]'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: apps/api/coverage.out
          flags: go
          fail_ci_if_error: false

  go-lint:
    name: Go Lint (Advisory)
    runs-on: ubuntu-24.04
    needs: detect-changes
    if: needs.detect-changes.outputs.api == 'true' && github.actor != 'dependabot[bot]'
    continue-on-error: true

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache-dependency-path: apps/api/go.sum

      - name: Cache Go build
        uses: actions/cache@v6
        with:
          path: ~/.cache/go-build
          key: go-build-${{ runner.os }}-${{ hashFiles('apps/api/go.sum') }}
          restore-keys: go-build-${{ runner.os }}-

      - name: Download dependencies
        working-directory: apps/api
        run: go mod download

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.10
          working-directory: apps/api

  rails-test:
    name: Rails Tests
    runs-on: ubuntu-24.04
    needs: detect-changes
    if: needs.detect-changes.outputs.dashboard == 'true'
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: requiem
          POSTGRES_PASSWORD: requiem
          POSTGRES_DB: requiem_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4.8"
          bundler-cache: true
          working-directory: apps/dashboard

      - name: Cache Rails bootsnap
        uses: actions/cache@v6
        with:
          path: apps/dashboard/tmp/cache
          key: bootsnap-${{ runner.os }}-ruby3.4.8-${{ hashFiles('apps/dashboard/Gemfile.lock') }}
          restore-keys: bootsnap-${{ runner.os }}-ruby3.4.8-

      - name: Load env defaults
        run: grep -v '^#' infra/docker/.env.example | grep -v '^$' | grep -v '=\s*$' >> $GITHUB_ENV

      - name: Setup test database
        working-directory: apps/dashboard
        env:
          RAILS_ENV: test
          DATABASE_URL: postgres://requiem:requiem@localhost:5432/requiem_test?sslmode=disable
          REDIS_URL: redis://localhost:6379
        run: bin/rails db:prepare

      - name: Run tests
        working-directory: apps/dashboard
        env:
          RAILS_ENV: test
          DATABASE_URL: postgres://requiem:requiem@localhost:5432/requiem_test?sslmode=disable
          REDIS_URL: redis://localhost:6379
        run: bin/rails test

      - name: Check for missing translations
        working-directory: apps/dashboard
        run: bundle exec i18n-tasks missing

      - name: Upload coverage to Codecov
        if: github.actor != 'dependabot[bot]'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: apps/dashboard/coverage/lcov/dashboard.lcov
          flags: rails
          fail_ci_if_error: false

  rails-checks:
    name: Rails Security & Lint
    runs-on: ubuntu-24.04
    needs: detect-changes
    if: needs.detect-changes.outputs.dashboard == 'true'

    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop

    steps:
      - uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4.8"
          bundler-cache: true
          working-directory: apps/dashboard

      - name: Cache Rails bootsnap
        uses: actions/cache@v6
        with:
          path: apps/dashboard/tmp/cache
          key: bootsnap-${{ runner.os }}-ruby3.4.8-${{ hashFiles('apps/dashboard/Gemfile.lock') }}
          restore-keys: bootsnap-${{ runner.os }}-ruby3.4.8-

      - name: Brakeman security scan
        working-directory: apps/dashboard
        run: bundle exec brakeman --no-pager --format json --output brakeman.json || true

      - name: Upload Brakeman results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: brakeman-results
          path: apps/dashboard/brakeman.json

      - name: Bundler audit
        working-directory: apps/dashboard
        run: bundle exec bundler-audit

      - name: Importmap audit
        working-directory: apps/dashboard
        run: bin/importmap audit

      - name: Cache RuboCop
        if: github.actor != 'dependabot[bot]'
        uses: actions/cache@v6
        with:
          path: apps/dashboard/tmp/rubocop
          key: rubocop-${{ runner.os }}-${{ hashFiles('apps/dashboard/.rubocop.yml', 'apps/dashboard/Gemfile.lock') }}
          restore-keys: |
            rubocop-${{ runner.os }}-

      - name: RuboCop
        if: github.actor != 'dependabot[bot]'
        working-directory: apps/dashboard
        continue-on-error: true # Non-blocking
        run: bundle exec rubocop

  mcp-test:
    name: MCP Tests
    runs-on: ubuntu-24.04
    needs: detect-changes
    if: needs.detect-changes.outputs.mcp == 'true'
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/mcp

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Run tests
        run: bun test

  tutorials-build:
    name: Tutorials Build
    runs-on: ubuntu-24.04
    needs: detect-changes
    if: needs.detect-changes.outputs.tutorials == 'true'
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/tutorials/nextjs-email-validation

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6
        with:
          version: 10
          package_json_file: apps/tutorials/nextjs-email-validation/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/tutorials/nextjs-email-validation/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm build
        env:
          REQUIEMS_API: ci-placeholder
          BETTER_AUTH_SECRET: ci-placeholder-secret-0123456789abcdef0123

  clients-smoke:
    name: Clients Smoke Tests
    runs-on: ubuntu-24.04
    needs: detect-changes
    if: needs.detect-changes.outputs.clients == 'true'
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/clients

    # Build/typecheck only: example apps are not run because they would hit the live API (needs an API key).
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"

      - uses: actions/setup-go@v7
        with:
          go-version: "1.22.x"

      - name: Test TypeScript client
        run: |
          cd clients/typescript && npm install && npm run build
          cd ../../example-apps/typescript && npm install
          npx tsc --noEmit

      - name: Test C# client
        run: |
          cd example-apps/csharp && dotnet build

      - name: Test Python client
        run: |
          cd example-apps/python
          python3 -m venv venv
          source venv/bin/activate
          pip install urllib3 pydantic python-dateutil aiohttp
          python3 -c "import sys; sys.path.insert(0, '../../clients/python'); import openapi_client; openapi_client.AdviceApi; print('Python client imports OK')"

      - name: Test Ruby client
        run: |
          cd example-apps/ruby
          gem install typhoeus
          ruby -I ../../clients/ruby/lib -e "require 'openapi_client'; OpenapiClient::AdviceApi; puts 'Ruby client loads OK'"

      - name: Test Go client
        run: |
          cd clients/go && rm -rf test go.mod go.sum && go mod init openapi && go mod tidy && cd ../..
          cd example-apps/go && go mod tidy && go build -o /dev/null .

  skills-check:
    name: Skills Check
    runs-on: ubuntu-24.04
    needs: detect-changes
    if: needs.detect-changes.outputs.skills == 'true'
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/skills

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: apps/skills/.nvmrc
          cache: npm
          cache-dependency-path: apps/skills/package-lock.json

      - run: npm ci

      - run: npm pack --dry-run

      # Every committed SKILL.md must have loadable frontmatter, and the plugin
      # manifest version must match package.json.
      - name: Validate committed skills
        run: node scripts/validate.ts skills

      # The generator must still run against the current api_docs YAML and
      # produce valid skills.
      - name: Generator smoke test
        run: |
          node scripts/build/index.ts --source ../dashboard/config/api_docs --output "$RUNNER_TEMP/skills-out"
          node scripts/validate.ts "$RUNNER_TEMP/skills-out"

  ci-success:
    name: CI Success
    runs-on: ubuntu-24.04
    needs:
      - detect-changes
      - go-test
      - rails-test
      - rails-checks
      - mcp-test
      - tutorials-build
      - clients-smoke
      - skills-check
    if: always()

    steps:
      - name: Check all required jobs
        run: |
          if [[ "${{ needs.go-test.result }}" == "failure" ]]; then
            echo "❌ Go tests failed"
            exit 1
          fi

          if [[ "${{ needs.rails-test.result }}" == "failure" ]]; then
            echo "❌ Rails tests failed"
            exit 1
          fi

          if [[ "${{ needs.rails-checks.result }}" == "failure" ]]; then
            echo "❌ Rails security checks failed"
            exit 1
          fi

          if [[ "${{ needs.mcp-test.result }}" == "failure" ]]; then
            echo "❌ MCP tests failed"
            exit 1
          fi

          if [[ "${{ needs.tutorials-build.result }}" == "failure" ]]; then
            echo "❌ Tutorials build failed"
            exit 1
          fi

          if [[ "${{ needs.clients-smoke.result }}" == "failure" ]]; then
            echo "❌ Clients smoke tests failed"
            exit 1
          fi

          if [[ "${{ needs.skills-check.result }}" == "failure" ]]; then
            echo "❌ Skills check failed"
            exit 1
          fi

          echo "✅ All required checks passed!"
