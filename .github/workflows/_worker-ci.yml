name: Worker CI (Reusable)

# Reusable workflow for Cloudflare Worker apps.
# Callers pass app-path and app-name; this handles setup, typecheck, tests, lint.
# Deduplicates 3 near-identical setup blocks across worker-test and api-management-test.

on:
  workflow_call:
    inputs:
      app-path:
        description: "Path to the worker app (e.g. apps/workers/auth-gateway)"
        required: true
        type: string
      app-name:
        description: "Short name used for Codecov flags (e.g. auth-gateway)"
        required: true
        type: string
      has-lint:
        description: "Whether to run Biome lint + format check"
        required: false
        type: boolean
        default: false
    secrets:
      CODECOV_TOKEN:
        required: true

jobs:
  test:
    name: Test & Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: "10.26.0"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "pnpm"
          # Both lockfiles in cache key: shared dep changes correctly invalidate cache
          cache-dependency-path: |
            apps/workers/shared/pnpm-lock.yaml
            ${{ inputs.app-path }}/pnpm-lock.yaml

      - name: Install shared dependencies
        working-directory: apps/workers/shared
        run: pnpm install --frozen-lockfile

      - name: Install dependencies
        working-directory: ${{ inputs.app-path }}
        run: pnpm install --frozen-lockfile

      # Typecheck runs before tests: fast type errors surface without waiting for test suite
      - name: TypeScript check
        working-directory: ${{ inputs.app-path }}
        run: pnpm run typecheck

      - name: Run tests with coverage
        working-directory: ${{ inputs.app-path }}
        run: pnpm exec vitest run --coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ inputs.app-path }}/coverage/lcov.info
          flags: ${{ inputs.app-name }}

      - name: Upload shared coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ inputs.app-path }}/coverage/lcov.info
          flags: shared

      # Advisory lint: skipped for Dependabot (dep updates don't affect code style)
      - name: Biome lint
        if: inputs.has-lint && github.actor != 'dependabot[bot]'
        working-directory: ${{ inputs.app-path }}
        continue-on-error: true # Non-blocking
        run: pnpm run lint

      - name: Biome format check
        if: inputs.has-lint && github.actor != 'dependabot[bot]'
        working-directory: ${{ inputs.app-path }}
        continue-on-error: true # Non-blocking
        run: pnpm run format:check
